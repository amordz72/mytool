<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>الإدارة المحلية — الحسابات والأجهزة</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--line:#e5eaf0;--text:#172033;--muted:#6b7280;--accent:#4f46e5;--ok:#067647;--warn:#9a3412;--danger:#b42318;--shadow:0 8px 28px rgba(15,23,42,.08)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select{font:inherit}.wrap{max-width:1080px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .back{text-decoration:none;color:var(--accent);font-weight:900}.title h1{margin:0;font-size:24px}.title p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 14px;border-radius:12px;font-weight:900;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .panel{display:none}.panel.active{display:block}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
    .btn{border:0;border-radius:11px;padding:9px 13px;font-weight:900;cursor:pointer}.btn.primary{background:var(--accent);color:#fff}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.danger{background:#fff1f0;color:var(--danger);border:1px solid #fecaca}.btn:disabled{opacity:.5;cursor:not-allowed}
    .list{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
    .rowhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.name{font-size:17px;font-weight:900}.meta{color:var(--muted);font-size:11px;line-height:1.7;margin-top:4px;word-break:break-word}
    .status{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#f1f5f9;color:#475569}.status.active,.status.trusted,.status.accepted{background:#ecfdf3;color:var(--ok)}.status.pending,.status.pending_review{background:#fff7ed;color:var(--warn)}.status.rejected,.status.revoked,.status.expired,.status.blocked{background:#fff1f0;color:var(--danger)}
    .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.actions input,.actions select{flex:1;min-width:155px;border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#fff}
    .items{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;display:grid;gap:5px}.item{display:flex;justify-content:space-between;gap:10px;font-size:13px}.total{font-size:19px;font-weight:900;color:var(--accent)}
    .msg{margin-bottom:12px;padding:10px 12px;border-radius:12px;background:#eef2ff;color:#3730a3;font-weight:800;font-size:13px}.msg.err{background:#fff1f0;color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:22px;border:1px dashed var(--line);border-radius:14px;background:#fff}
    .create-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.create-grid input,.create-grid select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff}.create-grid .btn{width:100%}
    .pin{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:#f1f5f9;color:#475569}.pin.ok{background:#ecfdf3;color:var(--ok)}.pin.locked{background:#fff1f0;color:var(--danger)}
    .note{margin-top:8px;color:var(--muted);font-size:11px;line-height:1.7}
    @media(max-width:760px){.wrap{padding:12px}.top{align-items:flex-start}.title h1{font-size:21px}.rowhead{flex-direction:column}.create-grid{grid-template-columns:1fr 1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions input,.actions select{grid-column:1/-1;width:100%;min-width:0}.actions .wide{grid-column:1/-1}}
    @media(max-width:480px){.create-grid{grid-template-columns:1fr}.tabs{display:grid;grid-template-columns:repeat(3,1fr)}.tab{padding:9px 7px}}
  </style>
  <script src="../auth-guard.js?v=20260923-account-pin1" data-access="admin" data-nav="off"></script>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div class="title"><h1>الإدارة المحلية</h1><p>حسابات المستخدمين، الأجهزة المعتمدة، وتقارير M2.</p></div>
    <a class="back" href="../">← My Tools</a>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="accounts" type="button">الحسابات</button>
    <button class="tab" data-tab="devices" type="button">الأجهزة</button>
    <button class="tab" data-tab="reports" type="button">التقارير</button>
  </div>

  <div id="message" class="msg" hidden></div>

  <section id="accountsPanel" class="panel active">
    <div class="card" style="margin-bottom:12px">
      <div class="rowhead"><div><div class="name">إنشاء حساب مستخدم</div><div class="meta">أنت ترسل له اسم المستخدم وكلمة المرور، وهو يطلب اعتماد جهازه أول مرة.</div></div></div>
      <div class="create-grid" style="margin-top:12px">
        <input id="newDisplayName" placeholder="الاسم الظاهر">
        <input id="newUsername" placeholder="اسم المستخدم" autocomplete="off">
        <input id="newPassword" type="password" minlength="6" placeholder="كلمة مرور مؤقتة" autocomplete="new-password">
        <select id="newRole">
          <option value="worker">عامل</option>
          <option value="standard" selected>مستخدم عادي</option>
          <option value="service_partner">حساب خدمة</option>
        </select>
        <button id="createAccountBtn" class="btn primary" type="button" style="grid-column:1/-1">إنشاء الحساب</button>
      </div>
    </div>
    <div class="toolbar"><strong>الحسابات</strong><button id="refreshAccounts" class="btn secondary" type="button">↻ تحديث</button></div>
    <div id="accounts" class="list"></div>
  </section>

  <section id="devicesPanel" class="panel">
    <div class="toolbar"><strong>الأجهزة</strong><button id="refreshDevices" class="btn secondary" type="button">↻ تحديث</button></div>
    <div class="note" style="margin-bottom:10px">PIN لا يمكن استخراجه كنص. إذا نُسي أو شككت في الجهاز استعمل «إعادة تعيين PIN» أو «إلغاء الجهاز».</div>
    <div id="devices" class="list"></div>
  </section>

  <section id="reportsPanel" class="panel">
    <div class="toolbar"><strong>التقارير الواردة</strong><button id="refreshReports" class="btn secondary" type="button">↻ تحديث</button></div>
    <div id="reports" class="list"></div>
  </section>
</main>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://wqyebqzbbpohbnznqdjj.supabase.co';
const SUPABASE_KEY='sb_publishable_gO4umNBMJ0AWRk19HtKd7A_9X4DibYj';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let accounts=[],devices=[],reports=[];

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return new Intl.NumberFormat('fr-DZ').format(Number(n)||0)+' دج'}
function date(v){if(!v)return '—';try{return new Date(v).toLocaleString('ar-DZ')}catch{return String(v)}}
function roleLabel(r){return ({worker:'عامل',standard:'مستخدم عادي',service_partner:'حساب خدمة',workspace_admin:'إدارة تشغيل'}[r]||r||'—')}
function statusLabel(s){return ({pending:'بانتظار الاعتماد',trusted:'معتمد',active:'نشط',rejected:'مرفوض',revoked:'ملغى',expired:'منتهي',pending_review:'بانتظار المراجعة',accepted:'مقبول'}[s]||s||'—')}
function friendlyError(e){
  const s=String(e?.message||e||'');
  const map={
    MFA_REQUIRED:'هذه العملية تحتاج تحقق MFA للإدارة.',
    ADMIN_REQUIRED:'هذه الصفحة للإدارة فقط.',
    USERNAME_ALREADY_EXISTS:'اسم المستخدم موجود من قبل.',
    PASSWORD_TOO_SHORT:'كلمة المرور لازم تكون 6 أحرف أو أرقام على الأقل.',
    ACCOUNT_NOT_FOUND:'الحساب غير موجود.',
    DEVICE_REQUEST_NOT_PENDING:'طلب الجهاز لم يعد بانتظار الموافقة.',
    TRUST_NOT_ACTIVE:'الجهاز غير معتمد حاليًا.'
  };
  for(const [k,v] of Object.entries(map))if(s.includes(k))return v;
  return s||'تعذر تنفيذ العملية.';
}
function msg(text,error=false){const e=$('message');e.textContent=text;e.className='msg'+(error?' err':'');e.hidden=false;clearTimeout(msg.t);msg.t=setTimeout(()=>e.hidden=true,4500)}
function rpc(name,args={}){return supabase.rpc(name,args).then(({data,error})=>{if(error)throw error;return data})}

async function requireSession(){
  const {data}=await supabase.auth.getSession();
  if(!data.session)throw new Error('جلسة Supabase غير موجودة. ارجع للرئيسية وسجل الدخول كإدارة.');
}

async function loadAccounts(){
  $('refreshAccounts').disabled=true;
  try{
    await requireSession();
    const data=await rpc('admin_account_list');
    accounts=Array.isArray(data?.accounts)?data.accounts:[];
    renderAccounts();
  }catch(e){accounts=[];renderAccounts();msg(friendlyError(e),true)}
  finally{$('refreshAccounts').disabled=false}
}

function renderAccounts(){
  const host=$('accounts');
  if(!accounts.length){host.innerHTML='<div class="empty">لا توجد حسابات مستخدمين.</div>';return}
  host.innerHTML=accounts.map(a=>
    '<article class="card" data-account="'+esc(a.id)+'">'+
      '<div class="rowhead"><div><div class="name">'+esc(a.display_name)+'</div>'+
      '<div class="meta">@'+esc(a.username)+' · أجهزة معتمدة: '+esc(a.trusted_devices||0)+' · طلبات أجهزة: '+esc(a.pending_devices||0)+'</div></div>'+
      '<span class="status '+(a.active?'active':'revoked')+'">'+(a.active?'نشط':'موقوف')+'</span></div>'+
      '<div class="actions">'+
        '<input data-account-name value="'+esc(a.display_name)+'" placeholder="الاسم الظاهر">'+
        '<select data-account-role>'+
          '<option value="worker" '+(a.account_role==='worker'?'selected':'')+'>عامل</option>'+
          '<option value="standard" '+(a.account_role==='standard'?'selected':'')+'>مستخدم عادي</option>'+
          '<option value="service_partner" '+(a.account_role==='service_partner'?'selected':'')+'>حساب خدمة</option>'+
        '</select>'+
        '<select data-account-active><option value="1" '+(a.active?'selected':'')+'>نشط</option><option value="0" '+(!a.active?'selected':'')+'>موقوف</option></select>'+
        '<button class="btn secondary" data-account-action="save" type="button">حفظ الحساب</button>'+
        '<input data-new-password type="password" minlength="6" placeholder="كلمة مرور جديدة" autocomplete="new-password">'+
        '<button class="btn danger" data-account-action="password" type="button">تغيير كلمة المرور</button>'+
      '</div>'+
      '<div class="note">تغيير كلمة المرور يلغي الجلسات ويمسح PIN من الأجهزة المعتمدة، ثم ينشئ المستخدم PIN جديدًا بعد التحقق.</div>'+
    '</article>'
  ).join('');
}

async function createAccount(){
  const displayName=$('newDisplayName').value.trim();
  const username=$('newUsername').value.trim();
  const password=$('newPassword').value;
  const role=$('newRole').value;
  if(!username){$('newUsername').focus();return}
  if(password.length<6){msg('كلمة المرور لازم تكون 6 أحرف أو أرقام على الأقل.',true);$('newPassword').focus();return}
  const btn=$('createAccountBtn');btn.disabled=true;btn.textContent='جاري الإنشاء…';
  try{
    await requireSession();
    await rpc('admin_account_create',{
      p_username:username,p_password:password,p_display_name:displayName||username,p_account_role:role
    });
    $('newDisplayName').value='';$('newUsername').value='';$('newPassword').value='';
    msg('تم إنشاء الحساب. أرسل اسم المستخدم وكلمة المرور للشخص.');
    await loadAccounts();
  }catch(e){msg(friendlyError(e),true)}
  finally{btn.disabled=false;btn.textContent='إنشاء الحساب'}
}

async function accountAction(card,action){
  const id=Number(card.dataset.account);
  try{
    await requireSession();
    if(action==='save'){
      await rpc('admin_account_update',{
        p_account_id:id,
        p_display_name:card.querySelector('[data-account-name]').value.trim(),
        p_account_role:card.querySelector('[data-account-role]').value,
        p_active:card.querySelector('[data-account-active]').value==='1'
      });
      msg('تم تحديث الحساب.');
    }else if(action==='password'){
      const input=card.querySelector('[data-new-password]');
      const pwd=input.value;
      if(pwd.length<6){msg('كلمة المرور الجديدة لازم تكون 6 أحرف أو أرقام على الأقل.',true);input.focus();return}
      await rpc('admin_account_reset_password',{p_account_id:id,p_new_password:pwd});
      input.value='';
      msg('تم تغيير كلمة المرور وإلغاء الجلسات وPIN القديمة.');
    }
    await Promise.all([loadAccounts(),loadDevices()]);
  }catch(e){msg(friendlyError(e),true)}
}

async function loadDevices(){
  $('refreshDevices').disabled=true;
  try{
    await requireSession();
    const data=await rpc('admin_account_list_devices');
    devices=Array.isArray(data?.devices)?data.devices:[];
    renderDevices();
  }catch(e){devices=[];renderDevices();msg(friendlyError(e),true)}
  finally{$('refreshDevices').disabled=false}
}

function renderDevices(){
  const host=$('devices');
  if(!devices.length){host.innerHTML='<div class="empty">لا توجد طلبات أجهزة بعد.</div>';return}
  host.innerHTML=devices.map(d=>{
    const pending=d.status==='pending',trusted=d.status==='trusted';
    const pinClass=d.pin_locked?'locked':d.pin_set?'ok':'';
    const pinText=d.pin_locked?'PIN مقفول':d.pin_set?'PIN مضبوط':'PIN غير مضبوط';
    return '<article class="card" data-trust="'+esc(d.trust_id)+'">'+
      '<div class="rowhead"><div><div class="name">'+esc(d.display_name)+'</div>'+
      '<div class="meta">@'+esc(d.username)+' · '+esc(roleLabel(d.account_role))+'<br>الجهاز: '+esc(String(d.public_device_id||'').slice(0,12))+'… · '+esc(d.device_label||'جهاز')+'<br>آخر اتصال: '+esc(date(d.last_seen_at))+'</div></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap"><span class="status '+esc(d.status)+'">'+esc(statusLabel(d.status))+'</span><span class="pin '+pinClass+'">'+pinText+'</span></div></div>'+
      '<div class="actions">'+
        (pending?'<button class="btn primary wide" data-device-action="approve" type="button">اعتماد الجهاز</button><button class="btn danger wide" data-device-action="reject" type="button">رفض</button>':'')+
        (trusted?'<button class="btn secondary wide" data-device-action="reset-pin" type="button">إعادة تعيين PIN</button><button class="btn danger wide" data-device-action="revoke" type="button">إلغاء الجهاز</button>':'')+
      '</div>'+
      (d.pin_locked?'<div class="note" style="color:#b42318">تم قفل PIN بعد محاولات خاطئة. أعد تعيين PIN بعد التأكد من هوية الشخص.</div>':'')+
    '</article>';
  }).join('');
}

async function deviceAction(card,action){
  const trustId=card.dataset.trust;
  try{
    await requireSession();
    if(action==='approve'){
      await rpc('core_admin_review_device_request',{p_trust_id:trustId,p_action:'approve',p_trusted_days:30,p_reason:null});
      msg('تم اعتماد الجهاز. المستخدم يقدر الآن ينشئ PIN.');
    }else if(action==='reject'){
      await rpc('core_admin_review_device_request',{p_trust_id:trustId,p_action:'reject',p_trusted_days:30,p_reason:'رفض من الإدارة'});
      msg('تم رفض الجهاز.');
    }else if(action==='reset-pin'){
      await rpc('admin_account_reset_device_pin',{p_trust_id:trustId});
      msg('تم مسح PIN والجلسات. المستخدم لازم يدخل بكلمة المرور وينشئ PIN جديدًا.');
    }else if(action==='revoke'){
      await rpc('core_admin_revoke_device',{p_trust_id:trustId,p_reason:'إلغاء من الإدارة'});
      msg('تم إلغاء الجهاز وجلساته.');
    }
    await Promise.all([loadAccounts(),loadDevices()]);
  }catch(e){msg(friendlyError(e),true)}
}

async function loadReports(){
  $('refreshReports').disabled=true;
  try{
    await requireSession();
    const data=await rpc('admin_m2_list_reports',{p_status:null,p_limit:100});
    reports=Array.isArray(data?.reports)?data.reports:[];
    renderReports();
  }catch(e){reports=[];renderReports();msg(friendlyError(e),true)}
  finally{$('refreshReports').disabled=false}
}

function renderReports(){
  const host=$('reports');
  if(!reports.length){host.innerHTML='<div class="empty">لا توجد تقارير واردة بعد.</div>';return}
  host.innerHTML=reports.map(r=>{
    const items=Array.isArray(r.payload?.items)?r.payload.items:[];
    const pending=r.status==='pending_review';
    const deviceActive=r.device_status==='active';
    return '<article class="card" data-report="'+esc(r.id)+'">'+
      '<div class="rowhead"><div><div class="name">'+esc(r.display_name)+'</div>'+
      '<div class="meta">Revision '+esc(r.revision)+' · وصل: '+esc(date(r.received_at))+'<br>الجهاز: '+esc(String(r.public_device_id||'').slice(0,12))+'…</div></div>'+
      '<span class="status '+esc(r.status)+'">'+esc(statusLabel(r.status))+'</span></div>'+
      '<div class="items">'+items.map((x,i)=>'<div class="item"><span>'+(i+1)+'. '+esc(x.name)+'</span><strong>'+esc(fmt(x.amount))+'</strong></div>').join('')+'</div>'+
      '<div class="item" style="margin-top:10px"><strong>الإجمالي</strong><span class="total">'+esc(fmt(r.total_amount))+'</span></div>'+
      (pending?'<div class="actions"><button class="btn primary wide" data-report-action="accept" type="button" '+(deviceActive?'':'disabled')+'>اعتماد التقرير</button><button class="btn danger wide" data-report-action="reject" type="button">رفض التقرير</button></div>':'')+
    '</article>';
  }).join('');
}

async function reportAction(card,action){
  try{
    await rpc('admin_m2_review_report',{p_report_id:card.dataset.report,p_action:action,p_note:null});
    msg(action==='accept'?'تم اعتماد التقرير.':'تم رفض التقرير.');
    await loadReports();
  }catch(e){msg(friendlyError(e),true)}
}

document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));
  $('accountsPanel').classList.toggle('active',btn.dataset.tab==='accounts');
  $('devicesPanel').classList.toggle('active',btn.dataset.tab==='devices');
  $('reportsPanel').classList.toggle('active',btn.dataset.tab==='reports');
  if(btn.dataset.tab==='accounts')loadAccounts();
  if(btn.dataset.tab==='devices')loadDevices();
  if(btn.dataset.tab==='reports')loadReports();
}));

$('createAccountBtn').addEventListener('click',createAccount);
$('refreshAccounts').addEventListener('click',loadAccounts);
$('refreshDevices').addEventListener('click',loadDevices);
$('refreshReports').addEventListener('click',loadReports);
$('accounts').addEventListener('click',e=>{const b=e.target.closest('[data-account-action]');if(b)accountAction(b.closest('[data-account]'),b.dataset.accountAction)});
$('devices').addEventListener('click',e=>{const b=e.target.closest('[data-device-action]');if(b)deviceAction(b.closest('[data-trust]'),b.dataset.deviceAction)});
$('reports').addEventListener('click',e=>{const b=e.target.closest('[data-report-action]');if(b)reportAction(b.closest('[data-report]'),b.dataset.reportAction)});

await loadAccounts();
await loadDevices();
await loadReports();
</script>
</body>
</html>
