<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>صندوق الملاحظات — MyTool</title>
<script src="../auth-guard.js?v=20260917-continuity-2" data-access="admin"></script>
<link rel="stylesheet" href="visual-choice.css?v=20260914-2045">
<style>
:root{--teal:#117f78;--mint:#18bca9;--ink:#111827;--muted:#6b7280;--line:#d9e1e7;--bg:#f4f7fb;--red:#b42318;--amber:#b54708}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}header h1{font-size:20px;margin:0}.back{color:var(--teal);text-decoration:none;font-weight:700}
main{max-width:900px;margin:auto;padding:16px}.panel,.note{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px #102a4310}
textarea,input,select,button{font:inherit}textarea,input,select{width:100%;border:1px solid #cfd8df;border-radius:14px;padding:12px;background:#fff}textarea{min-height:118px;resize:vertical}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.full{grid-column:1/-1}
button{border:0;border-radius:14px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--teal),var(--mint));color:#fff}.outline{background:#fff;color:var(--teal);border:1px solid var(--teal)}.settings-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:12px;padding:9px 12px;font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{display:none;margin:10px 0;padding:12px;border-radius:12px}.msg.ok{display:block;background:#e9fbf6;color:#06715f}.msg.err{display:block;background:#fff0ef;color:var(--red)}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.note-head{display:flex;gap:8px;align-items:center;justify-content:space-between}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:12px;background:#eef4f7;border-radius:999px;padding:6px 9px}.urgent{background:#fee4e2;color:var(--red)}.high{background:#fff3dc;color:var(--amber)}
.badge.sync{font-weight:800}.badge.sync.pending,.badge.sync.pending_update,.badge.sync.pending_images{background:#fff7ed;color:#9a3412}.badge.sync.sync_error,.badge.sync.conflict{background:#fff1f2;color:#b42318}.badge.sync.synced{background:#ecfdf5;color:#047857}
.sync-wrap{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;margin-bottom:12px}.sync-state{padding:10px 12px;border-radius:12px;font-size:12px;line-height:1.7;background:#eef8ff;color:#14668e}.sync-state.local,.sync-state.pending{background:#fff7ed;color:#9a3412}.sync-state.warn{background:#fff1f2;color:#b42318}.sync-state.synced{background:#ecfdf5;color:#047857}#syncNow{white-space:nowrap}
.note-body{white-space:pre-wrap;line-height:1.7;margin:12px 0;position:relative}.note-body.collapsed{max-height:10.5rem;overflow:hidden}.note-body.collapsed:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3.2rem;background:linear-gradient(transparent,#fff)}.more{padding:8px 12px}.ai{background:#f0fdfa;border-right:4px solid var(--mint);padding:10px;border-radius:10px;margin:8px 0}.meta{font-size:12px;color:var(--muted)}.summary{margin-top:10px;color:var(--muted);font-size:13px}
.images{display:flex;gap:8px;overflow:auto;margin-top:10px}.images img{width:92px;height:92px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:pointer}.empty{text-align:center;color:var(--muted);padding:30px}.selectline{display:flex;align-items:center;gap:8px}.selectline input{width:auto}
#viewer{position:fixed;inset:0;background:#000d;display:none;z-index:20;align-items:center;justify-content:center;padding:18px}#viewer.open{display:flex}#viewer img{max-width:100%;max-height:90vh;border-radius:12px}small{color:var(--muted)}
@media(max-width:640px){.row,.toolbar,.sync-wrap{grid-template-columns:1fr}.note-head{align-items:flex-start}.panel,.note{border-radius:16px}#syncNow{width:100%}}
</style>
</head>
<body data-mytool-app="notes">
<header><h1>📝 صندوق الملاحظات</h1><a class="back" href="../">الرئيسية ←</a></header>
<main>
<section class="panel">
<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h2 style="margin:0">ملاحظة سريعة</h2><a class="outline settings-link" href="settings.html">⚙️ إعدادات الذكاء</a></div>
<div class="sync-wrap"><div id="syncState" class="sync-state">جاري تحديد وضع الحفظ…</div><button id="syncNow" class="outline" type="button" hidden>↻ مزامنة الآن</button></div>
<textarea id="body" maxlength="10000" placeholder="اكتب الملاحظة بدل إرسالها في واتساب…"></textarea>
<div id="smartHint" class="summary">اكتب الملاحظة وسيقترح MyTool النوع والأولوية والقسم تلقائيًا.</div>
<div class="row">
<label>النوع<select id="type"><option value="UNCATEGORIZED">بدون تصنيف</option><option value="BUG">خطأ</option><option value="NEEDS_CONFIRMATION">يحتاج تأكيد عمر</option><option value="AI_REQUEST">طلب للذكاء الاصطناعي</option><option value="TASK">مهمة</option><option value="IDEA">فكرة</option><option value="PRODUCT_INVENTORY">منتج أو مخزون</option><option value="REFERENCE">مرجع</option></select></label>
<label>الأولوية<select id="priority"><option value="NORMAL">عادي</option><option value="URGENT">عاجل</option><option value="HIGH">مرتفع</option><option value="LOW">منخفض</option></select></label>
<label>القسم<select id="area"><option value="MYTOOL">MyTool</option><option value="NOTES">الملاحظات</option><option value="TEHNA_CONNECT">Tehna Connect</option><option value="SHOP">المحل</option><option value="PRODUCT">منتج</option><option value="GENERAL">عام</option></select></label>
<label>صور اختيارية<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>حتى 6 صور، 10MB للصورة. الصور الجديدة تحفظ محليًا أيضًا حتى تتم المزامنة.</small></label>
<label class="full">ماذا تريد من الذكاء الاصطناعي؟ (اختياري)<input id="ai" maxlength="2000" placeholder="مثال: شخّص الخطأ واقترح الخطوة التالية"></label>
</div>
<div class="actions"><button id="save" class="primary">حفظ الملاحظة</button><button id="clear" class="outline">تفريغ</button></div><div id="message" class="msg"></div>
</section>
<section class="panel">
<div class="toolbar"><input id="search" placeholder="بحث في الملاحظات"><select id="statusFilter"><option value="ACTIVE" selected>الحالية — الأرشيف مخفي</option><option value="NEW">جديدة</option><option value="NEEDS_OMAR">تحتاج عمر</option><option value="READY">جاهزة</option><option value="IN_PROGRESS">قيد العمل</option><option value="DONE">منتهية</option><option value="ARCHIVED">الأرشيف فقط</option><option value="ALL">الكل بما فيه الأرشيف</option></select><select id="typeFilter"><option value="">كل الأنواع</option></select></div>
<div class="actions"><button id="copy" class="outline">نسخ المحدد للذكاء الاصطناعي</button><button id="txt" class="outline">تحميل TXT</button><button id="json" class="outline">نسخة JSON</button></div><div id="summary" class="summary"></div>
</section>
<div id="list"></div>
</main>
<div id="viewer"><img alt="معاينة الصورة"></div>
<script src="visual-choice.js?v=20260914-2045"></script>
<script src="notes-list-tools.js?v=20260916-0013"></script>
<script src="notes-local-store.js?v=20260917-localfirst-1"></script>
<script src="notes-app.js?v=20260921-smart-rules-1"></script>
<script src="notes-edit.js?v=20260921-notes-area-1" data-mytool-notes-edit="1"></script>
</body></html>
