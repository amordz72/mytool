<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0f766e">
  <title>حساب المحل — MyTool</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--main:#0f766e;--main2:#14b8a6;--danger:#b91c1c}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--text)}
    [v-cloak]{display:none}.app{max-width:900px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .back{color:var(--main);text-decoration:none;font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 5px 18px rgba(15,23,42,.05)}
    h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}input,select,textarea,button{width:100%;font:inherit;border-radius:12px;border:1px solid var(--line);padding:12px;background:#fff}
    textarea{min-height:70px;resize:vertical}.btn{border:0;background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}
    .btn.secondary{background:#fff;color:var(--main);border:1px solid var(--main)}.btn.danger{background:#fff;color:var(--danger);border:1px solid #fecaca}.error{background:#fff1f2;color:var(--danger);padding:10px;border-radius:12px;margin-top:10px;font-size:13px}
    .ok{background:#ecfdf5;color:#047857;padding:10px;border-radius:12px;margin-top:10px;font-size:13px}.stock{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .stock-item{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}.stock-name{font-size:13px}.stock-num{font-size:23px;font-weight:900;margin-top:5px}
    .toolbar{display:flex;gap:8px;align-items:center}.toolbar button{width:auto;padding:9px 13px}.pill{display:inline-block;background:#ecfeff;color:#0f766e;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}
    .login{max-width:460px;margin:7vh auto}.login h1{margin-bottom:8px}.login .field{margin-bottom:11px}.identity{margin-top:5px;font-size:13px;font-weight:700}.soon{opacity:.65}.footer{text-align:center;color:var(--muted);font-size:11px;padding:10px}
    .dashboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}.metric{background:linear-gradient(135deg,#ffffff,#f0fdfa);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(15,23,42,.04)}.metric-label{font-size:12px;color:var(--muted);font-weight:700}.metric-value{font-size:24px;font-weight:900;margin-top:6px;color:var(--text)}.metric small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.worker-list{display:grid;gap:8px;margin-top:14px}.worker-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}.worker-meta{min-width:0}.worker-meta small{display:block;color:var(--muted);margin-top:3px;word-break:break-word}.worker-actions{display:flex;gap:6px;flex-shrink:0}.worker-actions button{width:auto;padding:7px 9px;font-size:12px}.status-on{color:#047857;font-weight:800}.status-off{color:var(--danger);font-weight:800}.setting-line{display:flex;gap:10px;align-items:end}.setting-line>div{flex:1}.setting-line button{width:auto;min-width:110px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.tab{width:auto;padding:9px 13px;background:#fff;color:var(--main);border:1px solid var(--line);font-weight:800;cursor:pointer}.tab.active{background:var(--main);color:#fff;border-color:var(--main)}.product-list,.count-list{display:grid;gap:9px}.product-row,.count-row{border:1px solid var(--line);border-radius:14px;padding:12px;background:#f8fafc}.product-row{display:flex;gap:8px;align-items:center}.product-row input{flex:1}.product-row button{width:auto;min-width:80px}.count-row{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(90px,.6fr));gap:8px;align-items:center}.count-name{font-weight:800}.count-label{font-size:11px;color:var(--muted);margin-bottom:4px}.diff{font-weight:900;font-size:18px}.diff.plus{color:#047857}.diff.minus{color:var(--danger)}.audit-summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.audit-summary .pill{font-size:12px}.section-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.section-actions button{width:auto}.empty{padding:14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.shop-shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;max-width:1180px;margin:auto;padding:16px}.shop-main{min-width:0}.sidebar{position:sticky;top:16px;height:calc(100vh - 32px);background:#0f172a;color:#e5e7eb;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 45px rgba(15,23,42,.18)}.side-brand{display:flex;align-items:center;gap:10px;padding:4px 2px 14px;border-bottom:1px solid rgba(255,255,255,.1)}.brand-mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#14b8a6,#0f766e);font-weight:900;color:#fff}.side-brand strong{display:block;color:#fff;font-size:16px}.side-brand small{display:block;color:#94a3b8;margin-top:2px}.side-nav{display:grid;gap:6px}.side-link{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;border:0;background:transparent;color:#cbd5e1;text-decoration:none;font-weight:700;text-align:right;cursor:pointer}.side-link:hover,.side-link.active{background:rgba(20,184,166,.14);color:#fff}.side-link .ico{width:24px;text-align:center;font-size:17px}.side-spacer{flex:1}.side-footer{border-top:1px solid rgba(255,255,255,.1);padding-top:12px}.side-user{font-size:12px;color:#94a3b8;margin-bottom:9px}.menu-toggle{display:none;width:auto;padding:10px 12px}.mobile-overlay{display:none}.dash-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f172a,#134e4a);color:#fff;border:0;border-radius:24px;padding:22px;box-shadow:0 18px 40px rgba(15,23,42,.18)}.dash-hero:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06);left:-50px;top:-70px}.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;position:relative;z-index:1}.hero-eyebrow{font-size:12px;color:#99f6e4;font-weight:800;margin-bottom:5px}.hero-title{font-size:27px;font-weight:900;margin:0}.hero-sub{font-size:13px;color:#cbd5e1;margin-top:7px}.live-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}.live-dot{width:8px;height:8px;border-radius:50%;background:#5eead4;box-shadow:0 0 0 4px rgba(94,234,212,.12)}.metrics-pro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px;position:relative;z-index:1}.metric-pro{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:14px;backdrop-filter:blur(8px)}.metric-pro .mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#cbd5e1;font-size:12px}.metric-pro .mico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:15px}.metric-pro .mvalue{font-size:26px;font-weight:900;margin-top:9px}.metric-pro .msub{font-size:11px;color:#94a3b8;margin-top:2px}.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}.quick-actions a,.quick-actions button{width:auto;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;padding:9px 12px;border-radius:11px;text-decoration:none;font-weight:800;font-size:12px;cursor:pointer}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.section-title h2{margin:0}.section-kicker{font-size:11px;color:var(--main);font-weight:900;margin-bottom:4px}.alert-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:11px 13px;margin-top:12px;font-size:12px}.alert-card strong{color:#9a3412}.content-card{scroll-margin-top:14px}
    @media(max-width:860px){.shop-shell{display:block;padding:10px}.shop-main{width:100%}.sidebar{position:fixed;z-index:50;top:0;right:0;height:100vh;width:min(82vw,290px);border-radius:0 0 0 22px;transform:translateX(110%);transition:transform .2s ease}.sidebar.open{transform:translateX(0)}.mobile-overlay{display:block;position:fixed;z-index:40;inset:0;background:rgba(15,23,42,.48)}.menu-toggle{display:inline-block}.metrics-pro{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-title{font-size:23px}}@media(max-width:620px){.dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.stock{grid-template-columns:1fr}.app{padding:0}.top{align-items:flex-start}.toolbar{flex-wrap:wrap}.worker-row{align-items:flex-start;flex-direction:column}.worker-actions{width:100%}.worker-actions button{flex:1}.setting-line{align-items:stretch;flex-direction:column}.setting-line button{width:100%}.count-row{grid-template-columns:1fr 1fr}.count-name{grid-column:1/-1}.product-row{align-items:stretch;flex-direction:column}.product-row button{width:100%}.section-actions button{flex:1;min-width:130px}.metrics-pro{grid-template-columns:1fr 1fr}.dash-hero{padding:17px;border-radius:20px}.metric-pro{padding:11px}.metric-pro .mvalue{font-size:22px}.hero-top{align-items:center}.quick-actions{display:grid;grid-template-columns:1fr 1fr}.quick-actions a,.quick-actions button{width:100%;text-align:center}}
  </style>
</head>
<body>
<div id="app" class="app" v-cloak>
  <template v-if="loading"><div class="card">جاري التحقق من جلسة MyTool…</div></template>

  <template v-else-if="!isLoggedIn">
    <section class="card login">
      <a class="back" href="../">← MyTool</a>
      <h1>حساب المحل</h1>
      <p class="muted">يتم تسجيل الدخول من الصفحة الرئيسية لـ MyTool.</p>
    </section>
  </template>

  <template v-else>
    <div class="shop-shell">
      <div v-if="sidebarOpen" class="mobile-overlay" @click="sidebarOpen=false"></div>
      <aside class="sidebar" :class="{open:sidebarOpen}">
        <div class="side-brand">
          <div class="brand-mark">MT</div>
          <div><strong>MyTool</strong><small>إدارة المحل</small></div>
        </div>
        <nav class="side-nav">
          <a class="side-link active" href="#dashboard" @click="sidebarOpen=false"><span class="ico">⌂</span><span>لوحة التحكم</span></a>
          <a class="side-link" href="#sale" @click="sidebarOpen=false"><span class="ico">＋</span><span>تسجيل بيع</span></a>
          <a class="side-link" href="#inventory" @click="inventoryTab='stock';sidebarOpen=false"><span class="ico">▦</span><span>المخزون</span></a>
          <a v-if="userMode==='admin'" class="side-link" href="#inventory" @click="inventoryTab='products';sidebarOpen=false"><span class="ico">◇</span><span>المنتجات</span></a>
          <a v-if="userMode==='admin'" class="side-link" href="#inventory" @click="openPhysicalCount();sidebarOpen=false"><span class="ico">✓</span><span>الجرد الفعلي</span></a>
          <a v-if="userMode==='admin'" class="side-link" href="#users" @click="sidebarOpen=false"><span class="ico">♙</span><span>المستخدمون</span></a>
          <a v-if="userMode==='admin'" class="side-link" href="#settings" @click="sidebarOpen=false"><span class="ico">⚙</span><span>الإعدادات</span></a>
          <a class="side-link" href="../"><span class="ico">↩</span><span>رئيسية MyTool</span></a>
        </nav>
        <div class="side-spacer"></div>
        <div class="side-footer">
          <div class="side-user">{{ userMode==='admin' ? 'حساب الإدارة' : ('الخدام: '+workerNickname) }}</div>
          <button class="side-link" @click="logout"><span class="ico">⇥</span><span>تسجيل الخروج</span></button>
        </div>
      </aside>
      <main class="shop-main">
    <header class="top">
      <div>
        <a class="back" href="../">← MyTool</a>
        <h1>حساب المحل</h1>
        <span class="pill">{{ userMode==='admin' ? 'إدارة' : 'خدام' }}</span>
        <div v-if="userMode==='worker'" class="identity">مرحبًا {{ workerNickname }}</div>
      </div>
      <div class="toolbar">
        <button class="btn secondary menu-toggle" @click="sidebarOpen=true">☰ القائمة</button>
        <button class="btn secondary" @click="loadAll" :disabled="busy">تحديث</button>
        <button class="btn secondary" @click="logout">خروج</button>
      </div>
    </header>

    <section id="dashboard" class="dash-hero content-card">
      <div class="hero-top">
        <div>
          <div class="hero-eyebrow">MYTOOL / SHOP CONTROL</div>
          <h2 class="hero-title">لوحة تحكم المحل</h2>
          <div class="hero-sub">صورة مباشرة للمبيعات والمخزون وحالة المنتجات اليوم.</div>
        </div>
        <span class="live-badge"><span class="live-dot"></span> مباشر</span>
      </div>
      <div class="metrics-pro">
        <div class="metric-pro"><div class="mhead"><span>المنتجات</span><span class="mico">▦</span></div><div class="mvalue">{{ products.length }}</div><div class="msub">منتج مسجل</div></div>
        <div class="metric-pro"><div class="mhead"><span>إجمالي المخزون</span><span class="mico">◫</span></div><div class="mvalue">{{ stockUnits }}</div><div class="msub">وحدة متاحة حسب الحركات</div></div>
        <div v-if="userMode==='admin'" class="metric-pro"><div class="mhead"><span>عمليات اليوم</span><span class="mico">↗</span></div><div class="mvalue">{{ todaySalesCount }}</div><div class="msub">عملية بيع مسجلة</div></div>
        <div v-if="userMode==='admin'" class="metric-pro"><div class="mhead"><span>مبيعات اليوم</span><span class="mico">دج</span></div><div class="mvalue">{{ money(todayRevenue) }}</div><div class="msub">دينار جزائري</div></div>
      </div>
      <div class="quick-actions">
        <a href="#sale">＋ بيع جديد</a>
        <a href="#inventory" @click="inventoryTab='stock'">▦ عرض المخزون</a>
        <a v-if="userMode==='admin'" href="#inventory" @click="openPhysicalCount">✓ جرد فعلي</a>
        <button @click="loadAll" :disabled="busy">↻ تحديث البيانات</button>
      </div>
      <div v-if="userMode==='admin' && lowStockCount>0" class="alert-card"><span><strong>تنبيه مخزون:</strong> {{ lowStockCount }} منتجات كميتها 2 أو أقل.</span><span>منها {{ outOfStockCount }} نافد</span></div>
    </section>

    <section id="sale" class="card content-card">
      <div class="section-title"><div><div class="section-kicker">المبيعات</div><h2>تسجيل بيع</h2></div><span class="pill">عملية جديدة</span></div>
      <form @submit.prevent="saveSale">
        <div class="grid">
          <div v-if="userMode==='admin'">
            <label>الخدام / المسجل</label>
            <select v-model.number="sale.sold_by" required>
              <option disabled value="">اختر</option>
              <option v-for="s in staff" :key="s.id" :value="s.id">{{ s.name }}</option>
            </select>
          </div>
          <div>
            <label>السلعة</label>
            <select v-model.number="sale.product_id" required>
              <option disabled value="">اختر</option>
              <option v-for="p in products" :key="p.id" :value="p.id">{{ p.name }}</option>
            </select>
          </div>
          <div><label>الكمية</label><input v-model.number="sale.quantity" type="number" min="1" step="1" required></div>
          <div><label>سعر الوحدة بالدينار</label><input v-model.number="sale.unit_price" type="number" min="0" step="0.01" inputmode="decimal" required></div>
        </div>
        <div style="margin-top:10px"><label>ملاحظة (اختياري)</label><textarea v-model.trim="sale.notes"></textarea></div>
        <button class="btn" style="margin-top:10px" :disabled="busy">{{ busy ? 'جاري الحفظ…' : 'حفظ البيع' }}</button>
      </form>
      <div v-if="message" :class="messageType">{{ message }}</div>
    </section>

    <section id="inventory" class="card content-card">
      <div class="top" style="margin:0 0 12px">
        <div><div class="section-kicker">إدارة المخزون</div><h2 style="margin:0">المنتجات والمخزون</h2><div class="muted">المنتجات منفصلة عن حركة المخزون، والجرد الفعلي يسجل الفرق كتعديل مستقل.</div></div>
        <div class="pill">{{ inventory.length }} سلع</div>
      </div>

      <div v-if="userMode==='admin'" class="tabs">
        <button class="tab" :class="{active:inventoryTab==='products'}" @click="inventoryTab='products'">المنتجات</button>
        <button class="tab" :class="{active:inventoryTab==='stock'}" @click="inventoryTab='stock'">المخزون</button>
        <button class="tab" :class="{active:inventoryTab==='count'}" @click="openPhysicalCount">الجرد الفعلي</button>
      </div>

      <template v-if="userMode!=='admin' || inventoryTab==='stock'">
        <div class="stock">
          <div class="stock-item" v-for="item in inventory" :key="item.product_id">
            <div class="stock-name">{{ item.name }}</div><div class="stock-num">{{ item.stock_quantity }}</div>
          </div>
        </div>
      </template>

      <template v-if="userMode==='admin' && inventoryTab==='products'">
        <form @submit.prevent="addProduct" class="grid" style="margin-bottom:12px">
          <div><label>اسم المنتج الجديد</label><input v-model.trim="newProductName" required placeholder="مثال: كابل Type-C"></div>
          <div style="align-self:end"><button class="btn" :disabled="busy">إضافة منتج</button></div>
        </form>
        <div class="product-list">
          <div class="product-row" v-for="p in products" :key="p.id">
            <input v-model.trim="productNames[p.id]" :aria-label="'اسم '+p.name">
            <button class="btn secondary" @click="renameProduct(p)" :disabled="busy || !productNames[p.id]">حفظ الاسم</button>
          </div>
        </div>
        <div class="muted" style="margin-top:10px">لا نحذف المنتجات التي لها سجل مبيعات؛ تغيير الاسم يحافظ على تاريخ الحركات.</div>
      </template>

      <template v-if="userMode==='admin' && inventoryTab==='count'">
        <p class="muted">اكتب العدد الموجود فعليًا فقط للسلع التي قمت بعدها. اترك الباقي فارغًا، ولن يتغير.</p>
        <div class="count-list">
          <div class="count-row" v-for="item in inventory" :key="item.product_id">
            <div class="count-name">{{ item.name }}</div>
            <div><div class="count-label">كمية النظام</div><strong>{{ item.stock_quantity }}</strong></div>
            <div><div class="count-label">العدد الحقيقي</div><input v-model.number="physicalCounts[item.product_id]" type="number" min="0" step="1" inputmode="numeric" placeholder="—"></div>
            <div><div class="count-label">الفرق</div><div class="diff" :class="difference(item)>0?'plus':(difference(item)<0?'minus':'')">{{ physicalCounts[item.product_id] === '' || physicalCounts[item.product_id] == null ? '—' : signed(difference(item)) }}</div></div>
          </div>
        </div>
        <div class="audit-summary" v-if="countedItems.length">
          <span class="pill">تم عد {{ countedItems.length }} سلعة</span>
          <span class="pill">إجمالي الفرق {{ signed(totalCountDifference) }}</span>
        </div>
        <div><label>سبب الجرد</label><input v-model.trim="physicalReason" placeholder="مثال: جرد نهاية اليوم"></div>
        <div class="section-actions">
          <button class="btn" @click="applyPhysicalCount" :disabled="busy || !countedItems.length">تأكيد الجرد وتسجيل الفروق</button>
          <button class="btn secondary" @click="resetPhysicalCount" :disabled="busy">مسح العد</button>
        </div>
      </template>
    </section>

    <template v-if="userMode==='admin'">
      <section id="users" class="card content-card">
        <div class="section-kicker">الصلاحيات</div><h2>إدارة المستخدمين</h2>
        <p class="muted">أضف حساب عامل من هنا. إذا تركت كلمة المرور فارغة يستعمل النظام كلمة المرور الافتراضية المحفوظة داخل قاعدة البيانات.</p>
        <form @submit.prevent="createWorker">
          <div class="grid">
            <div><label>اسم المستخدم</label><input v-model.trim="workerForm.username" required placeholder="مثال: kamal"></div>
            <div><label>الاسم المستعار</label><input v-model.trim="workerForm.nickname" required placeholder="مثال: كمال"></div>
            <div><label>الهاتف (اختياري)</label><input v-model.trim="workerForm.phone" inputmode="tel"></div>
            <div><label>كلمة مرور خاصة (اختياري)</label><input v-model="workerForm.password" type="password" autocomplete="new-password" placeholder="اتركها فارغة للافتراضية"></div>
          </div>
          <button class="btn" style="margin-top:10px" :disabled="busy">{{ busy ? 'جاري الحفظ…' : 'إضافة المستخدم' }}</button>
        </form>

        <div class="worker-list" v-if="adminWorkers.length">
          <div class="worker-row" v-for="w in adminWorkers" :key="w.id">
            <div class="worker-meta">
              <h3>{{ w.nickname || w.username }} — {{ w.username }}</h3>
              <small>{{ w.phone || 'بدون هاتف' }} · <span :class="w.active?'status-on':'status-off'">{{ w.active ? 'مفعّل' : 'موقوف' }}</span></small>
            </div>
            <div class="worker-actions">
              <button class="btn secondary" @click="toggleWorker(w)" :disabled="busy">{{ w.active ? 'إيقاف' : 'تفعيل' }}</button>
              <button class="btn danger" @click="deleteWorker(w)" :disabled="busy">حذف</button>
            </div>
          </div>
        </div>
        <div v-else class="muted" style="margin-top:12px">لا توجد حسابات خدام بعد.</div>
      </section>

      <section id="settings" class="card content-card">
        <div class="section-kicker">النظام</div><h2>إعدادات جلسة الأدمن</h2>
        <p class="muted">اختر مدة الجلسة من 1 إلى 96 ساعة. عند انتهاء المدة يخرج MyTool من حساب الإدارة تلقائيًا.</p>
        <div class="setting-line">
          <div><label>عدد الساعات</label><input v-model.number="adminSessionHours" type="number" min="1" max="96" step="1"></div>
          <button class="btn" @click="saveAdminSessionHours" :disabled="busy">حفظ المدة</button>
        </div>
        <div class="muted" style="margin-top:8px">المدة الحالية: {{ adminSessionHours }} ساعة.</div>
      </section>


    </template>

    <div class="footer">البيانات التشغيلية محفوظة في Supabase وليست داخل GitHub.</div>
      </main>
    </div>
  </template>
</div>

<script type="module">
  import { createApp, ref, computed, onMounted } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js'
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const SUPABASE_URL = 'https://wqyebqzbbpohbnznqdjj.supabase.co'
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_gO4umNBMJ0AWRk19HtKd7A_9X4DibYj'
  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)

  const WORKER_TOKEN_KEY = 'mytool_shop_worker_token'
  const WORKER_NICKNAME_KEY = 'mytool_shop_worker_nickname'
  const WORKER_EXPIRES_KEY = 'mytool_shop_worker_expires_at'
  const ADMIN_SESSION_HOURS_KEY = 'mytool_admin_session_hours'
  const ADMIN_EXPIRES_KEY = 'mytool_admin_expires_at'
  const WORKER_SESSION_MS = 10 * 24 * 60 * 60 * 1000

  function clampHours(value){const n=Math.floor(Number(value)||24);return Math.min(96,Math.max(1,n))}

  createApp({setup(){
    const storedWorkerExpiry=Number(localStorage.getItem(WORKER_EXPIRES_KEY)||0)
    const storedWorkerToken=(storedWorkerExpiry>Date.now())?(localStorage.getItem(WORKER_TOKEN_KEY)||''):''
    const storedWorkerNickname=storedWorkerToken?(localStorage.getItem(WORKER_NICKNAME_KEY)||''):''

    const session=ref(null),workerToken=ref(storedWorkerToken),workerNickname=ref(storedWorkerNickname)
    const loading=ref(true),busy=ref(false),loginMode=ref('worker'),email=ref(''),password=ref(''),workerUsername=ref(''),workerPassword=ref('')
    const message=ref(''),messageType=ref('ok'),staff=ref([]),products=ref([]),inventory=ref([]),adminWorkers=ref([]),todaySales=ref([])
    const sale=ref({sold_by:'',product_id:'',quantity:1,unit_price:'',notes:''})
    const inventoryTab=ref('stock'),sidebarOpen=ref(false),newProductName=ref(''),productNames=ref({}),physicalCounts=ref({}),physicalReason=ref('جرد فعلي')
    const workerForm=ref({username:'',nickname:'',phone:'',password:''})
    const adminSessionHours=ref(clampHours(localStorage.getItem(ADMIN_SESSION_HOURS_KEY)||24))

    const userMode=computed(()=>session.value?'admin':(workerToken.value?'worker':'none'))
    const isLoggedIn=computed(()=>userMode.value!=='none')
    const stockUnits=computed(()=>(inventory.value||[]).reduce((sum,x)=>sum+Number(x.stock_quantity||0),0))
    const lowStockCount=computed(()=>(inventory.value||[]).filter(x=>Number(x.stock_quantity||0)<=2).length)
    const outOfStockCount=computed(()=>(inventory.value||[]).filter(x=>Number(x.stock_quantity||0)<=0).length)
    const todaySalesCount=computed(()=>todaySales.value.length)
    const todayRevenue=computed(()=>(todaySales.value||[]).reduce((sum,x)=>sum+(Number(x.quantity||0)*Number(x.unit_price||0)),0))
    const countedItems=computed(()=>(inventory.value||[]).filter(x=>physicalCounts.value[x.product_id] !== '' && physicalCounts.value[x.product_id] != null))
    const totalCountDifference=computed(()=>countedItems.value.reduce((sum,x)=>sum+difference(x),0))
    const money=value=>new Intl.NumberFormat('ar-DZ',{maximumFractionDigits:2}).format(Number(value||0))

    function notify(text,type='ok'){message.value=text;messageType.value=type==='error'?'error':'ok'}
    function setLoginMode(mode){loginMode.value=mode;message.value=''}
    function clearWorkerSession(){workerToken.value='';workerNickname.value='';localStorage.removeItem(WORKER_TOKEN_KEY);localStorage.removeItem(WORKER_NICKNAME_KEY);localStorage.removeItem(WORKER_EXPIRES_KEY)}
    function setAdminExpiry(){localStorage.setItem(ADMIN_EXPIRES_KEY,String(Date.now()+adminSessionHours.value*60*60*1000))}
    function clearAdminExpiry(){localStorage.removeItem(ADMIN_EXPIRES_KEY)}

    async function adminLogin(){
      busy.value=true;message.value=''
      const {data,error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value})
      busy.value=false
      if(error)return notify('تعذر تسجيل الدخول: '+error.message,'error')
      clearWorkerSession();session.value=data.session;password.value='';setAdminExpiry();await loadAll()
    }

    async function workerLogin(){
      busy.value=true;message.value=''
      const {data,error}=await supabase.rpc('worker_login',{p_username:workerUsername.value,p_password:workerPassword.value})
      busy.value=false
      if(error||!data?.length)return notify('اسم المستخدم أو كلمة المرور غير صحيحة.','error')
      const row=data[0]
      workerToken.value=row.session_token;workerNickname.value=row.nickname||workerUsername.value
      localStorage.setItem(WORKER_TOKEN_KEY,workerToken.value)
      localStorage.setItem(WORKER_NICKNAME_KEY,workerNickname.value)
      localStorage.setItem(WORKER_EXPIRES_KEY,String(Date.now()+WORKER_SESSION_MS))
      workerPassword.value='';workerUsername.value='';session.value=null;clearAdminExpiry();await loadAll()
    }

    async function logout(){
      message.value=''
      if(userMode.value==='admin'){await supabase.auth.signOut();clearAdminExpiry()}
      if(userMode.value==='worker'&&workerToken.value){try{await supabase.rpc('worker_logout',{p_session_token:workerToken.value})}catch(_e){}clearWorkerSession()}
      session.value=null;staff.value=[];products.value=[];inventory.value=[];adminWorkers.value=[];todaySales.value=[];sale.value={sold_by:'',product_id:'',quantity:1,unit_price:'',notes:''}
      window.location.replace('../')
    }

    async function enforceTimeout(){
      if(userMode.value==='admin'){
        const expires=Number(localStorage.getItem(ADMIN_EXPIRES_KEY)||0)
        if(expires&&Date.now()>=expires){await logout()}
      }else if(userMode.value==='worker'){
        const expires=Number(localStorage.getItem(WORKER_EXPIRES_KEY)||0)
        if(!expires||Date.now()>=expires){clearWorkerSession();products.value=[];inventory.value=[];window.location.replace('../')}
      }
    }

    async function loadAll(){
      await enforceTimeout();if(!isLoggedIn.value)return
      busy.value=true;message.value=''
      if(userMode.value==='worker'){
        const {data,error}=await supabase.rpc('worker_get_catalog',{p_session_token:workerToken.value})
        busy.value=false
        if(error){clearWorkerSession();window.location.replace('../');return}
        inventory.value=data||[]
        products.value=(data||[]).map(x=>({id:x.product_id,name:x.name}))
        return
      }
      const dayStart=new Date();dayStart.setHours(0,0,0,0)
      const dayEnd=new Date(dayStart);dayEnd.setDate(dayEnd.getDate()+1)
      const [s,p,i,w,t]=await Promise.all([
        supabase.from('staff').select('id,name').eq('active',true).order('id'),
        supabase.from('products').select('id,name').order('id'),
        supabase.from('inventory_summary').select('product_id,name,stock_quantity').order('product_id'),
        supabase.from('worker_accounts').select('id,username,phone,nickname,staff_id,active,created_at').order('id'),
        supabase.from('sales').select('quantity,unit_price,operation_at').gte('operation_at',dayStart.toISOString()).lt('operation_at',dayEnd.toISOString()).order('operation_at',{ascending:false})
      ])
      busy.value=false
      const error=s.error||p.error||i.error||w.error||t.error
      if(error)return notify('خطأ في قراءة البيانات: '+error.message,'error')
      staff.value=s.data||[];products.value=p.data||[];inventory.value=i.data||[];adminWorkers.value=w.data||[];todaySales.value=t.data||[]
      productNames.value=Object.fromEntries((products.value||[]).map(x=>[x.id,x.name]))
    }

    async function saveSale(){
      if(userMode.value==='admin'&&!sale.value.sold_by)return notify('اختر الخدام.','error')
      if(!sale.value.product_id)return notify('اختر السلعة.','error')
      if(!Number.isInteger(Number(sale.value.quantity))||Number(sale.value.quantity)<1)return notify('الكمية غير صحيحة.','error')
      if(Number(sale.value.unit_price)<0||sale.value.unit_price==='')return notify('السعر غير صحيح.','error')
      busy.value=true;message.value=''
      let error=null
      if(userMode.value==='worker'){
        const result=await supabase.rpc('worker_create_sale',{
          p_session_token:workerToken.value,
          p_product_id:Number(sale.value.product_id),
          p_quantity:Number(sale.value.quantity),
          p_unit_price:Number(sale.value.unit_price),
          p_notes:sale.value.notes||null
        })
        error=result.error
      }else{
        const payload={sold_by:Number(sale.value.sold_by),product_id:Number(sale.value.product_id),quantity:Number(sale.value.quantity),unit_price:Number(sale.value.unit_price),notes:sale.value.notes||null}
        const result=await supabase.from('sales').insert(payload);error=result.error
      }
      busy.value=false
      if(error)return notify('لم يتم حفظ البيع: '+error.message,'error')
      notify('تم تسجيل البيع بنجاح.')
      sale.value.product_id='';sale.value.quantity=1;sale.value.unit_price='';sale.value.notes='';await loadAll()
    }

    function signed(value){const n=Number(value||0);return n>0?'+'+n:String(n)}
    function difference(item){
      const actual=physicalCounts.value[item.product_id]
      if(actual===''||actual==null)return 0
      return Number(actual)-Number(item.stock_quantity||0)
    }
    function openPhysicalCount(){inventoryTab.value='count'}
    function resetPhysicalCount(){physicalCounts.value={};physicalReason.value='جرد فعلي'}

    async function addProduct(){
      if(userMode.value!=='admin')return
      const name=(newProductName.value||'').trim()
      if(!name)return notify('اكتب اسم المنتج.','error')
      busy.value=true;message.value=''
      const {error}=await supabase.from('products').insert({name})
      busy.value=false
      if(error)return notify('لم تتم إضافة المنتج: '+error.message,'error')
      newProductName.value='';notify('تمت إضافة المنتج.')
      await loadAll();inventoryTab.value='products'
    }

    async function renameProduct(product){
      if(userMode.value!=='admin')return
      const name=(productNames.value[product.id]||'').trim()
      if(!name)return notify('اسم المنتج لا يمكن أن يكون فارغًا.','error')
      if(name===product.name)return notify('الاسم لم يتغير.')
      busy.value=true;message.value=''
      const {error}=await supabase.from('products').update({name}).eq('id',product.id)
      busy.value=false
      if(error)return notify('تعذر تعديل اسم المنتج: '+error.message,'error')
      notify('تم تحديث اسم المنتج.')
      await loadAll();inventoryTab.value='products'
    }

    async function findAdjustmentColumn(candidates){
      for(const column of candidates){
        const {error}=await supabase.from('stock_adjustments').select(column).limit(1)
        if(!error)return column
      }
      return null
    }

    async function applyPhysicalCount(){
      if(userMode.value!=='admin')return
      const rows=countedItems.value
      if(!rows.length)return notify('أدخل عددًا حقيقيًا لسلعة واحدة على الأقل.','error')
      for(const item of rows){
        const actual=Number(physicalCounts.value[item.product_id])
        if(!Number.isInteger(actual)||actual<0)return notify('العدد الحقيقي لـ '+item.name+' غير صحيح.','error')
      }
      const changed=rows.filter(item=>difference(item)!==0)
      if(!changed.length){notify('الجرد مطابق للمخزون المسجل، لا توجد فروق للحفظ.');resetPhysicalCount();return}
      const reason=(physicalReason.value||'').trim()
      if(!reason)return notify('اكتب سبب الجرد قبل التأكيد.','error')
      if(!confirm('سيتم تسجيل '+changed.length+' تعديل مخزون. متابعة؟'))return

      busy.value=true;message.value=''
      const qtyColumn=await findAdjustmentColumn(['quantity','quantity_change','quantity_delta','adjustment_quantity','adjustment','delta','change_quantity'])
      const reasonColumn=await findAdjustmentColumn(['reason','notes','note','description'])
      if(!qtyColumn||!reasonColumn){
        busy.value=false
        return notify('تعذر التعرف على بنية جدول stock_adjustments. أرسل الخطأ للمطور قبل تسجيل الجرد.','error')
      }

      const adjustments=changed.map(item=>{
        const payload={product_id:Number(item.product_id)}
        payload[qtyColumn]=difference(item)
        payload[reasonColumn]=reason
        return payload
      })
      const {error}=await supabase.from('stock_adjustments').insert(adjustments)
      busy.value=false
      if(error)return notify('لم يتم حفظ الجرد: '+error.message,'error')
      notify('تم تسجيل فروق الجرد بنجاح.')
      resetPhysicalCount();await loadAll();inventoryTab.value='stock'
    }

    async function createWorker(){
      if(userMode.value!=='admin')return
      const payload={username:workerForm.value.username,nickname:workerForm.value.nickname,phone:workerForm.value.phone||null}
      if(workerForm.value.password)payload.password=workerForm.value.password
      busy.value=true;message.value=''
      const {error}=await supabase.from('worker_accounts').insert(payload)
      busy.value=false
      if(error)return notify('لم تتم إضافة المستخدم: '+error.message,'error')
      workerForm.value={username:'',nickname:'',phone:'',password:''}
      notify('تمت إضافة المستخدم بنجاح.')
      await loadAll()
    }

    async function toggleWorker(w){
      if(userMode.value!=='admin')return
      busy.value=true;message.value=''
      const {error}=await supabase.from('worker_accounts').update({active:!w.active}).eq('id',w.id)
      busy.value=false
      if(error)return notify('تعذر تحديث الحساب: '+error.message,'error')
      notify(w.active?'تم إيقاف الحساب.':'تم تفعيل الحساب.')
      await loadAll()
    }

    async function deleteWorker(w){
      if(userMode.value!=='admin'||!confirm('حذف حساب '+(w.nickname||w.username)+'؟'))return
      busy.value=true;message.value=''
      const {error}=await supabase.from('worker_accounts').delete().eq('id',w.id)
      busy.value=false
      if(error)return notify('تعذر حذف الحساب: '+error.message,'error')
      notify('تم حذف الحساب.')
      await loadAll()
    }

    function saveAdminSessionHours(){
      adminSessionHours.value=clampHours(adminSessionHours.value)
      localStorage.setItem(ADMIN_SESSION_HOURS_KEY,String(adminSessionHours.value))
      if(userMode.value==='admin')setAdminExpiry()
      notify('تم حفظ مدة جلسة الإدارة: '+adminSessionHours.value+' ساعة.')
    }

    onMounted(async()=>{
      if(!storedWorkerToken)clearWorkerSession()
      const {data}=await supabase.auth.getSession();session.value=data.session
      if(session.value){
        clearWorkerSession()
        const expires=Number(localStorage.getItem(ADMIN_EXPIRES_KEY)||0)
        if(expires&&Date.now()>=expires){await supabase.auth.signOut();session.value=null;clearAdminExpiry()}
        else if(!expires)setAdminExpiry()
      }
      loading.value=false
      if(!isLoggedIn.value){window.location.replace('../');return}
      await loadAll()
      supabase.auth.onAuthStateChange((_event,newSession)=>{session.value=newSession;if(newSession)clearWorkerSession()})
      setInterval(enforceTimeout,30000)
    })

    return{session,loading,busy,loginMode,email,password,workerUsername,workerPassword,workerNickname,message,messageType,staff,products,inventory,adminWorkers,todaySales,sale,workerForm,adminSessionHours,inventoryTab,sidebarOpen,newProductName,productNames,physicalCounts,physicalReason,userMode,isLoggedIn,stockUnits,lowStockCount,outOfStockCount,todaySalesCount,todayRevenue,countedItems,totalCountDifference,money,signed,difference,setLoginMode,adminLogin,workerLogin,logout,loadAll,saveSale,openPhysicalCount,resetPhysicalCount,addProduct,renameProduct,applyPhysicalCount,createWorker,toggleWorker,deleteWorker,saveAdminSessionHours}
  }}).mount('#app')
</script>
</body>
</html>
