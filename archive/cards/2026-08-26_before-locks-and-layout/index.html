<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2ea8e6">
<title>معالج البطاقات - MyTool</title>
<style>
:root{--o:#f47700;--b:#2ea8e6;--t:#163047;--m:#61778a;--l:#d7e5ee;--g:#0f9f6e;--r:#d84c4c}*{box-sizing:border-box}body{margin:0;padding:8px;font-family:Arial,Tahoma,sans-serif;color:var(--t);background:linear-gradient(135deg,#fff7ef,#eef9ff)}.wrap{max-width:900px;margin:auto}.back{display:block;text-decoration:none;color:var(--t);font-weight:bold;background:#fff;border:1px solid var(--l);border-radius:10px;padding:9px 11px;margin-bottom:8px}.app{background:#fff;border:1px solid var(--l);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #16304718}.head{padding:13px 15px;color:#fff;background:linear-gradient(135deg,var(--o),#7fd3ff)}.head h1{font-size:20px;margin:0}.head p{margin:3px 0 0;font-size:12px}.body{padding:11px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border:1px solid var(--l);border-radius:13px;background:#f5f9fc}.tab{border:0;border-radius:9px;padding:10px 4px;background:transparent;font-weight:bold;color:var(--t)}.tab.on{color:#fff;background:linear-gradient(135deg,var(--o),var(--b))}.hint{font-size:12px;color:var(--m);padding:8px;margin:8px 0;background:#f7fbfe;border-radius:10px}.upload{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:bold;color:#fff;background:linear-gradient(135deg,var(--o),var(--b));cursor:pointer}.file{border:1px dashed #bad5e5;border-radius:10px;padding:9px;color:var(--m);font-size:12px;overflow-wrap:anywhere}textarea{width:100%;height:170px;margin-top:8px;padding:10px;border:1px solid var(--l);border-radius:12px;font-size:14px;outline:none}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px}.opt{font-size:13px;background:linear-gradient(90deg,#fff3e6,#eef9ff);padding:9px;border-radius:10px}.status{font-size:12px;color:var(--m);min-height:18px;margin-top:6px}.result{margin-top:10px}.group{border:1px solid var(--l);border-radius:12px;padding:10px;margin-top:8px}.title{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:bold;font-size:14px}.badge{font-size:11px;color:#fff;background:var(--b);border-radius:99px;padding:3px 8px}.codes{direction:ltr;text-align:left;white-space:pre-wrap;font-family:monospace;font-size:13px;max-height:150px;overflow:auto;background:#f8fbfd;border:1px solid var(--l);border-radius:9px;padding:9px;margin-top:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.green{background:var(--g)}.gold{background:#e99412}.split{margin-top:9px;padding:9px;border:1px solid var(--l);border-radius:10px;background:#fffaf5}.splitTop{display:grid;grid-template-columns:1fr auto auto;gap:7px}.split input{width:100%;padding:8px;border:1px solid var(--l);border-radius:8px}.counts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:7px}.count{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#fff;border:1px solid var(--l);border-radius:8px;padding:6px;font-size:12px}.count input{width:72px;text-align:center}.count.autoCount{border-color:#7ec9ee;background:#f1faff}.autoTag{display:inline-block;margin-right:4px;padding:2px 6px;border-radius:99px;background:var(--b);color:#fff;font-size:10px;font-weight:bold}.sum{font-size:12px;color:var(--m);margin-top:6px}.ok{color:var(--g);font-weight:bold}.bad{color:var(--r);font-weight:bold}.splitDownload{width:100%;margin-top:7px}.error{color:var(--r);font-weight:bold}.validationBox{border-color:#efb7b7;background:#fff8f8}.validationList{margin:7px 0 0;padding:0 18px;font-size:12px;color:#7a3030}.validationList li{margin:4px 0}@media(max-width:600px){.upload,.row,.splitTop{grid-template-columns:1fr}.counts{grid-template-columns:1fr}.btn{width:100%}}
</style>
</head>
<body><main class="wrap"><a class="back" href="../">← لوحة الأدوات</a><section class="app"><header class="head"><h1>معالج البطاقات</h1><p>Mobilis • Token Store • TXT</p></header><div class="body">
<div class="tabs"><button class="tab on" data-type="mobilis">Mobilis</button><button class="tab" data-type="token">Token Store</button><button class="tab" data-type="plain">نص عادي</button></div>
<div id="hint" class="hint">أخذ الرقم الموجود قبل أول فاصلة فقط وحذف SN وما بعدها.</div>
<div class="upload"><button id="pick" class="btn">📂 رفع ملف</button><div id="fname" class="file">لم يتم اختيار ملف.</div><input id="file" type="file" accept=".txt,.csv,.log,text/plain,text/csv" hidden></div>
<textarea id="text" placeholder="مثال:&#10;840779241509233,251112500016999&#10;841742619957843,251112500017000"></textarea>
<div class="row"><label class="opt"><input id="trim" type="checkbox" checked> إزالة الفراغات من أول وآخر كل سطر</label><button id="process" class="btn">معالجة وتحضير</button></div>
<div id="status" class="status"></div><div id="result" class="result"></div>
</div></section></main>
<script>
const $=id=>document.getElementById(id),text=$('text'),file=$('file'),fname=$('fname'),result=$('result'),statusEl=$('status'),trim=$('trim');let type='mobilis',uploaded='';
const info={mobilis:['أخذ الرقم الموجود قبل أول فاصلة فقط وحذف SN وما بعدها. يتم التحقق من صيغة كل سطر قبل المعالجة.','مثال:\n840779241509233,251112500016999'],token:['استخراج Product و Code وتجميع كل منتج وحده مع التحقق من تغيّر تنسيق المصدر.','ألصق رسالة Token Store هنا...'],plain:['حفظ النص في TXT مع اسم منظم.','ألصق النص هنا...']};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));$('hint').textContent=info[type][0];text.placeholder=info[type][1];result.innerHTML='';statusEl.textContent=''});
$('pick').onclick=()=>file.click();file.onchange=async()=>{const f=file.files[0];if(!f)return;uploaded=f.name;fname.textContent='الملف: '+f.name;text.value=await f.text();statusEl.textContent='تمت قراءة الملف.'};
const pad=n=>String(n).padStart(2,'0');function stamp(){const d=new Date;return{tm:pad(d.getHours())+'-'+pad(d.getMinutes()),dt:pad(d.getDate())+pad(d.getMonth()+1)+d.getFullYear()}}function shortStamp(){const d=new Date;return{tm:pad(d.getHours())+pad(d.getMinutes()),dt:pad(d.getDate())+pad(d.getMonth()+1)+String(d.getFullYear()).slice(-2)}}function safe(s){return String(s||'ملف').trim().replace(/[/\\?%*:|"<>]/g,'-').replace(/\s+/g,'-').replace(/-+/g,'-')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function mobilisValue(){const b=uploaded.replace(/\.[^.]+$/,'');let m=b.match(/(\d{2,5})[-_ ]*(?:DA|DZD)\b/i)||b.match(/MOBILIS[-_ ]*(\d{2,5})/i)||b.match(/CARTE[-_ ]*(\d{2,5})/i);return m?m[1]:''}
function nameMobilis(count,part,total){const s=shortStamp(),v=mobilisValue()||'CARTE',p=part?`_P${part}-${total}`:'';return `MOB_${v}_${count}${p}_${s.tm}_${s.dt}.txt`}function nameToken(prod,count,part,total){const s=stamp(),p=part?`_part-${part}-of-${total}`:'';return `TokenStore_${safe(prod)}_count-${count}${p}_${s.tm}_${s.dt}.txt`}function namePlain(count){const s=stamp();return `Text_count-${count}_${s.tm}_${s.dt}.txt`}
function download(content,name){const bom=new Uint8Array([239,187,191]),blob=new Blob([bom,new TextEncoder().encode(content)],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),800)}function copy(t){navigator.clipboard.writeText(t).then(()=>statusEl.textContent='تم النسخ.')}
function validationError(title,details=[]){result.innerHTML=`<div class="group validationBox"><div class="error">⚠️ ${esc(title)}</div>${details.length?`<ul class="validationList">${details.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="hint">لم يتم إنشاء أي مخرج. راجع المصدر ثم أعد المعالجة.</div></div>`;statusEl.textContent='تم إيقاف المعالجة لحماية البطاقات.';return false}
function validateMobilisSource(raw){const lines=raw.split(/\r\n|\n|\r/),valid=[],bad=[];let sig=null;lines.forEach((original,i)=>{const line=original.trim();if(!line)return;const m=line.match(/^(\d+)\s*([,،])\s*(\d+)$/);if(!m){bad.push(`السطر ${i+1}: صيغة غير متوقعة أو يحتوي نصًا`);return}const now={left:m[1].length,right:m[3].length,sep:m[2]};if(!sig)sig=now;else if(now.left!==sig.left||now.right!==sig.right||now.sep!==sig.sep){bad.push(`السطر ${i+1}: يختلف عن صيغة بقية البطاقات`);return}valid.push(m[1])});if(!valid.length)return{ok:false,details:['لم يتم العثور على أسطر بطاقات بالصيغة الرقمية المتوقعة.']};if(bad.length)return{ok:false,details:bad.slice(0,8).concat(bad.length>8?[`ويوجد ${bad.length-8} أسطر أخرى تحتاج مراجعة.`]:[])};return{ok:true,cards:valid}}
function validateTokenSource(raw){const productMarks=(raw.match(/^[ \t]*Product\s*:/gim)||[]).length,codeMarks=(raw.match(/^[ \t]*Code\s*:/gim)||[]).length,re=/^[ \t]*Product:\s*([^\n\r]+)[\s\S]*?^[ \t]*Code:\s*([\d-]+)\s*$/gim,g={};let m,extracted=0;while((m=re.exec(raw))!==null){const p=m[1].trim().replace(/[/\\?%*:|"<>]/g,'-');(g[p]??=[]).push(m[2].trim());extracted++}if(!productMarks&&!codeMarks)return{ok:false,details:['لم يتم العثور على Product: أو Code:. قد يكون تنسيق المصدر قد تغيّر.']};if(productMarks!==codeMarks||extracted!==codeMarks)return{ok:false,details:[`Product المكتشفة: ${productMarks}`,`Code المكتشفة: ${codeMarks}`,`البطاقات المستخرجة فعليًا: ${extracted}`,'يوجد تغير أو عنصر غير مكتمل قد يغيّر المخرج.']};return{ok:true,groups:g,total:extracted}}
function suggested(total,parts){const b=Math.floor(total/parts),r=total%parts;return Array.from({length:parts},(_,i)=>b+(i<r?1:0))}
function splitUI(id,items){if(items.length<2)return'';return `<div class="split"><b>تقسيم البطاقات إلى أقسام</b><div class="splitTop"><input id="${id}parts" type="number" min="2" max="${items.length}" value="2"><button id="${id}prep" class="btn green">تحضير الأعداد</button><button id="${id}reset" class="btn">توزيع متساوٍ</button></div><div id="${id}counts" class="counts"></div><div id="${id}sum" class="sum">آخر قسم تعدله يبقى ثابتًا، وقسم آخر يوازن المجموع تلقائيًا.</div><button id="${id}down" class="btn gold splitDownload" hidden>تقسيم وتحميل الملفات</button></div>`}
function initSplit(id,items,nameFn){const parts=$(id+'parts'),prep=$(id+'prep'),reset=$(id+'reset'),counts=$(id+'counts'),sum=$(id+'sum'),down=$(id+'down');if(!parts)return;let balanceIndex=0,lastValid=[];function inputs(){return[...counts.querySelectorAll('input[data-count]')]}function vals(){return inputs().map(x=>Number(x.value))}function validVals(v){return v.length&&v.every(x=>Number.isInteger(x)&&x>=1)&&v.reduce((a,b)=>a+b,0)===items.length}function markBalance(){[...counts.querySelectorAll('.count')].forEach((row,i)=>{row.classList.toggle('autoCount',i===balanceIndex);const tag=row.querySelector('.autoTag');if(tag)tag.hidden=i!==balanceIndex})}function showValid(){const v=vals(),n=v.reduce((a,b)=>a+b,0);sum.className='sum ok';sum.textContent=`المجموع صحيح: ${n} من ${items.length} — القسم ${balanceIndex+1} تلقائي`;down.hidden=false}function restoreWarn(message,oldBalance){inputs().forEach((x,i)=>x.value=lastValid[i]);balanceIndex=oldBalance;markBalance();sum.className='sum bad';sum.textContent=message+' — تم الإبقاء على آخر توزيع صحيح.';down.hidden=false}function commit(changed){const all=inputs(),oldBalance=balanceIndex,value=Number(all[changed].value);if(!Number.isInteger(value)||value<1){restoreWarn('القيمة غير صالحة',oldBalance);return}if(changed===balanceIndex)balanceIndex=(changed+1)%all.length;const nonBalance=all.reduce((s,x,i)=>i===balanceIndex?s:s+Number(x.value),0),needed=items.length-nonBalance;if(!Number.isInteger(needed)||needed<1){restoreWarn('هذه القيمة لا تترك بطاقة واحدة على الأقل لقسم الموازنة',oldBalance);return}all[balanceIndex].value=needed;const next=vals();if(!validVals(next)){restoreWarn('التوزيع غير ممكن',oldBalance);return}lastValid=next.slice();markBalance();showValid()}function bindInputs(){inputs().forEach(x=>{x.addEventListener('focus',()=>setTimeout(()=>x.select(),0));x.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();x.blur()}});x.addEventListener('change',()=>commit(Number(x.dataset.index)))})}function prepare(){const p=Number(parts.value);if(!Number.isInteger(p)||p<2||p>items.length){counts.innerHTML='';sum.className='sum bad';sum.textContent=`عدد الأقسام يجب أن يكون بين 2 و${items.length}`;down.hidden=true;return}const v=suggested(items.length,p);balanceIndex=p-1;lastValid=v.slice();counts.innerHTML=v.map((n,i)=>`<label class="count"><span>القسم ${i+1} <small class="autoTag" hidden>تلقائي</small></span><input data-count data-index="${i}" type="number" min="1" max="${items.length-(p-1)}" step="1" value="${n}"></label>`).join('');bindInputs();markBalance();showValid()}function resetEqual(){prepare();sum.className='sum ok';sum.textContent=`تمت إعادة التوزيع بالتساوي — القسم ${balanceIndex+1} تلقائي`}prep.onclick=prepare;reset.onclick=resetEqual;parts.onchange=prepare;down.onclick=()=>{const v=vals();if(!validVals(v)){sum.className='sum bad';sum.textContent='التوزيع غير صالح، لن يتم التحميل.';down.hidden=true;return}let off=0;v.forEach((n,i)=>{const chunk=items.slice(off,off+n);off+=n;setTimeout(()=>download(chunk.join('\n'),nameFn(n,i+1,v.length)),i*250)});statusEl.textContent=`تم تجهيز ${v.length} ملفات.`};prepare()}
function group(title,codes,filename,id,nameFn,allowSplit=true){return `<div class="group"><div class="title"><span>${title}</span><span class="badge">${codes.length} بطاقة</span></div><div class="codes" id="${id}codes"></div><div class="actions"><button class="btn green" id="${id}copy">نسخ</button><button class="btn gold" id="${id}download">تحميل TXT</button></div>${allowSplit?splitUI(id,codes):''}</div>`}
function bindGroup(id,codes,filename,nameFn,allowSplit=true){$(id+'codes').textContent=codes.join('\n');$(id+'copy').onclick=()=>copy(codes.join('\n'));$(id+'download').onclick=()=>download(codes.join('\n'),filename);if(allowSplit)initSplit(id,codes,nameFn)}
function processPlain(){let lines=text.value.split(/\r\n|\n|\r/);if(trim.checked)lines=lines.map(x=>x.trim());lines=lines.filter(x=>x!==''),result.innerHTML=group('النص جاهز',lines,namePlain(lines.length),'plain',null,false);bindGroup('plain',lines,namePlain(lines.length),null,false)}
function processMobilis(){const checked=validateMobilisSource(text.value);if(!checked.ok)return validationError('تنسيق بطاقات Mobilis غير متطابق',checked.details);const cards=checked.cards;result.innerHTML=group('بطاقات Mobilis بدون SN',cards,nameMobilis(cards.length),'mob',nameMobilis,true);bindGroup('mob',cards,nameMobilis(cards.length),nameMobilis,true);statusEl.textContent=`تم التحقق من ${cards.length} بطاقة — الصيغة متطابقة.`}
function processToken(){const checked=validateTokenSource(text.value);if(!checked.ok)return validationError('تنسيق Token Store يحتاج مراجعة',checked.details);const g=checked.groups,keys=Object.keys(g);result.innerHTML=keys.map((p,i)=>group('📦 '+p,g[p],nameToken(p,g[p].length),'tok'+i,(n,a,b)=>nameToken(p,n,a,b),true)).join('');keys.forEach((p,i)=>bindGroup('tok'+i,g[p],nameToken(p,g[p].length),(n,a,b)=>nameToken(p,n,a,b),true));statusEl.textContent=`تم التحقق واستخراج ${checked.total} بطاقة.`}
$('process').onclick=()=>{result.innerHTML='';statusEl.textContent='';if(!text.value.trim()){result.innerHTML='<div class="error">ألصق النص أو ارفع ملفًا أولًا.</div>';return}type==='mobilis'?processMobilis():type==='token'?processToken():processPlain()};
</script></body></html>
