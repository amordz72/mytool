<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MyTool Nuxt — Platforms</title><style>
:root{font-family:Arial,Tahoma,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.badge{background:#e0f2fe;color:#075985;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px #0f172a0a}h1{margin:4px 0;font-size:25px}.muted{color:#64748b;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;font-size:12px;font-weight:800}input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#0f766e;color:white}.soft{background:#f1f5f9}.warn{background:#fff7ed;color:#9a3412}.ok{background:#ecfdf5;color:#047857}.actions{display:flex;gap:8px;align-items:end}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.list{margin-top:12px;overflow-x:auto;border:1px solid #e2e8f0;border-radius:12px}.ptable{width:100%;border-collapse:collapse;min-width:700px}.ptable th,.ptable td{padding:12px;text-align:right;border-bottom:1px solid #e2e8f0;vertical-align:middle}.ptable th{background:#f8fafc;font-size:12px;color:#475569}.ptable tr:last-child td{border-bottom:0}.ptable .actions{display:flex;gap:6px}.ptable .actions button{padding:8px 10px}.key{direction:ltr;text-align:right;color:#64748b;font-size:11px;margin-top:4px}.aliases{font-size:12px;color:#64748b;margin-top:5px}.state{font-size:11px;padding:5px 8px;border-radius:999px}.msg{display:none;padding:10px;border-radius:10px;margin-bottom:12px;font-size:12px}.msg.show{display:block}.msg.err{background:#fff1f2;color:#be123c}.msg.good{background:#ecfdf5;color:#047857}@media(max-width:620px){main{padding:10px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.ptable{min-width:620px}.ptable th,.ptable td{padding:10px 8px;font-size:12px}}
</style></head><body><main><div class="top"><div><div class="muted">MYTOOL / NUXT PILOT</div><h1>إدارة المنصات</h1><div class="muted">Platform Master — البيانات الحقيقية</div></div><span class="badge">DEV PREVIEW</span></div><div id="msg" class="msg"></div>
<section class="card"><h3 id="formTitle">إضافة منصة</h3><div class="grid"><label id="keyField" style="display:none">المعرّف الثابت<input id="key" placeholder="telegram_bot"></label><label>الاسم الرسمي<input id="name" placeholder="بوت تيليغرام"></label><label><span>الحالة</span><span><input id="active" type="checkbox" checked style="width:auto"> مفعلة</span></label><div class="actions"><button id="save" class="primary">إضافة المنصة</button><button id="cancel" class="soft" style="display:none">إلغاء</button></div></div></section>
<section class="card"><div class="head"><div><strong>المنصات</strong><div id="count" class="muted"></div></div><input id="search" placeholder="بحث..." style="max-width:280px"></div><div id="list" class="list"><div class="muted">جاري التحميل…</div></div></section></main>
<script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://wqyebqzbbpohbnznqdjj.supabase.co','sb_publishable_gO4umNBMJ0AWRk19HtKd7A_9X4DibYj');const $=x=>document.getElementById(x);let rows=[],editing=null;function msg(t,e=false){$('msg').textContent=t;$('msg').className='msg show '+(e?'err':'good');setTimeout(()=>$('msg').className='msg',3500)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const{data,error}=await s.from('money_platform_directory').select('platform_key,display_name,aliases,active').order('display_name');if(error){$('list').innerHTML='<div class="muted">'+esc(error.message)+'</div>';return}rows=data||[];render()}function render(){const q=$('search').value.trim().toLowerCase();const a=rows.filter(x=>!q||[x.platform_key,x.display_name,...(x.aliases||[])].some(v=>String(v).toLowerCase().includes(q)));$('count').textContent=a.length+' منصة';$('list').innerHTML=a.length?'<table class="ptable"><thead><tr><th>المنصة</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>'+a.map(x=>'<tr><td><strong>'+esc(x.display_name)+'</strong></td><td><span class="state '+(x.active?'ok':'soft')+'">'+(x.active?'مفعلة':'مخفية')+'</span></td><td><div class="actions"><button class="soft edit" data-k="'+esc(x.platform_key)+'">تعديل</button><button class="'+(x.active?'warn':'ok')+' toggle" data-k="'+esc(x.platform_key)+'">'+(x.active?'إخفاء':'تفعيل')+'</button></div></td></tr>').join('')+'</tbody></table>':'<div class="muted" style="padding:14px">لا توجد نتائج</div>';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>edit(b.dataset.k));document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>toggle(b.dataset.k))}function edit(k){const x=rows.find(r=>r.platform_key===k);if(!x)return;editing=k;$('key').value=x.platform_key;$('key').disabled=true;$('keyField').style.display='grid';$('name').value=x.display_name;$('active').checked=x.active;$('formTitle').textContent='تعديل منصة';$('save').textContent='حفظ التعديل';$('cancel').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}function reset(){editing=null;$('key').value='';$('key').disabled=false;$('keyField').style.display='none';$('name').value='';$('active').checked=true;$('formTitle').textContent='إضافة منصة';$('save').textContent='إضافة المنصة';$('cancel').style.display='none'}$('cancel').onclick=reset;$('search').oninput=render;$('save').onclick=async()=>{const name=$('name').value.trim(),key=(editing?$('key').value.trim().toLowerCase():name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||('platform_'+Date.now())),aliases=[];if(!name)return msg('اسم المنصة مطلوب',true);const payload={display_name:name,aliases,active:$('active').checked,updated_at:new Date().toISOString()};const r=editing?await s.from('money_platform_directory').update(payload).eq('platform_key',editing):await s.from('money_platform_directory').insert({platform_key:key,...payload});if(r.error)return msg(r.error.message,true);msg(editing?'تم تعديل المنصة':'تمت إضافة المنصة');reset();load()};async function toggle(k){const x=rows.find(r=>r.platform_key===k);const{error}=await s.from('money_platform_directory').update({active:!x.active,updated_at:new Date().toISOString()}).eq('platform_key',k);if(error)return msg(error.message,true);load()}load();</script></body></html>
