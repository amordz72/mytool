name: Complete active auth guards

on:
  push:
    paths:
      - '.github/workflows/complete-active-auth-guards.yml'

permissions:
  contents: write

jobs:
  guard-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add auth guard to active admin HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          roots = [Path('cards'), Path('flexy'), Path('programs'), Path('qr')]
          changed = []

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.html'):
                  text = path.read_text(encoding='utf-8')
                  if 'auth-guard.js' in text:
                      continue
                  rel = os.path.relpath(Path('auth-guard.js'), path.parent).replace(os.sep, '/')
                  tag = f'<script src="{rel}" data-access="admin"></script>'
                  if '</head>' not in text:
                      print(f'SKIP no </head>: {path}')
                      continue
                  text = text.replace('</head>', tag + '\n</head>', 1)
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed:', changed)
          PY
      - name: Commit guarded pages
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards flexy programs qr
          git commit -m 'feat: guard all active MyTool HTML pages'
          git push
