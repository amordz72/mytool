name: Patch shop worker permissions

on:
  push:
    paths:
      - '.github/workflows/patch-worker-permissions.yml'
      - '.github/patch-worker-permissions.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply worker permissions patch
        run: python .github/patch-worker-permissions.py
      - name: Validate patch
        run: |
          grep -q "can_sell boolean not null default true" shop/worker-auth.sql
          grep -q "worker_get_context" shop/worker-auth.sql
          grep -q "worker_apply_stock_adjustments" shop/worker-auth.sql
          grep -q "saveWorkerPermissions" shop/index.html
          grep -q "v-model.number=\"workerForm.staff_id\"" shop/index.html
          grep -q "DATABASE APPLY REQUIRED" docs/SHOP-LEDGER.md
      - name: Commit patch and cleanup
        run: |
          rm -f .github/workflows/patch-worker-permissions.yml .github/patch-worker-permissions.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop/index.html shop/worker-auth.sql docs/SHOP-LEDGER.md archive/ .github/workflows/patch-worker-permissions.yml .github/patch-worker-permissions.py
          git commit -m 'feat: add enforced worker permissions'
          git push
