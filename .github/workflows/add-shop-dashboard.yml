name: Add shop dashboard

on:
  push:
    paths:
      - '.github/workflows/add-shop-dashboard.yml'

permissions:
  contents: write

jobs:
  patch-shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add dashboard to shop
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shop/index.html')
          s = p.read_text(encoding='utf-8')

          css_old = ".worker-list{display:grid;gap:8px;margin-top:14px}"
          css_new = ".dashboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}.metric{background:linear-gradient(135deg,#ffffff,#f0fdfa);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(15,23,42,.04)}.metric-label{font-size:12px;color:var(--muted);font-weight:700}.metric-value{font-size:24px;font-weight:900;margin-top:6px;color:var(--text)}.metric small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.worker-list{display:grid;gap:8px;margin-top:14px}"
          if css_old in s and '.dashboard{' not in s:
              s = s.replace(css_old, css_new, 1)

          media_old = "@media(max-width:620px){.grid,.stock{grid-template-columns:1fr}"
          media_new = "@media(max-width:620px){.dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.stock{grid-template-columns:1fr}"
          if media_old in s:
              s = s.replace(media_old, media_new, 1)

          marker = "    <section class=\"card\">\n      <h2>تسجيل بيع</h2>"
          dashboard = """    <section class=\"card\">\n      <div class=\"top\" style=\"margin:0 0 12px\">\n        <div><h2 style=\"margin:0\">Dashboard المحل</h2><div class=\"muted\">نظرة سريعة على حالة المحل الآن.</div></div>\n        <span class=\"pill\">مباشر</span>\n      </div>\n      <div class=\"dashboard\">\n        <div class=\"metric\"><div class=\"metric-label\">عدد السلع</div><div class=\"metric-value\">{{ products.length }}</div><small>سلعة مسجلة</small></div>\n        <div class=\"metric\"><div class=\"metric-label\">إجمالي المخزون</div><div class=\"metric-value\">{{ stockUnits }}</div><small>وحدة حسب الحركات</small></div>\n        <div v-if=\"userMode==='admin'\" class=\"metric\"><div class=\"metric-label\">عمليات اليوم</div><div class=\"metric-value\">{{ todaySalesCount }}</div><small>عملية بيع</small></div>\n        <div v-if=\"userMode==='admin'\" class=\"metric\"><div class=\"metric-label\">مبيعات اليوم</div><div class=\"metric-value\">{{ money(todayRevenue) }}</div><small>دج</small></div>\n      </div>\n    </section>\n\n""" + marker
          if marker in s and 'Dashboard المحل' not in s:
              s = s.replace(marker, dashboard, 1)

          old_refs = "const message=ref(''),messageType=ref('ok'),staff=ref([]),products=ref([]),inventory=ref([]),adminWorkers=ref([])"
          new_refs = "const message=ref(''),messageType=ref('ok'),staff=ref([]),products=ref([]),inventory=ref([]),adminWorkers=ref([]),todaySales=ref([])"
          if old_refs in s:
              s = s.replace(old_refs, new_refs, 1)

          old_computed = "const isLoggedIn=computed(()=>userMode.value!=='none')"
          new_computed = """const isLoggedIn=computed(()=>userMode.value!=='none')\n    const stockUnits=computed(()=>(inventory.value||[]).reduce((sum,x)=>sum+Number(x.stock_quantity||0),0))\n    const todaySalesCount=computed(()=>todaySales.value.length)\n    const todayRevenue=computed(()=>(todaySales.value||[]).reduce((sum,x)=>sum+(Number(x.quantity||0)*Number(x.unit_price||0)),0))\n    const money=value=>new Intl.NumberFormat('ar-DZ',{maximumFractionDigits:2}).format(Number(value||0))"""
          if old_computed in s:
              s = s.replace(old_computed, new_computed, 1)

          old_clear = "session.value=null;staff.value=[];products.value=[];inventory.value=[];adminWorkers.value=[];sale.value={sold_by:'',product_id:'',quantity:1,unit_price:'',notes:''}"
          new_clear = "session.value=null;staff.value=[];products.value=[];inventory.value=[];adminWorkers.value=[];todaySales.value=[];sale.value={sold_by:'',product_id:'',quantity:1,unit_price:'',notes:''}"
          if old_clear in s:
              s = s.replace(old_clear, new_clear, 1)

          old_admin_load = """      const [s,p,i,w]=await Promise.all([\n        supabase.from('staff').select('id,name').eq('active',true).order('id'),\n        supabase.from('products').select('id,name').order('id'),\n        supabase.from('inventory_summary').select('product_id,name,stock_quantity').order('product_id'),\n        supabase.from('worker_accounts').select('id,username,phone,nickname,staff_id,active,created_at').order('id')\n      ])\n      busy.value=false\n      const error=s.error||p.error||i.error||w.error\n      if(error)return notify('خطأ في قراءة البيانات: '+error.message,'error')\n      staff.value=s.data||[];products.value=p.data||[];inventory.value=i.data||[];adminWorkers.value=w.data||[]"""
          new_admin_load = """      const dayStart=new Date();dayStart.setHours(0,0,0,0)\n      const dayEnd=new Date(dayStart);dayEnd.setDate(dayEnd.getDate()+1)\n      const [s,p,i,w,t]=await Promise.all([\n        supabase.from('staff').select('id,name').eq('active',true).order('id'),\n        supabase.from('products').select('id,name').order('id'),\n        supabase.from('inventory_summary').select('product_id,name,stock_quantity').order('product_id'),\n        supabase.from('worker_accounts').select('id,username,phone,nickname,staff_id,active,created_at').order('id'),\n        supabase.from('sales').select('quantity,unit_price,operation_at').gte('operation_at',dayStart.toISOString()).lt('operation_at',dayEnd.toISOString()).order('operation_at',{ascending:false})\n      ])\n      busy.value=false\n      const error=s.error||p.error||i.error||w.error||t.error\n      if(error)return notify('خطأ في قراءة البيانات: '+error.message,'error')\n      staff.value=s.data||[];products.value=p.data||[];inventory.value=i.data||[];adminWorkers.value=w.data||[];todaySales.value=t.data||[]"""
          if old_admin_load in s:
              s = s.replace(old_admin_load, new_admin_load, 1)

          old_return = "return{session,loading,busy,loginMode,email,password,workerUsername,workerPassword,workerNickname,message,messageType,staff,products,inventory,adminWorkers,sale,workerForm,adminSessionHours,userMode,isLoggedIn,setLoginMode,adminLogin,workerLogin,logout,loadAll,saveSale,createWorker,toggleWorker,deleteWorker,saveAdminSessionHours}"
          new_return = "return{session,loading,busy,loginMode,email,password,workerUsername,workerPassword,workerNickname,message,messageType,staff,products,inventory,adminWorkers,todaySales,sale,workerForm,adminSessionHours,userMode,isLoggedIn,stockUnits,todaySalesCount,todayRevenue,money,setLoginMode,adminLogin,workerLogin,logout,loadAll,saveSale,createWorker,toggleWorker,deleteWorker,saveAdminSessionHours}"
          if old_return in s:
              s = s.replace(old_return, new_return, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit dashboard
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop/index.html
          git commit -m 'feat: add shop dashboard summary'
          git push
