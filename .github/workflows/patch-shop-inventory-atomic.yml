name: Patch shop physical inventory save

on:
  push:
    paths:
      - '.github/workflows/patch-shop-inventory-atomic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patch-shop-inventory-atomic.py
      - name: Validate
        run: grep -q "const adjustments=changed.map" shop/index.html
      - name: Commit and clean
        run: |
          rm -f .github/workflows/patch-shop-inventory-atomic.yml .github/patch-shop-inventory-atomic.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop/index.html docs/SHOP-LEDGER.md .github/workflows/patch-shop-inventory-atomic.yml .github/patch-shop-inventory-atomic.py
          git commit -m 'fix: save physical inventory adjustments atomically'
          git push
