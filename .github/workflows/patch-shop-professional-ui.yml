name: Patch professional shop dashboard

on:
  push:
    paths:
      - '.github/workflows/patch-shop-professional-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI patch
        run: python .github/patch-shop-professional-ui.py
      - name: Validate UI
        run: |
          grep -q 'shop-shell' shop/index.html
          grep -q 'MYTOOL / SHOP CONTROL' shop/index.html
          grep -q 'sidebarOpen' shop/index.html
          grep -q 'lowStockCount' shop/index.html
      - name: Commit and clean one-off files
        run: |
          rm -f .github/workflows/patch-shop-professional-ui.yml .github/patch-shop-professional-ui.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop/index.html docs/SHOP-LEDGER.md archive/ .github/workflows/patch-shop-professional-ui.yml .github/patch-shop-professional-ui.py
          git commit -m 'feat: add professional shop dashboard and sidebar'
          git push
