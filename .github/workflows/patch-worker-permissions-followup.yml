name: Fix worker inventory permission behavior

on:
  push:
    paths:
      - '.github/workflows/patch-worker-permissions-followup.yml'
      - '.github/patch-worker-permissions-followup.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply follow-up patch
        run: python .github/patch-worker-permissions-followup.py
      - name: Validate
        run: |
          grep -q "wa.can_view_stock or wa.can_inventory" shop/worker-auth.sql
          grep -q "can('view_stock')?'stock':'count'" shop/index.html
      - name: Commit and clean
        run: |
          rm -f .github/workflows/patch-worker-permissions-followup.yml .github/patch-worker-permissions-followup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop/index.html shop/worker-auth.sql .github/workflows/patch-worker-permissions-followup.yml .github/patch-worker-permissions-followup.py
          git commit -m 'fix: align inventory permission with stock data'
          git push
