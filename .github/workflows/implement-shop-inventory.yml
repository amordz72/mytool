name: Implement shop products and physical inventory

on:
  push:
    paths:
      - '.github/workflows/implement-shop-inventory.yml'

permissions:
  contents: write

jobs:
  patch-shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch shop inventory UI
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('shop/index.html')
          s = p.read_text(encoding='utf-8')

          archive = Path('archive/shop-index-before-products-inventory-2026-09-10.html')
          archive.parent.mkdir(parents=True, exist_ok=True)
          if not archive.exists():
              archive.write_text(s, encoding='utf-8')

          css_marker = ".setting-line{display:flex;gap:10px;align-items:end}.setting-line>div{flex:1}.setting-line button{width:auto;min-width:110px}"
          css_extra = css_marker + ".tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.tab{width:auto;padding:9px 13px;background:#fff;color:var(--main);border:1px solid var(--line);font-weight:800;cursor:pointer}.tab.active{background:var(--main);color:#fff;border-color:var(--main)}.product-list,.count-list{display:grid;gap:9px}.product-row,.count-row{border:1px solid var(--line);border-radius:14px;padding:12px;background:#f8fafc}.product-row{display:flex;gap:8px;align-items:center}.product-row input{flex:1}.product-row button{width:auto;min-width:80px}.count-row{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(90px,.6fr));gap:8px;align-items:center}.count-name{font-weight:800}.count-label{font-size:11px;color:var(--muted);margin-bottom:4px}.diff{font-weight:900;font-size:18px}.diff.plus{color:#047857}.diff.minus{color:var(--danger)}.audit-summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.audit-summary .pill{font-size:12px}.section-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.section-actions button{width:auto}.empty{padding:14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}"
          if '.count-list{' not in s:
              if css_marker not in s:
                  raise SystemExit('CSS marker not found')
              s = s.replace(css_marker, css_extra, 1)

          media_marker = "@media(max-width:620px){.dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.stock{grid-template-columns:1fr}.app{padding:10px}.top{align-items:flex-start}.toolbar{flex-wrap:wrap}.worker-row{align-items:flex-start;flex-direction:column}.worker-actions{width:100%}.worker-actions button{flex:1}.setting-line{align-items:stretch;flex-direction:column}.setting-line button{width:100%}}"
          media_new = "@media(max-width:620px){.dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.stock{grid-template-columns:1fr}.app{padding:10px}.top{align-items:flex-start}.toolbar{flex-wrap:wrap}.worker-row{align-items:flex-start;flex-direction:column}.worker-actions{width:100%}.worker-actions button{flex:1}.setting-line{align-items:stretch;flex-direction:column}.setting-line button{width:100%}.count-row{grid-template-columns:1fr 1fr}.count-name{grid-column:1/-1}.product-row{align-items:stretch;flex-direction:column}.product-row button{width:100%}.section-actions button{flex:1;min-width:130px}}"
          if media_marker in s:
              s = s.replace(media_marker, media_new, 1)

          old_inventory = '''    <section class="card">
      <div class="top" style="margin:0 0 12px">
        <div><h2 style="margin:0">المخزون الحالي</h2><div class="muted">محسوب من الحركات المسجلة.</div></div>
        <div class="pill">{{ inventory.length }} سلع</div>
      </div>
      <div class="stock">
        <div class="stock-item" v-for="item in inventory" :key="item.product_id">
          <div class="stock-name">{{ item.name }}</div><div class="stock-num">{{ item.stock_quantity }}</div>
        </div>
      </div>
    </section>'''

          new_inventory = '''    <section class="card">
      <div class="top" style="margin:0 0 12px">
        <div><h2 style="margin:0">المنتجات والمخزون</h2><div class="muted">المنتجات منفصلة عن حركة المخزون، والجرد الفعلي يسجل الفرق كتعديل مستقل.</div></div>
        <div class="pill">{{ inventory.length }} سلع</div>
      </div>

      <div v-if="userMode==='admin'" class="tabs">
        <button class="tab" :class="{active:inventoryTab==='products'}" @click="inventoryTab='products'">المنتجات</button>
        <button class="tab" :class="{active:inventoryTab==='stock'}" @click="inventoryTab='stock'">المخزون</button>
        <button class="tab" :class="{active:inventoryTab==='count'}" @click="openPhysicalCount">الجرد الفعلي</button>
      </div>

      <template v-if="userMode!=='admin' || inventoryTab==='stock'">
        <div class="stock">
          <div class="stock-item" v-for="item in inventory" :key="item.product_id">
            <div class="stock-name">{{ item.name }}</div><div class="stock-num">{{ item.stock_quantity }}</div>
          </div>
        </div>
      </template>

      <template v-if="userMode==='admin' && inventoryTab==='products'">
        <form @submit.prevent="addProduct" class="grid" style="margin-bottom:12px">
          <div><label>اسم المنتج الجديد</label><input v-model.trim="newProductName" required placeholder="مثال: كابل Type-C"></div>
          <div style="align-self:end"><button class="btn" :disabled="busy">إضافة منتج</button></div>
        </form>
        <div class="product-list">
          <div class="product-row" v-for="p in products" :key="p.id">
            <input v-model.trim="productNames[p.id]" :aria-label="'اسم '+p.name">
            <button class="btn secondary" @click="renameProduct(p)" :disabled="busy || !productNames[p.id]">حفظ الاسم</button>
          </div>
        </div>
        <div class="muted" style="margin-top:10px">لا نحذف المنتجات التي لها سجل مبيعات؛ تغيير الاسم آمن لأنه يحافظ على تاريخ الحركات.</div>
      </template>

      <template v-if="userMode==='admin' && inventoryTab==='count'">
        <p class="muted">اكتب العدد الموجود فعليًا فقط للسلع التي قمت بعدها. اترك الباقي فارغًا، ولن يتغير.</p>
        <div class="count-list">
          <div class="count-row" v-for="item in inventory" :key="item.product_id">
            <div class="count-name">{{ item.name }}</div>
            <div><div class="count-label">كمية النظام</div><strong>{{ item.stock_quantity }}</strong></div>
            <div><div class="count-label">العدد الحقيقي</div><input v-model.number="physicalCounts[item.product_id]" type="number" min="0" step="1" inputmode="numeric" placeholder="—"></div>
            <div><div class="count-label">الفرق</div><div class="diff" :class="difference(item)>0?'plus':(difference(item)<0?'minus':'')">{{ physicalCounts[item.product_id] === '' || physicalCounts[item.product_id] == null ? '—' : signed(difference(item)) }}</div></div>
          </div>
        </div>
        <div class="audit-summary" v-if="countedItems.length">
          <span class="pill">تم عد {{ countedItems.length }} سلعة</span>
          <span class="pill">إجمالي الفرق {{ signed(totalCountDifference) }}</span>
        </div>
        <div><label>سبب الجرد</label><input v-model.trim="physicalReason" placeholder="مثال: جرد نهاية اليوم"></div>
        <div class="section-actions">
          <button class="btn" @click="applyPhysicalCount" :disabled="busy || !countedItems.length">تأكيد الجرد وتسجيل الفروق</button>
          <button class="btn secondary" @click="resetPhysicalCount" :disabled="busy">مسح العد</button>
        </div>
      </template>
    </section>'''
          if 'المنتجات والمخزون' not in s:
              if old_inventory not in s:
                  raise SystemExit('Inventory section marker not found')
              s = s.replace(old_inventory, new_inventory, 1)

          old_soon = '''      <section class="card soon"><h2>الجرد الحقيقي</h2><p class="muted">مؤجل حاليًا. لاحقًا يدخل العدد الحقيقي لكل سلعة ويُسجل الفرق كتعديل جرد.</p><button disabled>مؤجل</button></section>'''
          s = s.replace(old_soon, '', 1)

          refs_old = "const sale=ref({sold_by:'',product_id:'',quantity:1,unit_price:'',notes:''})\n    const workerForm=ref({username:'',nickname:'',phone:'',password:''})"
          refs_new = "const sale=ref({sold_by:'',product_id:'',quantity:1,unit_price:'',notes:''})\n    const inventoryTab=ref('stock'),newProductName=ref(''),productNames=ref({}),physicalCounts=ref({}),physicalReason=ref('جرد فعلي')\n    const workerForm=ref({username:'',nickname:'',phone:'',password:''})"
          if 'const inventoryTab=ref(' not in s:
              if refs_old not in s:
                  raise SystemExit('Refs marker not found')
              s = s.replace(refs_old, refs_new, 1)

          computed_old = "const todayRevenue=computed(()=>(todaySales.value||[]).reduce((sum,x)=>sum+(Number(x.quantity||0)*Number(x.unit_price||0)),0))\n    const money=value=>new Intl.NumberFormat('ar-DZ',{maximumFractionDigits:2}).format(Number(value||0))"
          computed_new = "const todayRevenue=computed(()=>(todaySales.value||[]).reduce((sum,x)=>sum+(Number(x.quantity||0)*Number(x.unit_price||0)),0))\n    const countedItems=computed(()=>(inventory.value||[]).filter(x=>physicalCounts.value[x.product_id] !== '' && physicalCounts.value[x.product_id] != null))\n    const totalCountDifference=computed(()=>countedItems.value.reduce((sum,x)=>sum+difference(x),0))\n    const money=value=>new Intl.NumberFormat('ar-DZ',{maximumFractionDigits:2}).format(Number(value||0))"
          if 'const countedItems=computed' not in s:
              if computed_old not in s:
                  raise SystemExit('Computed marker not found')
              s = s.replace(computed_old, computed_new, 1)

          load_assign_old = "staff.value=s.data||[];products.value=p.data||[];inventory.value=i.data||[];adminWorkers.value=w.data||[];todaySales.value=t.data||[]"
          load_assign_new = "staff.value=s.data||[];products.value=p.data||[];inventory.value=i.data||[];adminWorkers.value=w.data||[];todaySales.value=t.data||[]\n      productNames.value=Object.fromEntries((products.value||[]).map(x=>[x.id,x.name]))"
          if 'productNames.value=Object.fromEntries' not in s:
              if load_assign_old not in s:
                  raise SystemExit('Load assignment marker not found')
              s = s.replace(load_assign_old, load_assign_new, 1)

          function_marker = "    async function createWorker(){"
          new_functions = r'''    function signed(value){const n=Number(value||0);return n>0?'+'+n:String(n)}
    function difference(item){
      const actual=physicalCounts.value[item.product_id]
      if(actual===''||actual==null)return 0
      return Number(actual)-Number(item.stock_quantity||0)
    }
    function openPhysicalCount(){inventoryTab.value='count'}
    function resetPhysicalCount(){physicalCounts.value={};physicalReason.value='جرد فعلي'}

    async function addProduct(){
      if(userMode.value!=='admin')return
      const name=(newProductName.value||'').trim()
      if(!name)return notify('اكتب اسم المنتج.','error')
      busy.value=true;message.value=''
      const {error}=await supabase.from('products').insert({name})
      busy.value=false
      if(error)return notify('لم تتم إضافة المنتج: '+error.message,'error')
      newProductName.value='';notify('تمت إضافة المنتج.')
      await loadAll();inventoryTab.value='products'
    }

    async function renameProduct(product){
      if(userMode.value!=='admin')return
      const name=(productNames.value[product.id]||'').trim()
      if(!name)return notify('اسم المنتج لا يمكن أن يكون فارغًا.','error')
      if(name===product.name)return notify('الاسم لم يتغير.')
      busy.value=true;message.value=''
      const {error}=await supabase.from('products').update({name}).eq('id',product.id)
      busy.value=false
      if(error)return notify('تعذر تعديل اسم المنتج: '+error.message,'error')
      notify('تم تحديث اسم المنتج.')
      await loadAll();inventoryTab.value='products'
    }

    async function findAdjustmentColumn(candidates){
      for(const column of candidates){
        const {error}=await supabase.from('stock_adjustments').select(column).limit(1)
        if(!error)return column
      }
      return null
    }

    async function applyPhysicalCount(){
      if(userMode.value!=='admin')return
      const rows=countedItems.value
      if(!rows.length)return notify('أدخل عددًا حقيقيًا لسلعة واحدة على الأقل.','error')
      for(const item of rows){
        const actual=Number(physicalCounts.value[item.product_id])
        if(!Number.isInteger(actual)||actual<0)return notify('العدد الحقيقي لـ '+item.name+' غير صحيح.','error')
      }
      const changed=rows.filter(item=>difference(item)!==0)
      if(!changed.length){notify('الجرد مطابق للمخزون المسجل، لا توجد فروق للحفظ.');resetPhysicalCount();return}
      const reason=(physicalReason.value||'').trim()
      if(!reason)return notify('اكتب سبب الجرد قبل التأكيد.','error')
      if(!confirm('سيتم تسجيل '+changed.length+' تعديل مخزون. متابعة؟'))return

      busy.value=true;message.value=''
      const qtyColumn=await findAdjustmentColumn(['quantity','quantity_change','quantity_delta','adjustment_quantity','adjustment','delta','change_quantity'])
      const reasonColumn=await findAdjustmentColumn(['reason','notes','note','description'])
      if(!qtyColumn||!reasonColumn){
        busy.value=false
        return notify('تعذر التعرف على بنية جدول stock_adjustments. أرسل الخطأ للمطور قبل تسجيل الجرد.','error')
      }

      for(const item of changed){
        const payload={product_id:Number(item.product_id)}
        payload[qtyColumn]=difference(item)
        payload[reasonColumn]=reason
        const {error}=await supabase.from('stock_adjustments').insert(payload)
        if(error){busy.value=false;return notify('توقف الجرد عند '+item.name+': '+error.message,'error')}
      }
      busy.value=false
      notify('تم تسجيل فروق الجرد بنجاح.')
      resetPhysicalCount();await loadAll();inventoryTab.value='stock'
    }

'''
          if 'async function applyPhysicalCount(){' not in s:
              if function_marker not in s:
                  raise SystemExit('Function marker not found')
              s = s.replace(function_marker, new_functions + function_marker, 1)

          return_old = "return{session,loading,busy,loginMode,email,password,workerUsername,workerPassword,workerNickname,message,messageType,staff,products,inventory,adminWorkers,todaySales,sale,workerForm,adminSessionHours,userMode,isLoggedIn,stockUnits,todaySalesCount,todayRevenue,money,setLoginMode,adminLogin,workerLogin,logout,loadAll,saveSale,createWorker,toggleWorker,deleteWorker,saveAdminSessionHours}"
          return_new = "return{session,loading,busy,loginMode,email,password,workerUsername,workerPassword,workerNickname,message,messageType,staff,products,inventory,adminWorkers,todaySales,sale,workerForm,adminSessionHours,inventoryTab,newProductName,productNames,physicalCounts,physicalReason,userMode,isLoggedIn,stockUnits,todaySalesCount,todayRevenue,countedItems,totalCountDifference,money,signed,difference,setLoginMode,adminLogin,workerLogin,logout,loadAll,saveSale,openPhysicalCount,resetPhysicalCount,addProduct,renameProduct,applyPhysicalCount,createWorker,toggleWorker,deleteWorker,saveAdminSessionHours}"
          if 'applyPhysicalCount,createWorker' not in s:
              if return_old not in s:
                  raise SystemExit('Return marker not found')
              s = s.replace(return_old, return_new, 1)

          p.write_text(s, encoding='utf-8')

          doc = Path('docs/SHOP-LEDGER.md')
          d = doc.read_text(encoding='utf-8')
          old = '''## الجرد الحقيقي
مطلوب لاحقًا شاشة مستقلة باسم **الجرد الحقيقي**:
- تعرض كمية البرنامج الحالية لكل سلعة.
- يدخل المستخدم العدد الحقيقي الموجود في المحل.
- يظهر الفرق موجبًا أو سالبًا.
- عند التأكيد يُسجل الفرق في `stock_adjustments` مع السبب والتاريخ بدل حذف أو تعديل سجل المبيعات القديم.

تم استعمال كمية تجريبية مبدئية موحدة أثناء الإعداد فقط، وليست جردًا حقيقيًا للمحل.'''
          new = '''## المنتجات والمخزون والجرد الفعلي
الحالة: `IMPLEMENTED` — يحتاج اختبارًا عمليًا بعد النشر.

تم توحيد إدارة المخزون داخل قسم **المنتجات والمخزون** بثلاثة أوضاع للإدارة:
- **المنتجات:** إضافة منتج وتعديل اسمه مع الحفاظ على سجل الحركات القديمة.
- **المخزون:** عرض الكمية الحالية المحسوبة من الحركات.
- **الجرد الفعلي:** إدخال العدد الحقيقي للسلع التي تم عدها فقط، إظهار الفرق موجبًا أو سالبًا، ثم تسجيل الفرق كحركة مستقلة في `stock_adjustments` مع السبب بدل تعديل أو حذف المبيعات القديمة.

واجهة الجرد لا تفترض اسم عمود كمية التعديل؛ تتحقق وقت التنفيذ من أسماء الحقول المعروفة في جدول `stock_adjustments` قبل الحفظ، وتتوقف برسالة واضحة إذا لم تتعرف على البنية بدل كتابة بيانات خاطئة.

تم استعمال كمية تجريبية مبدئية موحدة أثناء الإعداد فقط، وليست جردًا حقيقيًا للمحل.'''
          if old in d:
              d = d.replace(old, new, 1)
          d = d.replace('4. بعد نجاح الاختبار، بناء شاشة **الجرد الحقيقي**.', '4. اختبار تبويبات **المنتجات / المخزون / الجرد الفعلي** وتسجيل فرق جرد تجريبي واحد.')
          doc.write_text(d, encoding='utf-8')
          PY

      - name: Validate patched page
        run: |
          grep -q 'المنتجات والمخزون' shop/index.html
          grep -q 'applyPhysicalCount' shop/index.html
          grep -q 'archive/shop-index' <(find archive -maxdepth 1 -type f -print) || true

      - name: Commit implementation and remove one-off workflow
        run: |
          rm -f .github/workflows/implement-shop-inventory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop/index.html docs/SHOP-LEDGER.md archive/ .github/workflows/implement-shop-inventory.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'feat: add products inventory and physical count'
          git push
