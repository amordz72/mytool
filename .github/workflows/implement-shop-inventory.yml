name: Implement shop inventory

on:
  push:
    paths:
      - '.github/workflows/implement-shop-inventory.yml'

permissions:
  contents: write

jobs:
  patch-shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patch-shop-inventory.py
      - name: Validate
        run: |
          grep -q 'المنتجات والمخزون' shop/index.html
          grep -q 'applyPhysicalCount' shop/index.html
      - name: Commit implementation and clean one-off files
        run: |
          rm -f .github/workflows/implement-shop-inventory.yml .github/patch-shop-inventory.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop/index.html docs/SHOP-LEDGER.md archive/ .github/workflows/implement-shop-inventory.yml .github/patch-shop-inventory.py
          git commit -m 'feat: add products inventory and physical count'
          git push
