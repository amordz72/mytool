name: Patch compact mobile shop dashboard

on:
  push:
    paths:
      - '.github/workflows/patch-shop-mobile-ui-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile UI patch
        run: python .github/patch-shop-mobile-ui-v2.py
      - name: Validate mobile UI
        run: |
          grep -q 'class="shop-topbar"' shop/index.html
          grep -q 'aria-label="فتح القائمة"' shop/index.html
          grep -q 'position:sticky;top:0;z-index:30' shop/index.html
          grep -q 'تحديث البيانات</span></button>' shop/index.html
      - name: Commit and clean one-off files
        run: |
          rm -f .github/workflows/patch-shop-mobile-ui-v2.yml .github/patch-shop-mobile-ui-v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop/index.html docs/SHOP-LEDGER.md archive/ .github/workflows/patch-shop-mobile-ui-v2.yml .github/patch-shop-mobile-ui-v2.py
          git commit -m 'ui: refine mobile shop topbar and dashboard'
          git push
