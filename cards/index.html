<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#2ea8e6">
<title>معالج البطاقات - MyTool</title>
<style>
:root{--o:#f47700;--b:#2ea8e6;--t:#163047;--m:#61778a;--l:#d7e5ee;--g:#0f9f6e;--r:#d84c4c}*{box-sizing:border-box}body{margin:0;padding:8px;font-family:Arial,Tahoma,sans-serif;color:var(--t);background:linear-gradient(135deg,#fff7ef,#eef9ff)}.wrap{max-width:900px;margin:auto}.back{display:block;text-decoration:none;color:var(--t);font-weight:bold;background:#fff;border:1px solid var(--l);border-radius:10px;padding:9px 11px;margin-bottom:8px}.app{background:#fff;border:1px solid var(--l);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #16304718}.head{padding:13px 15px;color:#fff;background:linear-gradient(135deg,var(--o),#7fd3ff)}.head h1{font-size:20px;margin:0}.head p{margin:3px 0 0;font-size:12px}.body{padding:11px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border:1px solid var(--l);border-radius:13px;background:#f5f9fc}.tab{border:0;border-radius:9px;padding:10px 4px;background:transparent;font-weight:bold;color:var(--t)}.tab.on{color:#fff;background:linear-gradient(135deg,var(--o),var(--b))}.hint{font-size:12px;color:var(--m);padding:8px;margin:8px 0;background:#f7fbfe;border-radius:10px}.upload{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:bold;color:#fff;background:linear-gradient(135deg,var(--o),var(--b));cursor:pointer}.file{border:1px dashed #bad5e5;border-radius:10px;padding:9px;color:var(--m);font-size:12px;overflow-wrap:anywhere}textarea{width:100%;height:170px;margin-top:8px;padding:10px;border:1px solid var(--l);border-radius:12px;font-size:14px;outline:none}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px}.opt{font-size:13px;background:linear-gradient(90deg,#fff3e6,#eef9ff);padding:9px;border-radius:10px}.status{font-size:12px;color:var(--m);min-height:18px;margin-top:6px}.result{margin-top:10px}.group{border:1px solid var(--l);border-radius:12px;padding:10px;margin-top:8px}.title{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:bold;font-size:14px}.badge{font-size:11px;color:#fff;background:var(--b);border-radius:99px;padding:3px 8px}.codes{direction:ltr;text-align:left;white-space:pre-wrap;font-family:monospace;font-size:13px;max-height:150px;overflow:auto;background:#f8fbfd;border:1px solid var(--l);border-radius:9px;padding:9px;margin-top:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.green{background:var(--g)}.gold{background:#e99412}.split{margin-top:9px;padding:9px;border:1px solid var(--l);border-radius:10px;background:#fffaf5}.splitTop{display:grid;grid-template-columns:1fr auto;gap:7px}.split input{width:100%;padding:8px;border:1px solid var(--l);border-radius:8px}.counts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:7px}.count{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#fff;border:1px solid var(--l);border-radius:8px;padding:6px;font-size:12px}.count input{width:72px;text-align:center}.sum{font-size:12px;color:var(--m);margin-top:6px}.ok{color:var(--g);font-weight:bold}.bad{color:var(--r);font-weight:bold}.splitDownload{width:100%;margin-top:7px}.error{color:var(--r);font-weight:bold}@media(max-width:600px){.upload,.row,.splitTop{grid-template-columns:1fr}.counts{grid-template-columns:1fr}.btn{width:100%}}
</style>
</head>
<body><main class="wrap"><a class="back" href="../">← لوحة الأدوات</a><section class="app"><header class="head"><h1>معالج البطاقات</h1><p>Mobilis • Token Store • TXT</p></header><div class="body">
<div class="tabs"><button class="tab on" data-type="plain">نص عادي</button><button class="tab" data-type="token">Token Store</button><button class="tab" data-type="mobilis">Mobilis</button></div>
<div id="hint" class="hint">حفظ النص في TXT مع اسم منظم.</div>
<div class="upload"><button id="pick" class="btn">📂 رفع ملف</button><div id="fname" class="file">لم يتم اختيار ملف.</div><input id="file" type="file" accept=".txt,.csv,.log,text/plain,text/csv" hidden></div>
<textarea id="text" placeholder="ألصق النص هنا..."></textarea>
<div class="row"><label class="opt"><input id="trim" type="checkbox" checked> إزالة الفراغات من أول وآخر كل سطر</label><button id="process" class="btn">معالجة وتحضير</button></div>
<div id="status" class="status"></div><div id="result" class="result"></div>
</div></section></main>
<script>
const $=id=>document.getElementById(id), text=$('text'), file=$('file'), fname=$('fname'), result=$('result'), statusEl=$('status'), trim=$('trim');let type='plain',uploaded='';
const info={plain:['حفظ النص في TXT مع اسم منظم.','ألصق النص هنا...'],token:['استخراج Product و Code وتجميع كل منتج وحده.','ألصق رسالة Token Store هنا...'],mobilis:['أخذ ما قبل أول فاصلة فقط وحذف SN وما بعدها.','مثال:\n840779241509233,251112500016999']};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));$('hint').textContent=info[type][0];text.placeholder=info[type][1];result.innerHTML='';statusEl.textContent=''});
$('pick').onclick=()=>file.click();file.onchange=async()=>{const f=file.files[0];if(!f)return;uploaded=f.name;fname.textContent='الملف: '+f.name;text.value=await f.text();statusEl.textContent='تمت قراءة الملف.'};
const pad=n=>String(n).padStart(2,'0');function stamp(){const d=new Date;return{tm:pad(d.getHours())+'-'+pad(d.getMinutes()),dt:pad(d.getDate())+pad(d.getMonth()+1)+d.getFullYear()}}function safe(s){return String(s||'ملف').trim().replace(/[/\\?%*:|"<>]/g,'-').replace(/\s+/g,'-').replace(/-+/g,'-')}function mobilisValue(){const b=uploaded.replace(/\.[^.]+$/,'');let m=b.match(/(\d{2,5})[-_ ]*(?:DA|DZD)\b/i)||b.match(/MOBILIS[-_ ]*(\d{2,5})/i)||b.match(/CARTE[-_ ]*(\d{2,5})/i);return m?m[1]:''}
function nameMobilis(count,part,total){const s=stamp(),v=mobilisValue(),p=part?`_part-${part}-of-${total}`:'';return `Mobilis_${v?'carte-'+v:'carte'}_count-${count}${p}_${s.tm}_${s.dt}.txt`}function nameToken(prod,count,part,total){const s=stamp(),p=part?`_part-${part}-of-${total}`:'';return `TokenStore_${safe(prod)}_count-${count}${p}_${s.tm}_${s.dt}.txt`}function namePlain(count){const s=stamp();return `Text_count-${count}_${s.tm}_${s.dt}.txt`}
function download(content,name){const bom=new Uint8Array([239,187,191]),blob=new Blob([bom,new TextEncoder().encode(content)],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),800)}function copy(t){navigator.clipboard.writeText(t).then(()=>statusEl.textContent='تم النسخ.')}
function suggested(total,parts){const b=Math.floor(total/parts),r=total%parts;return Array.from({length:parts},(_,i)=>b+(i<r?1:0))}
function splitUI(id,items,nameFn){if(items.length<2)return'';return `<div class="split"><b>تقسيم البطاقات إلى أقسام</b><div class="splitTop"><input id="${id}parts" type="number" min="2" max="${items.length}" value="2"><button id="${id}prep" class="btn green">تحضير الأعداد</button></div><div id="${id}counts" class="counts"></div><div id="${id}sum" class="sum">اختر عدد الأقسام ثم عدّل العدد في كل قسم إذا أردت.</div><button id="${id}down" class="btn gold splitDownload" hidden>تقسيم وتحميل الملفات</button></div>`}
function initSplit(id,items,nameFn){const parts=$(id+'parts'),prep=$(id+'prep'),counts=$(id+'counts'),sum=$(id+'sum'),down=$(id+'down');if(!parts)return;function vals(){return [...counts.querySelectorAll('input')].map(x=>+x.value||0)}function check(){const v=vals(),n=v.reduce((a,b)=>a+b,0),valid=v.length&&v.every(x=>x>=1&&Number.isInteger(x))&&n===items.length;sum.className='sum '+(valid?'ok':'bad');sum.textContent=valid?`المجموع صحيح: ${n} من ${items.length}`:`المجموع الحالي ${n} من ${items.length} — الفرق ${items.length-n}`;down.hidden=!valid;return valid}function prepare(){const p=+parts.value;if(!Number.isInteger(p)||p<2||p>items.length){counts.innerHTML='';sum.className='sum bad';sum.textContent=`عدد الأقسام يجب أن يكون بين 2 و${items.length}`;down.hidden=true;return}counts.innerHTML=suggested(items.length,p).map((n,i)=>`<label class="count"><span>القسم ${i+1}</span><input type="number" min="1" step="1" value="${n}"></label>`).join('');counts.querySelectorAll('input').forEach(x=>x.oninput=check);check()}prep.onclick=prepare;parts.onchange=prepare;down.onclick=()=>{if(!check())return;let off=0;const v=vals();v.forEach((n,i)=>{const chunk=items.slice(off,off+n);off+=n;setTimeout(()=>download(chunk.join('\n'),nameFn(n,i+1,v.length)),i*250)});statusEl.textContent=`تم تجهيز ${v.length} ملفات.`};prepare()}
function group(title,codes,filename,id,nameFn,allowSplit=true){const out=codes.join('\n');return `<div class="group"><div class="title"><span>${title}</span><span class="badge">${codes.length} بطاقة</span></div><div class="codes" id="${id}codes"></div><div class="actions"><button class="btn green" id="${id}copy">نسخ</button><button class="btn gold" id="${id}download">تحميل TXT</button></div>${allowSplit?splitUI(id,codes,nameFn):''}</div>`}
function bindGroup(id,codes,filename,nameFn,allowSplit=true){$(id+'codes').textContent=codes.join('\n');$(id+'copy').onclick=()=>copy(codes.join('\n'));$(id+'download').onclick=()=>download(codes.join('\n'),filename);if(allowSplit)initSplit(id,codes,nameFn)}
function processPlain(){let lines=text.value.split(/\r\n|\n|\r/);if(trim.checked)lines=lines.map(x=>x.trim());lines=lines.filter(x=>x!==''),result.innerHTML=group('النص جاهز',lines,namePlain(lines.length),'plain',null,false);bindGroup('plain',lines,namePlain(lines.length),null,false)}
function processMobilis(){const cards=text.value.split(/\r\n|\n|\r/).filter(x=>x.trim()).map(x=>{const p=x.split(/[,،]/,1)[0];return trim.checked?p.trim():p}).filter(Boolean);if(!cards.length){result.innerHTML='<div class="error">لا توجد بطاقات صالحة.</div>';return}result.innerHTML=group('بطاقات Mobilis بدون SN',cards,nameMobilis(cards.length),'mob',nameMobilis,true);bindGroup('mob',cards,nameMobilis(cards.length),nameMobilis,true);statusEl.textContent='اسم الملف: '+nameMobilis(cards.length)}
function processToken(){const re=/Product:\s*([^\n\r]+)[\s\S]*?Code:\s*([\d\-]+)/gi,g={};let m;while((m=re.exec(text.value))!==null){const p=m[1].trim().replace(/[/\\?%*:|"<>]/g,'-');(g[p]??=[]).push(m[2].trim())}const keys=Object.keys(g);if(!keys.length){result.innerHTML='<div class="error">لم يتم العثور على بطاقات Token Store.</div>';return}result.innerHTML=keys.map((p,i)=>group('📦 '+p,g[p],nameToken(p,g[p].length),'tok'+i,(n,a,b)=>nameToken(p,n,a,b),true)).join('');keys.forEach((p,i)=>bindGroup('tok'+i,g[p],nameToken(p,g[p].length),(n,a,b)=>nameToken(p,n,a,b),true));statusEl.textContent=`تم استخراج ${keys.reduce((s,p)=>s+g[p].length,0)} بطاقة.`}
$('process').onclick=()=>{result.innerHTML='';statusEl.textContent='';if(!text.value.trim()){result.innerHTML='<div class="error">ألصق النص أو ارفع ملفًا أولًا.</div>';return}type==='mobilis'?processMobilis():type==='token'?processToken():processPlain()};
</script></body></html>
