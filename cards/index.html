<body><main class="wrap"><a class="back" href="../">← لوحة الأدوات</a><section class="app"><header class="head"><h1>معالج البطاقات</h1><p id="subtitle">Mobilis • Token Store • TXT</p></header><div class="body">
<div id="tabs" class="tabs"></div>
<div id="hint" class="hint">جاري تحميل قواعد البطاقات...</div>
<div class="upload"><button id="pick" class="btn">📂 رفع ملف</button><div id="fname" class="file">لم يتم اختيار ملف.</div><input id="file" type="file" accept=".txt,.csv,.log,text/plain,text/csv" hidden></div>
<textarea id="text" placeholder="جاري تحميل القواعد..."></textarea>
<div class="row"><label class="opt"><input id="trim" type="checkbox" checked> إزالة الفراغات من أول وآخر كل سطر</label><button id="process" class="btn">معالجة وتحضير</button></div>
<div id="status" class="status"></div><div id="result" class="result"></div>
</div></section></main>
<script>
const $=id=>document.getElementById(id),text=$('text'),file=$('file'),fname=$('fname'),result=$('result'),statusEl=$('status'),trim=$('trim');
const tokenInfo=['استخراج Product و Code وتجميع كل منتج وحده مع التحقق من تغيّر تنسيق المصدر.','ألصق رسالة Token Store هنا...'];
const plainInfo=['حفظ النص في TXT مع اسم منظم.','ألصق النص هنا...'];
const fallbackRules={version:1,cardTypes:[{id:'mobilis',name:'Mobilis',enabled:true,order:10,hint:'أخذ الرقم الموجود قبل أول فاصلة فقط وحذف SN وما بعدها. يتم التحقق من صيغة كل سطر قبل المعالجة.',placeholder:'مثال:\n840779241509233,251112500016999\n841742619957843,251112500017000',separators:[',','،'],take:'before',numbersOnly:true,length:15,snRequired:true,snNumbersOnly:true,snLength:null,uniformFormat:true,outputTitle:'بطاقات Mobilis بدون SN',filePrefix:'MOB',detectValueFromFilename:true,defaultValue:'CARTE',outputBom:false}]};
let cardRules=[],type='mobilis',uploaded='',rulesLoaded=false;

function normalizeRule(r){
  return {
    id:String(r.id||'').trim(),
    name:String(r.name||r.id||'').trim(),
    enabled:r.enabled!==false,
    order:Number.isFinite(Number(r.order))?Number(r.order):999,
    hint:String(r.hint||''),
    placeholder:String(r.placeholder||''),
    separators:Array.isArray(r.separators)&&r.separators.length?r.separators.map(String):[',','،'],
    take:r.take||'before',
    numbersOnly:r.numbersOnly!==false,
    length:Number.isInteger(Number(r.length))?Number(r.length):null,
    snRequired:r.snRequired!==false,
    snNumbersOnly:r.snNumbersOnly!==false,
    snLength:r.snLength===null||r.snLength===''||r.snLength===undefined?null:Number(r.snLength),
    uniformFormat:r.uniformFormat!==false,
    outputTitle:String(r.outputTitle||('بطاقات '+(r.name||r.id||''))),
    filePrefix:String(r.filePrefix||r.id||'CARD').trim(),
    detectValueFromFilename:r.detectValueFromFilename===true,
    defaultValue:String(r.defaultValue||''),
    outputBom:r.outputBom===true
  };
}
function validRule(r){
  return r.id&&r.name&&r.take==='before'&&r.separators.length&&(!r.length||Number.isInteger(r.length))&&(r.snLength===null||Number.isInteger(r.snLength));
}
async function loadRules(){
  let source=fallbackRules,warning='';
  try{
    const res=await fetch('../card-rules/card-rules.json',{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data||!Array.isArray(data.cardTypes))throw new Error('cardTypes مفقودة');
    source=data;
    rulesLoaded=true;
  }catch(e){
    warning='تعذر تحميل card-rules.json؛ تم تشغيل قاعدة Mobilis الاحتياطية فقط.';
    console.error(e);
  }
  cardRules=source.cardTypes.map(normalizeRule).filter(r=>r.enabled&&validRule(r)).sort((a,b)=>a.order-b.order);
  if(!cardRules.length)cardRules=fallbackRules.cardTypes.map(normalizeRule);
  renderTabs();
  if(!cardRules.some(r=>r.id===type))type=cardRules[0].id;
  selectType(type);
  if(warning)statusEl.textContent=warning;
}
function renderTabs(){
  const cardButtons=cardRules.map(r=>`<button class="tab" data-type="${esc(r.id)}">${esc(r.name)}</button>`).join('');
  $('tabs').innerHTML=cardButtons+'<button class="tab" data-type="token">Token Store</button><button class="tab" data-type="plain">نص عادي</button>';
  $('subtitle').textContent=[...cardRules.map(r=>r.name),'Token Store','TXT'].join(' • ');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectType(b.dataset.type));
}
function currentRule(){return cardRules.find(r=>r.id===type)||null}
function selectType(next){
  type=next;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.type===type));
  const rule=currentRule(),info=rule?[rule.hint,rule.placeholder]:type==='token'?tokenInfo:plainInfo;
  $('hint').textContent=info[0];
  text.placeholder=info[1];
  result.innerHTML='';
  statusEl.textContent='';
}
$('pick').onclick=()=>file.click();
file.onchange=async()=>{const f=file.files[0];if(!f)return;uploaded=f.name;fname.textContent='الملف: '+f.name;text.value=await f.text();statusEl.textContent='تمت قراءة الملف.'};

const pad=n=>String(n).padStart(2,'0');
function stamp(){const d=new Date;return{tm:pad(d.getHours())+'-'+pad(d.getMinutes()),dt:pad(d.getDate())+pad(d.getMonth()+1)+d.getFullYear()}}
function shortStamp(){const d=new Date;return{tm:pad(d.getHours())+pad(d.getMinutes()),dt:pad(d.getDate())+pad(d.getMonth()+1)+String(d.getFullYear()).slice(-2)}}
function safe(s){return String(s||'ملف').trim().replace(/[/\\?%*:|"<>]/g,'-').replace(/\s+/g,'-').replace(/-+/g,'-')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mobilisValue(){const b=uploaded.replace(/\.[^.]+$/,'');let m=b.match(/(\d{2,5})[-_ ]*(?:DA|DZD)\b/i)||b.match(/MOBILIS[-_ ]*(\d{2,5})/i)||b.match(/CARTE[-_ ]*(\d{2,5})/i);return m?m[1]:''}
function nameCard(rule,count,part,total){const s=shortStamp(),p=part?`_P${part}-${total}`:'',prefix=safe(rule.filePrefix||rule.id||'CARD').toUpperCase(),detected=rule.detectValueFromFilename?(mobilisValue()||rule.defaultValue):'',v=detected?`_${safe(detected)}`:'';return `${prefix}${v}_${count}${p}_${s.tm}_${s.dt}.txt`}
function nameToken(prod,count,part,total){const s=stamp(),p=part?`_part-${part}-of-${total}`:'';return `TokenStore_${safe(prod)}_count-${count}${p}_${s.tm}_${s.dt}.txt`}
function namePlain(count){const s=stamp();return `Text_count-${count}_${s.tm}_${s.dt}.txt`}
function download(content,name,withBom=true){const bytes=new TextEncoder().encode(content),parts=withBom?[new Uint8Array([239,187,191]),bytes]:[bytes],blob=new Blob(parts,{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),800)}
function copy(t){navigator.clipboard.writeText(t).then(()=>statusEl.textContent='تم النسخ.')}
function validationError(title,details=[]){result.innerHTML=`<div class="group validationBox"><div class="error">⚠️ ${esc(title)}</div>${details.length?`<ul class="validationList">${details.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="hint">لم يتم إنشاء أي مخرج. راجع المصدر ثم أعد المعالجة.</div></div>`;statusEl.textContent='تم إيقاف المعالجة لحماية البطاقات.';return false}

function validateCardSource(raw,rule){
  const lines=String(raw||'').split(/\r\n|\n|\r/),valid=[],bad=[];let sig=null;
  lines.forEach((original,i)=>{
    const line=trim.checked?original.trim():original;
    if(line==='')return;
    const found=rule.separators.map(sep=>({sep,pos:line.indexOf(sep)})).filter(x=>x.pos>=0).sort((a,b)=>a.pos-b.pos)[0];
    if(!found){bad.push(`السطر ${i+1}: لا توجد فاصلة معتمدة بين رقم البطاقة وSN`);return}
    if(line.indexOf(found.sep,found.pos+found.sep.length)>=0){bad.push(`السطر ${i+1}: يحتوي أكثر من فاصل من النوع نفسه`);return}
    const left=line.slice(0,found.pos).trim(),right=line.slice(found.pos+found.sep.length).trim();
    if(rule.numbersOnly&&!/^\d+$/.test(left)){bad.push(`السطر ${i+1}: رقم ${rule.name} قبل الفاصلة يجب أن يكون أرقامًا فقط`);return}
    if(rule.length&&left.length!==rule.length){bad.push(`السطر ${i+1}: رقم بطاقة ${rule.name} يجب أن يكون ${rule.length} رقمًا بالضبط (الموجود ${left.length})`);return}
    if(rule.snRequired&&!right){bad.push(`السطر ${i+1}: SN مفقود بعد الفاصلة`);return}
    if(right&&rule.snNumbersOnly&&!/^\d+$/.test(right)){bad.push(`السطر ${i+1}: SN يجب أن يكون أرقامًا فقط`);return}
    if(right&&rule.snLength!==null&&right.length!==rule.snLength){bad.push(`السطر ${i+1}: طول SN يجب أن يكون ${rule.snLength} رقمًا (الموجود ${right.length})`);return}
    const now={left:left.length,right:right.length,sep:found.sep};
    if(rule.uniformFormat){
      if(!sig)sig=now;
      else if(now.left!==sig.left||now.right!==sig.right||now.sep!==sig.sep){bad.push(`السطر ${i+1}: يختلف عن صيغة بقية بطاقات ${rule.name}`);return}
    }
    valid.push(left);
  });
  if(!valid.length)return{ok:false,details:[`لم يتم العثور على بطاقات ${rule.name} بالصيغة الرقمية المتوقعة.`]};
  if(bad.length)return{ok:false,details:bad.slice(0,8).concat(bad.length>8?[`ويوجد ${bad.length-8} أسطر أخرى تحتاج مراجعة.`]:[])};
  return{ok:true,cards:valid};
}

function validateTokenSource(raw){const normalized=String(raw||'').replace(/\r\n?/g,'\n'),start=normalized.search(/^[ \t]*PRODUCT DETAILS[ \t]*$/im);if(start<0)return{ok:false,details:['لم يتم العثور على PRODUCT DETAILS. قد يكون تنسيق المصدر قد تغيّر.']};let body=normalized.slice(start);const footer=body.search(/^[ \t]*(?:HOW TO USE YOUR CODE|NEED HELP\?|Are you a Telegram user\?)[ \t]*$/im);if(footer>=0)body=body.slice(0,footer);const blocks=body.split(/^[ \t]*PRODUCT DETAILS[ \t]*$/gim).map(x=>x.trim()).filter(Boolean),g={},bad=[];let productCount=0,codeCount=0,extracted=0;blocks.forEach((block,index)=>{const lines=block.split('\n'),products=[],codes=[];for(let i=0;i<lines.length;i++){const line=lines[i].trim().replace(/\*\*/g,'').trim();let m=line.match(/^Product\s*:\s*(.*)$/i);if(m){const v=m[1].trim();if(v)products.push(v);continue}m=line.match(/^Code\s*:\s*(.*)$/i);if(m){let v=m[1].trim();if(!v){for(let j=i+1;j<lines.length;j++){const next=lines[j].trim().replace(/\*\*/g,'').trim();if(!next)continue;if(/^(?:Product|Price|Serial|Code)\s*:/i.test(next)||/^(?:PRODUCT DETAILS|HOW TO USE YOUR CODE|NEED HELP\?)$/i.test(next))break;v=next;break}}if(v)codes.push(v)}}const uniqueProducts=[...new Set(products)],uniqueCodes=[...new Set(codes)];if(uniqueProducts.length===1)productCount++;if(uniqueCodes.length===1)codeCount++;if(uniqueProducts.length!==1||uniqueCodes.length!==1){bad.push(`القسم ${index+1}: ${uniqueProducts.length!==1?'اسم Product غير واضح':'Code غير واضح أو مفقود'}`);return}const p=uniqueProducts[0].replace(/[/\\?%*:|"<>]/g,'-'),c=uniqueCodes[0];(g[p]??=[]).push(c);extracted++});if(!blocks.length)return{ok:false,details:['لم يتم العثور على أي قسم PRODUCT DETAILS صالح.']};if(bad.length||productCount!==blocks.length||codeCount!==blocks.length||extracted!==blocks.length)return{ok:false,details:[`Product المكتشفة: ${productCount}`,`Code المكتشفة: ${codeCount}`,`البطاقات المستخرجة فعليًا: ${extracted}`,...bad.slice(0,5),bad.length>5?`ويوجد ${bad.length-5} أقسام أخرى تحتاج مراجعة.`:''].filter(Boolean)};return{ok:true,groups:g,total:extracted}}
function suggested(total,parts){const b=Math.floor(total/parts),r=total%parts;return Array.from({length:parts},(_,i)=>b+(i<r?1:0))}
function splitTopUI(id,items){if(items.length<2)return'';return `<div class="splitQuick"><div class="splitQuickRow"><span class="splitQuickLabel">عدد الأقسام</span><input id="${id}parts" type="number" inputmode="numeric" min="2" max="${items.length}" value="2"><button id="${id}prep" class="btn green miniBtn">تحضير</button></div><div id="${id}confirm" class="splitConfirm">2 أقسام • ${items.length} بطاقة</div></div>`}
function splitBottomUI(id,items){if(items.length<2)return'';return `<div class="splitDetails"><div class="splitDetailsHead"><b>توزيع الأقسام</b><button id="${id}reset" class="btn">توزيع متساوٍ</button></div><div id="${id}counts" class="counts"></div><div id="${id}sum" class="sum">المجموع يجب أن يساوي ${items.length} دائمًا.</div><button id="${id}down" class="btn gold splitDownload" hidden>تقسيم وتحميل الملفات</button></div>`}
function initSplit(id,items,nameFn,withBom=true){const parts=$(id+'parts'),prep=$(id+'prep'),confirm=$(id+'confirm'),reset=$(id+'reset'),counts=$(id+'counts'),sum=$(id+'sum'),down=$(id+'down');if(!parts)return;let locked=new Set(),lastValid=[];function inputs(){return[...counts.querySelectorAll('input[data-count]')]}function vals(){return inputs().map(x=>Number(x.value))}function validVals(v){return v.length&&v.every(x=>Number.isInteger(x)&&x>=1)&&v.reduce((a,b)=>a+b,0)===items.length}function renderLocks(){[...counts.querySelectorAll('.count')].forEach((row,i)=>{const isLocked=locked.has(i),inp=row.querySelector('input[data-count]'),btn=row.querySelector('.lockBtn');row.classList.toggle('lockedCount',isLocked);inp.readOnly=isLocked;btn.classList.toggle('locked',isLocked);btn.textContent=isLocked?'🔒':'🔓';btn.title=isLocked?'فك القفل':'قفل هذا القسم'})}function showState(note=''){const v=vals(),n=v.reduce((a,b)=>a+b,0),valid=validVals(v),p=v.length;confirm.textContent=`${p} أقسام • ${items.length} بطاقة • ${locked.size} مقفول`;sum.className='sum '+(valid?'ok':'bad');sum.textContent=valid?`${note?note+' — ':''}المجموع صحيح: ${n} من ${items.length}`:`المجموع الحالي ${n} من ${items.length} — يجب تصحيحه قبل التحميل`;down.hidden=!valid;return valid}function restore(message){inputs().forEach((x,i)=>x.value=lastValid[i]);renderLocks();sum.className='sum bad';sum.textContent=message+' — تم الإبقاء على آخر توزيع صحيح.';down.hidden=false;confirm.textContent=`${lastValid.length} أقسام • ${items.length} بطاقة • ${locked.size} مقفول`}function commit(changed){if(locked.has(changed))return;const all=inputs(),value=Number(all[changed].value);if(!Number.isInteger(value)||value<1){restore('القيمة غير صالحة');return}const others=all.map((_,i)=>i).filter(i=>i!==changed&&!locked.has(i)),lockedSum=[...locked].reduce((s,i)=>s+Number(all[i].value),0),remain=items.length-lockedSum-value;if(!others.length){if(remain!==0){restore('لا يوجد قسم مفتوح آخر لموازنة الفرق');return}}else{if(remain<others.length){restore('القيمة لا تترك بطاقة واحدة على الأقل لكل قسم مفتوح');return}const dist=suggested(remain,others.length);others.forEach((idx,j)=>all[idx].value=dist[j])}const next=vals();if(!validVals(next)){restore('التوزيع غير ممكن');return}lastValid=next.slice();showState()}function toggleLock(i){if(locked.has(i))locked.delete(i);else locked.add(i);renderLocks();showState()}function bindRows(){[...counts.querySelectorAll('.count')].forEach((row,i)=>{const x=row.querySelector('input[data-count]'),b=row.querySelector('.lockBtn');x.addEventListener('focus',()=>{if(!x.readOnly)setTimeout(()=>x.select(),0)});x.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();x.blur()}});x.addEventListener('change',()=>commit(i));b.addEventListener('click',()=>toggleLock(i))})}function prepare(){const p=Number(parts.value);if(!Number.isInteger(p)||p<2||p>items.length){counts.innerHTML='';confirm.textContent='عدد الأقسام غير صالح';sum.className='sum bad';sum.textContent=`عدد الأقسام يجب أن يكون بين 2 و${items.length}`;down.hidden=true;return}locked=new Set();const v=suggested(items.length,p);lastValid=v.slice();counts.innerHTML=v.map((n,i)=>`<div class="count"><span>القسم ${i+1}</span><input data-count data-index="${i}" inputmode="numeric" type="number" min="1" step="1" value="${n}"><button type="button" class="lockBtn" aria-label="قفل القسم ${i+1}">🔓</button></div>`).join('');bindRows();renderLocks();showState('تم التحضير')}function resetEqual(){const all=inputs();if(!all.length)return;locked=new Set();const v=suggested(items.length,all.length);all.forEach((x,i)=>x.value=v[i]);lastValid=v.slice();renderLocks();showState('تمت إعادة التوزيع بالتساوي')}prep.onclick=prepare;reset.onclick=resetEqual;parts.onchange=prepare;down.onclick=()=>{const v=vals();if(!validVals(v)){sum.className='sum bad';sum.textContent='المجموع لا يساوي عدد البطاقات، لن يتم التحميل.';down.hidden=true;return}let off=0;v.forEach((n,i)=>{const chunk=items.slice(off,off+n);off+=n;setTimeout(()=>download(chunk.join('\n'),nameFn(n,i+1,v.length),withBom),i*250)});statusEl.textContent=`تم تجهيز ${v.length} ملفات.`};prepare()}
function group(title,codes,filename,id,nameFn,allowSplit=true){return `<div class="group"><div class="title"><span>${title}</span><span class="badge">${codes.length} بطاقة</span></div><div class="actions"><button class="btn green" id="${id}copy">نسخ</button><button class="btn gold" id="${id}download">تحميل TXT</button></div>${allowSplit?splitTopUI(id,codes):''}<div class="codes" id="${id}codes"></div>${allowSplit?splitBottomUI(id,codes):''}</div>`}
function bindGroup(id,codes,filename,nameFn,allowSplit=true,withBom=true){$(id+'codes').textContent=codes.join('\n');$(id+'copy').onclick=()=>copy(codes.join('\n'));$(id+'download').onclick=()=>download(codes.join('\n'),filename,withBom);if(allowSplit)initSplit(id,codes,nameFn,withBom)}
function processPlain(){let lines=text.value.split(/\r\n|\n|\r/);if(trim.checked)lines=lines.map(x=>x.trim());lines=lines.filter(x=>x!==''),result.innerHTML=group('النص جاهز',lines,namePlain(lines.length),'plain',null,false);bindGroup('plain',lines,namePlain(lines.length),null,false,true)}
function processCard(rule){const checked=validateCardSource(text.value,rule);if(!checked.ok)return validationError(`تنسيق بطاقات ${rule.name} غير متطابق`,checked.details);const cards=checked.cards,id='card-'+safe(rule.id),nameFn=(n,a,b)=>nameCard(rule,n,a,b);result.innerHTML=group(rule.outputTitle,cards,nameCard(rule,cards.length),id,nameFn,true);bindGroup(id,cards,nameCard(rule,cards.length),nameFn,true,rule.outputBom);statusEl.textContent=`تم التحقق من ${cards.length} بطاقة ${rule.name} — الصيغة متطابقة وتم حذف SN.`}
function processToken(){const checked=validateTokenSource(text.value);if(!checked.ok)return validationError('تنسيق Token Store يحتاج مراجعة',checked.details);const g=checked.groups,keys=Object.keys(g);result.innerHTML=keys.map((p,i)=>group('📦 '+p,g[p],nameToken(p,g[p].length),'tok'+i,(n,a,b)=>nameToken(p,n,a,b),true)).join('');keys.forEach((p,i)=>bindGroup('tok'+i,g[p],nameToken(p,g[p].length),(n,a,b)=>nameToken(p,n,a,b),true,true));statusEl.textContent=`تم التحقق واستخراج ${checked.total} بطاقة.`}
$('process').onclick=()=>{result.innerHTML='';statusEl.textContent='';if(!text.value.trim()){result.innerHTML='<div class="error">ألصق النص أو ارفع ملفًا أولًا.</div>';return}const rule=currentRule();if(rule)processCard(rule);else if(type==='token')processToken();else processPlain()};
loadRules();
</script></body></html>
