<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2ea8e6">
<title>إعدادات معالج البطاقات - MyTool</title>
<style>
:root{--o:#f47700;--b:#2ea8e6;--t:#163047;--m:#61778a;--l:#d7e5ee;--g:#0f9f6e}*{box-sizing:border-box}body{margin:0;padding:8px;font-family:Arial,Tahoma,sans-serif;color:var(--t);background:linear-gradient(135deg,#fff7ef,#eef9ff)}.wrap{max-width:720px;margin:auto}.back{display:block;text-decoration:none;color:var(--t);font-weight:bold;background:#fff;border:1px solid var(--l);border-radius:10px;padding:10px 12px;margin-bottom:8px}.app{background:#fff;border:1px solid var(--l);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #16304718}.head{padding:14px 16px;color:#fff;background:linear-gradient(135deg,var(--o),#7fd3ff)}.head h1{font-size:20px;margin:0}.head p{margin:4px 0 0;font-size:12px}.body{padding:12px}.setting{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border:1px solid var(--l);border-radius:13px;padding:12px;margin-bottom:9px;background:#fbfdff}.setting b{display:block;margin-bottom:4px}.setting small{display:block;color:var(--m);line-height:1.6}.switch{width:24px;height:24px;flex:0 0 auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:0;border-radius:11px;padding:12px;font-weight:bold;color:#fff;background:linear-gradient(135deg,var(--o),var(--b));cursor:pointer}.green{background:var(--g)}.status{min-height:22px;margin-top:10px;font-size:13px;color:var(--g);font-weight:bold}.note{font-size:12px;color:var(--m);background:#f7fbfe;border-radius:10px;padding:9px;margin-bottom:10px}@media(max-width:520px){.actions{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<a class="back" href="./">← الرجوع إلى معالج البطاقات</a>
<section class="app"><header class="head"><h1>⚙️ إعدادات معالج البطاقات</h1><p>تُحفظ الإعدادات على هذا الجهاز فقط.</p></header><div class="body">
<div class="note">الإعدادات الثلاثة مفعّلة افتراضيًا. لا يتم حفظ نصوص البطاقات أو الأكواد في LocalStorage.</div>
<label class="setting"><span><b>إزالة الفراغات</b><small>إزالة الفراغات من أول وآخر كل سطر أثناء المعالجة.</small></span><input id="trim" class="switch" type="checkbox"></label>
<label class="setting"><span><b>التعرف التلقائي على الصيغة</b><small>يتعرف تلقائيًا على وفرلي / OneClick / Mobilis / Token Store وغيرها من الصيغ المعروفة.</small></span><input id="detect" class="switch" type="checkbox"></label>
<label class="setting"><span><b>المعالجة التلقائية</b><small>عند اللصق أو رفع ملف، يتم تجهيز النتيجة مباشرة بدون الضغط على زر معالجة.</small></span><input id="process" class="switch" type="checkbox"></label>
<div class="actions"><button id="save" class="btn green">حفظ الإعدادات</button><button id="defaults" class="btn">إرجاع الافتراضي ON</button></div>
<div id="status" class="status"></div>
</div></section></main>
<script>
const KEYS={trim:'mytool.cards.trim',detect:'mytool.cards.autoDetect',process:'mytool.cards.autoProcess'};
const trim=document.getElementById('trim'),detect=document.getElementById('detect'),process=document.getElementById('process'),status=document.getElementById('status');
function read(key){try{return localStorage.getItem(key)!=='0'}catch(e){return true}}
function load(){trim.checked=read(KEYS.trim);detect.checked=read(KEYS.detect);process.checked=read(KEYS.process)}
function save(){try{localStorage.setItem(KEYS.trim,trim.checked?'1':'0');localStorage.setItem(KEYS.detect,detect.checked?'1':'0');localStorage.setItem(KEYS.process,process.checked?'1':'0');status.textContent='تم حفظ الإعدادات.'}catch(e){status.textContent='تعذر حفظ الإعدادات على هذا المتصفح.'}}
document.getElementById('save').onclick=save;
document.getElementById('defaults').onclick=()=>{trim.checked=true;detect.checked=true;process.checked=true;save()};
load();
</script>
</body></html>
