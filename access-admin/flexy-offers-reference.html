<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f9fc">
<title>مرجع عروض Flexy — MyTool</title>
<link rel="stylesheet" href="../ui/template-v1.css">
<link rel="stylesheet" href="../mytool-bottom-nav.css">
<script src="../auth-guard.js?v=20260918-real-local-1" data-access="admin"></script>
<style>
[hidden]{display:none!important}
.ref-route{direction:ltr;text-align:left;font-family:monospace;overflow-wrap:anywhere}
.ref-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ref-offer{padding:12px;border:1px solid #e2ebf2;border-radius:14px;background:#fff}
.ref-offer strong{font-size:15px}
@media(max-width:600px){.ref-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body class="mt-app" data-mytool-app="access-admin">
<main class="mt-shell">

<header class="mt-topbar">
  <div class="mt-brand">
    <div class="mt-brand-mark">M</div>
    <div class="mt-brand-copy"><strong>MyTool</strong><small>مرجع داخلي</small></div>
  </div>
  <div class="mt-user">
    <div class="mt-user-copy"><strong>Flexy</strong><small>Offer Reference</small></div>
    <div class="mt-avatar">F</div>
  </div>
</header>

<section class="mt-page-head">
  <div class="mt-page-title">
    <div class="mt-page-icon">≡</div>
    <div class="mt-page-copy">
      <h1>مرجع عروض Flexy</h1>
      <p>مرجع داخلي للعروض الحقيقية التي ثبتناها من صور أو جلسات حية.</p>
    </div>
  </div>
  <button id="refreshBtn" class="mt-btn secondary mt-page-action" type="button">تحديث</button>
</section>

<div id="pageMessage" class="mt-alert" hidden>
  <div class="mt-alert-icon">ℹ️</div>
  <div class="mt-alert-copy"><h3 id="pageMessageTitle"></h3><p id="pageMessageText"></p></div>
</div>

<section class="mt-card">
  <div class="mt-section-head" style="margin-top:0">
    <div class="mt-section-copy">
      <h2>الشريحة الحالية</h2>
      <p>اليوم عندنا Mobilis SAMA. مستقبلاً نضيف Ooredoo / Djezzy بنفس المرجع.</p>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <label class="mt-search">
      <select id="simType" style="width:100%;border:0;outline:0;background:transparent;font:inherit">
        <option value="mobilis-sama">Mobilis SAMA</option>
      </select>
    </label>
    <label class="mt-search">
      <select id="family" style="width:100%;border:0;outline:0;background:transparent;font:inherit">
        <option value="">كل المجموعات</option>
        <option value="Sama Mix">Sama Mix</option>
        <option value="Sama Talk">Sama Talk</option>
        <option value="Sama Net">Sama Net</option>
        <option value="Revolution">Revolution</option>
        <option value="PixX">PixX</option>
      </select>
    </label>
  </div>
</section>

<section id="groups"></section>

</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://wqyebqzbbpohbnznqdjj.supabase.co';
const SUPABASE_KEY='sb_publishable_gO4umNBMJ0AWRk19HtKd7A_9X4DibYj';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let rows=[];

function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function showMessage(title,text,type=''){
  const box=$('pageMessage');
  box.className='mt-alert'+(type?' '+type:'');
  $('pageMessageTitle').textContent=title;
  $('pageMessageText').textContent=text;
  box.hidden=false;
}

function hideMessage(){ $('pageMessage').hidden=true; }

function sourceLabel(value){
  if(value==='live_image')return 'صورة حية';
  if(value==='live_agent')return 'Agent حي';
  return 'يدوي';
}

function render(){
  const groups={};
  rows.filter(r=>r.active).forEach(r=>{
    const key=r.family+'|'+r.route_template;
    (groups[key] ||= {family:r.family,route:r.route_template,rows:[]}).rows.push(r);
  });

  const html=Object.values(groups).map(group=>{
    const cards=group.rows
      .sort((a,b)=>(a.sort_index||0)-(b.sort_index||0))
      .map(row=>
        '<div class="ref-offer">'+
          '<div class="mt-row">'+
            '<div><strong>'+escapeHtml(row.raw_label)+'</strong>'+
              '<div class="mt-meta">Network Index: '+escapeHtml(row.network_index)+
              '<br>Sort: '+escapeHtml(row.sort_index)+
              '<br>المصدر: '+escapeHtml(sourceLabel(row.source_type))+'</div></div>'+
            '<span class="mt-chip primary">'+escapeHtml(row.amount)+'</span>'+
          '</div>'+
        '</div>'
      ).join('');

    return '<section class="mt-card">'+
      '<div class="mt-section-head" style="margin-top:0">'+
        '<div class="mt-section-copy"><h2>'+escapeHtml(group.family)+'</h2>'+
        '<p class="ref-route">'+escapeHtml(group.route)+'</p></div>'+
        '<span class="mt-chip success">'+group.rows.length+' عروض</span>'+
      '</div>'+
      '<div class="ref-grid">'+cards+'</div>'+
    '</section>';
  }).join('');

  $('groups').innerHTML=html||'<div class="mt-alert"><div class="mt-alert-icon">📭</div><div class="mt-alert-copy"><h3>لا توجد عروض</h3><p>لم نسجل عروضًا لهذه المجموعة بعد.</p></div></div>';
}

async function load(){
  hideMessage();
  $('refreshBtn').disabled=true;
  try{
    const auth=await supabase.auth.getSession();
    if(!auth.data.session)throw new Error('جلسة الإدارة غير متاحة.');

    const family=$('family').value||null;
    const simType=$('simType').value||null;
    const {data,error}=await supabase.rpc('flexy_admin_offer_reference',{
      p_operator:'mobilis',
      p_sim_type:simType,
      p_family:family
    });
    if(error)throw error;
    rows=Array.isArray(data)?data:[];
    render();
  }catch(error){
    rows=[];
    render();
    showMessage('تعذر تحميل المرجع',error?.message||'حدث خطأ غير متوقع.','danger');
  }finally{
    $('refreshBtn').disabled=false;
  }
}

$('family').addEventListener('change',load);
$('simType').addEventListener('change',load);
$('refreshBtn').addEventListener('click',load);
load();
</script>
<script src="../ui/template-v1.js"></script>
<script src="../mytool-bottom-nav.js" data-root="../" data-app="access-admin"></script>
</body>
</html>
