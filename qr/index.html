<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#2ea8e6">
<title>مولد QR - MyTool</title>
<script src="../auth-guard.js" data-access="admin"></script>
<style>
:root{--o:#ff8a1f;--b:#2ea8e6;--t:#163047;--m:#61778a;--l:#dbe7f0}*{box-sizing:border-box}body{margin:0;padding:12px;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#fff7ef,#eef9ff);color:var(--t);min-height:100vh}.wrap{max-width:720px;margin:auto}.back{display:block;text-decoration:none;color:var(--t);font-weight:700;background:#fff;border:1px solid var(--l);border-radius:12px;padding:10px 12px;margin-bottom:10px}.hero{background:linear-gradient(135deg,var(--o),#7fd3ff);color:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 24px #16304718}.hero h1{margin:0 0 5px;font-size:23px}.hero p{margin:0;font-size:12px;line-height:1.6}.card{margin-top:12px;background:#fff;border:1px solid var(--l);border-radius:16px;padding:14px;box-shadow:0 5px 16px #1630470d}.label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}textarea{width:100%;min-height:120px;resize:vertical;border:1px solid #bcd5e4;border-radius:12px;padding:12px;font:inherit;font-size:14px;outline:none;unicode-bidi:plaintext}textarea:focus{border-color:var(--b);box-shadow:0 0 0 3px #2ea8e61f}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.btn{border:1px solid #a9d5e9;background:#eef9ff;color:#0d5e86;border-radius:10px;padding:10px 8px;font-weight:700;font-size:12px;cursor:pointer}.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--o),var(--b))}.qrbox{min-height:285px;display:flex;align-items:center;justify-content:center;background:#f8fbfd;border:1px dashed #b9d5e3;border-radius:14px;margin-top:12px;padding:16px}.hint{font-size:11px;color:var(--m);line-height:1.6;margin-top:9px}.hidden{display:none}@media(max-width:560px){.actions{grid-template-columns:1fr}.hero{padding:15px}}
</style>
</head>
<body><main class="wrap">
<a class="back" href="../">← لوحة الأدوات</a>
<section class="hero"><h1>🔳 مولّد QR</h1><p>الصق رابطًا، رقمًا، نصًا أو بيانات Wi‑Fi ثم أنشئ QR مباشرة من المتصفح.</p></section>
<section class="card">
<label class="label" for="text">النص أو الرابط</label>
<textarea id="text" dir="auto" spellcheck="false" placeholder="مثال: https://example.com أو أي نص تريد تحويله إلى QR"></textarea>
<div class="actions">
<button class="btn primary" id="make">إنشاء QR</button>
<button class="btn" id="download">تحميل PNG</button>
<button class="btn" id="clear">مسح</button>
</div>
<div class="qrbox" id="qrbox"><span id="empty">سيظهر QR هنا</span><div id="qrcode"></div></div>
<div class="hint">المعالجة تتم داخل المتصفح. لتحميل الصورة اضغط «تحميل PNG» بعد إنشاء الكود.</div>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const text=document.getElementById('text'), qrcode=document.getElementById('qrcode'), empty=document.getElementById('empty');
function makeQR(){const v=text.value.trim();if(!v){alert('اكتب نصًا أو رابطًا أولًا');return;}qrcode.innerHTML='';empty.style.display='none';new QRCode(qrcode,{text:v,width:240,height:240,correctLevel:QRCode.CorrectLevel.M});}
document.getElementById('make').onclick=makeQR;
document.getElementById('clear').onclick=()=>{text.value='';qrcode.innerHTML='';empty.style.display='inline';text.focus();};
document.getElementById('download').onclick=()=>{const img=qrcode.querySelector('img'),canvas=qrcode.querySelector('canvas');let src='';if(img&&img.src)src=img.src;else if(canvas)src=canvas.toDataURL('image/png');if(!src){alert('أنشئ QR أولًا');return;}const a=document.createElement('a');a.href=src;a.download='mytool-qr.png';document.body.appendChild(a);a.click();a.remove();};
text.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')makeQR();});
</script>
</body>
</html>
