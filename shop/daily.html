<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0f766e">
  <title>التشغيل اليومي — MyTool</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--main:#0f766e;--danger:#b91c1c}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--text)}
    main{max-width:760px;margin:auto;padding:10px 10px 110px}.hidden{display:none!important}
    .message{padding:10px 12px;border-radius:12px;background:#eff6ff;color:#1d4ed8;margin-bottom:10px;font-size:13px}.message.error{background:#fff1f2;color:var(--danger)}
    .hero{background:linear-gradient(135deg,#0f172a,#134e4a);color:#fff;border-radius:20px;padding:17px;margin-bottom:12px}.hero h2{margin:0 0 6px;font-size:22px}.hero p{margin:0;color:#cbd5e1;font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.action{min-height:108px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:var(--text);box-shadow:0 4px 14px rgba(15,23,42,.05);display:flex;flex-direction:column;justify-content:space-between}.action strong{font-size:18px}.action span{color:var(--muted);font-size:12px}.ico{font-size:24px;color:var(--main)}
    .back-home{display:block;margin-top:12px;text-align:center;padding:11px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--main);text-decoration:none;font-weight:900;font-size:13px}
    @media(max-width:430px){main{padding:8px 8px 105px}.action{min-height:100px;padding:12px}.action strong{font-size:16px}.grid{gap:8px}}
  </style>
  <link rel="stylesheet" href="shop-common.css?v=20260917-daily-template-1">
  <script src="shop-routes.js?v=20260917-daily-template-1"></script>
  <script src="shop-shell.js?v=20260917-daily-template-1"></script>
</head>
<body data-screen="daily">
<main>
  <div id="sharedDailyTop"></div>
  <div id="message" class="message">جاري تجهيز العمليات المسموحة…</div>
  <section class="hero"><h2>التشغيل اليومي</h2><p>العمليات تأتي من القالب المشترك حسب الحساب والصلاحيات.</p></section>
  <div id="actions" class="grid"></div>
  <a class="back-home" href="index.html">العودة إلى الرئيسية</a>
</main>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const SUPABASE_URL='https://wqyebqzbbpohbnznqdjj.supabase.co'
const SUPABASE_KEY='sb_publishable_gO4umNBMJ0AWRk19HtKd7A_9X4DibYj'
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY)
const TOKEN='mytool_shop_worker_token',EXPIRES='mytool_shop_worker_expires_at',NICK='mytool_shop_worker_nickname',ADMIN_EXPIRES='mytool_admin_expires_at'
const $=id=>document.getElementById(id)

function render(perms,role,identity){
  ShopShell.mountDailyTop('sharedDailyTop')
  ShopShell.mountRoleNavigation({role,permissions:perms},'daily')
  ShopRoutes.renderDailyActions('actions',{role,permissions:perms})
  const identityEl=$('identity');if(identityEl)identityEl.textContent=identity
  $('message').classList.add('hidden')
}

async function init(){
  try{
    const now=Date.now(),exp=Number(localStorage.getItem(EXPIRES)||0),token=exp>now?(localStorage.getItem(TOKEN)||''):''
    if(token){
      const [ctxRes,branchRes]=await Promise.all([
        supabase.rpc('worker_get_context',{p_session_token:token}),
        supabase.rpc('worker_get_branch_context',{p_session_token:token})
      ])
      if(ctxRes.error||branchRes.error||!ctxRes.data?.length){location.replace('../');return}
      const ctx=ctxRes.data[0],branch=branchRes.data||{},branches=branch.branches||[]
      const branchName=branches.find(x=>Number(x.id)===Number(branch.default_branch_id))?.name||'مخزن العامل'
      const nickname=ctx.nickname||localStorage.getItem(NICK)||'العامل'
      const perms={sell:!!ctx.can_sell,purchase:!!ctx.can_purchase,inventory:!!ctx.can_inventory,view_stock:!!ctx.can_view_stock,transfer:!!branch.can_transfer,record_money:!!ctx.can_record_money,view_sales:!!ctx.can_view_sales}
      const localAdmin=localStorage.getItem('mytool_workspace_role')==='workspace_admin'
      render(perms,localAdmin?'admin':'worker',localAdmin?'مدير · دخول محلي':nickname+' — '+branchName)
      return
    }

    const {data}=await supabase.auth.getSession(),adminExp=Number(localStorage.getItem(ADMIN_EXPIRES)||0)
    if(!data?.session||adminExp<=now){location.replace('../');return}
    render({},'admin','المالك · النظام الرئيسي')
  }catch(error){
    $('message').textContent='تعذر فتح التشغيل اليومي: '+(error?.message||'خطأ غير معروف')
    $('message').className='message error'
  }
}

init()
</script>
</body>
</html>
