<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0f766e">
<title>الرئيسية — MyTool</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--main:#0f766e;--main2:#14b8a6}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--text)}main{max-width:760px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.top h1{font-size:21px;margin:0}.back{color:var(--main);font-weight:800;text-decoration:none}.identity{color:var(--muted);font-size:12px;margin-top:4px}.message{padding:11px;border-radius:12px;background:#eff6ff;color:#1d4ed8;margin-bottom:12px}.message.error{background:#fff1f2;color:#b91c1c}.hero{background:linear-gradient(135deg,#0f172a,#134e4a);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#cbd5e1;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action{min-height:116px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;text-decoration:none;color:var(--text);box-shadow:0 5px 18px #0f172a0d;display:flex;flex-direction:column;justify-content:space-between}.action strong{font-size:19px}.action span{color:var(--muted);font-size:12px}.ico{font-size:25px;color:var(--main)}.hidden{display:none!important}@media(max-width:430px){main{padding:8px}.action{min-height:105px;padding:13px}.action strong{font-size:17px}}
</style>
</head>
<body><main>
<div class="top"><div><h1>الرئيسية</h1><div id="identity" class="identity">جاري التحقق…</div></div><a class="back" href="./">حساب المحل ←</a></div>
<div id="message" class="message">جاري تجهيز الأدوات المسموحة…</div>
<section class="hero"><h2>عمليات المحل</h2><p>اختر العملية التي تريدها مباشرة.</p></section>
<div id="actions" class="grid"></div>
</main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase=createClient('https://wqyebqzbbpohbnznqdjj.supabase.co','sb_publishable_gO4umNBMJ0AWRk19HtKd7A_9X4DibYj')
const TOKEN='mytool_shop_worker_token',EXPIRES='mytool_shop_worker_expires_at',NICK='mytool_shop_worker_nickname'
const actions=[
 ['sale.html','＋','بيع','تسجيل بيع سريع','can_sell'],
 ['purchase.html','⇩','مشتريات','إدخال سلعة للمخزون','can_purchase'],
 ['inventory-count.html','✓','جرد','عد فعلي وتصحيح موثق','can_inventory'],
 ['stock.html','▦','المخزون','عرض كميات المخازن','can_view_stock'],
 ['transfers.html','⇄','تحويلات','سلع ونقد بين الفروع','can_transfer']
]
function render(perms,mode){
 document.getElementById('actions').innerHTML=actions.filter(a=>mode==='admin'||perms[a[4]]).map(a=>'<a class="action" href="'+a[0]+'"><div class="ico">'+a[1]+'</div><strong>'+a[2]+'</strong><span>'+a[3]+'</span></a>').join('')
 document.getElementById('message').classList.add('hidden')
}
async function init(){
 const exp=Number(localStorage.getItem(EXPIRES)||0),token=exp>Date.now()?(localStorage.getItem(TOKEN)||''):''
 if(token){
  const [ctx,branch]=await Promise.all([supabase.rpc('worker_get_context',{p_session_token:token}),supabase.rpc('worker_get_branch_context',{p_session_token:token})])
  if(ctx.error||branch.error){location.replace('../');return}
  const p=(ctx.data||[])[0]||{},b=branch.data||{}
  document.getElementById('identity').textContent=(localStorage.getItem(NICK)||'العامل')+' — '+((b.branches||[]).find(x=>Number(x.id)===Number(b.default_branch_id))?.name||'مخزن العامل')
  render({can_sell:!!p.can_sell,can_view_stock:!!p.can_view_stock,can_purchase:!!p.can_purchase,can_inventory:!!p.can_inventory,can_transfer:!!b.can_transfer},'worker');return
 }
 const {data}=await supabase.auth.getSession()
 if(!data?.session){location.replace('../');return}
 document.getElementById('identity').textContent='الإدارة — جميع المخازن';render({},'admin')
}
init().catch(e=>{const m=document.getElementById('message');m.textContent='تعذر فتح التشغيل: '+e.message;m.className='message error'})
</script></body></html>
