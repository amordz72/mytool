<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تصحيح العمليات — MyTool</title><link rel="stylesheet" href="shop-common.css?v=20260913-1501"><script src="shop-routes.js?v=20260913-1501"></script><script src="shop-shell.js?v=20260913-1501"></script><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,Tahoma,sans-serif}.shell{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin-bottom:10px}.toolbar{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:10px}select,input,button{font:inherit;padding:10px;border:1px solid #e5e7eb;border-radius:10px;background:#fff}.btn{background:#0f766e;color:#fff;border:0;font-weight:800}.btn.secondary{background:#fff;color:#0f766e;border:1px solid #0f766e}.btn.danger{background:#fff1f2;color:#b91c1c;border:1px solid #fecaca}.op{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px solid #e5e7eb;padding:11px 0}.op:first-child{border-top:0}.muted{color:#6b7280;font-size:12px}.voided{opacity:.65}.message{padding:10px;border-radius:10px;background:#eff6ff;color:#1d4ed8;margin-bottom:10px}.message.error{background:#fff1f2;color:#b91c1c}.message.ok{background:#ecfdf5;color:#047857}@media(max-width:640px){.toolbar{grid-template-columns:1fr}.op{grid-template-columns:1fr}.op button{width:100%}}</style></head><body data-screen="corrections"><div class="shell"><div id="sharedStandaloneTop"></div><script>ShopShell.mountStandalone('sharedStandaloneTop',{active:'corrections',role:'admin'})</script><div id="message" class="message">جاري تحميل العمليات…</div><section class="card"><h2 style="margin-top:0">تصحيح / إلغاء عملية</h2><div class="muted">لا نحذف السجل. العملية الأصلية تبقى محفوظة وتُعلّم كملغاة، وتُستبعد من المخزون والتقارير التشغيلية.</div><div class="toolbar"><select id="kind"><option value="">كل العمليات</option><option value="sale">المبيعات</option><option value="purchase">المشتريات</option></select><select id="status"><option value="current">غير الملغاة</option><option value="voided">الملغاة</option><option value="all">الكل</option></select><button id="refresh" class="btn secondary">تحديث</button></div><div id="list"></div></section></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const supabase=createClient('https://wqyebqzbbpohbnznqdjj.supabase.co','sb_publishable_gO4umNBMJ0AWRk19HtKd7A_9X4DibYj');const $=id=>document.getElementById(id);let rows=[];function notify(t,type='info'){$('message').textContent=t;$('message').className='message '+type}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return Number(v||0).toLocaleString('ar-DZ',{maximumFractionDigits:2})+' دج'}function render(){const kind=$('kind').value,status=$('status').value;const data=rows.filter(x=>(!kind||x.operation_type===kind)&&(status==='all'||(status==='voided'?!!x.voided_at:!x.voided_at)));$('list').innerHTML=data.length?data.map(x=>'<div class="op '+(x.voided_at?'voided':'')+'"><div><strong>'+(x.operation_type==='sale'?'بيع':'شراء')+' #'+x.operation_id+' — '+esc(x.product_name)+'</strong><div class="muted">'+esc(x.branch_name||'')+' · الكمية '+x.quantity+' · '+money(x.unit_amount)+' · '+new Date(x.operation_at).toLocaleString('ar-DZ')+'</div>'+(x.voided_at?'<div class="muted">ملغاة: '+esc(x.void_reason||'')+'</div>':'')+'</div>'+(x.voided_at?'':'<button class="btn danger" data-kind="'+x.operation_type+'" data-id="'+x.operation_id+'">إلغاء موثق</button>')+'</div>').join(''):'<div class="muted">لا توجد عمليات مطابقة.</div>';$('list').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>voidOp(b.dataset.kind,Number(b.dataset.id)));}async function load(){const{data:s}=await supabase.auth.getSession();if(!s?.session){location.replace('../');return}const{data,error}=await supabase.rpc('admin_list_recent_voidable_operations',{p_limit:100});if(error)return notify('تعذر تحميل العمليات: '+error.message,'error');rows=data||[];notify('تم تحميل آخر العمليات.','ok');render()}async function voidOp(kind,id){const reason=prompt('اكتب سبب الإلغاء/التصحيح:');if(!reason?.trim())return;if(!confirm('تأكيد إلغاء '+(kind==='sale'?'البيع':'الشراء')+' #'+id+'؟'))return;notify('جاري تسجيل الإلغاء…');const fn=kind==='sale'?'admin_void_sale':'admin_void_purchase';const args=kind==='sale'?{p_sale_id:id,p_reason:reason.trim()}:{p_purchase_id:id,p_reason:reason.trim()};const{error}=await supabase.rpc(fn,args);if(error){let m=error.message||'';if(m.includes('VOID_WOULD_NEGATIVE_STOCK'))m='لا يمكن إلغاء هذا الشراء لأن ذلك سيجعل المخزون سالبًا. صحح الجرد أولًا.';if(m.includes('PURCHASE_HAS_RETURNS'))m='لا يمكن إلغاء شراء له مرتجعات مورد مرتبطة به.';return notify(m,'error')}await load();notify('تم تسجيل الإلغاء مع الاحتفاظ بالسجل الأصلي.','ok')}$('kind').onchange=render;$('status').onchange=render;$('refresh').onclick=load;load().catch(e=>notify(e.message,'error'));</script></body></html>
