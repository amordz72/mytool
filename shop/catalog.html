<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>تصنيفات المنتجات — MyTool</title>
  <link rel="stylesheet" href="shop-common.css?v=20260913-1501">
  <script src="shop-routes.js?v=20260913-1805"></script><script src="shop-shell.js?v=20260913-1501"></script>
  <style>body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,Tahoma,sans-serif}.shell{max-width:980px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin-bottom:10px}.message{padding:10px;border-radius:10px;background:#eff6ff;color:#1d4ed8;margin-bottom:10px}.message.ok{background:#ecfdf5;color:#047857}.message.error{background:#fff1f2;color:#b91c1c}.muted{color:#6b7280;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.field{margin-top:8px}label{display:block;font-size:12px;font-weight:800;margin-bottom:4px}input,select,button{width:100%;font:inherit;padding:10px;border:1px solid #e5e7eb;border-radius:10px;background:#fff}.btn{background:#0f766e;color:#fff;border:0;font-weight:800}.btn.secondary{background:#fff;color:#0f766e;border:1px solid #0f766e}.categories,.products{display:grid;gap:8px;margin-top:10px}.category-row{display:grid;grid-template-columns:minmax(0,1fr) 90px auto 90px;gap:7px;align-items:center;padding:9px;border:1px solid #e5e7eb;border-radius:12px;background:#fafafa}.product-row{display:grid;grid-template-columns:minmax(190px,1.4fr) minmax(140px,1fr) minmax(120px,.7fr) 90px;gap:7px;align-items:center;padding:10px;border:1px solid #e5e7eb;border-radius:12px;background:#fafafa}.product-name{font-weight:900}.product-name small{display:block;color:#6b7280;margin-top:3px}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:800;background:#f3f4f6;color:#374151}.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.pager button{width:auto}.check{display:flex;align-items:center;gap:5px;font-size:12px}.check input{width:auto}@media(max-width:720px){.grid{grid-template-columns:1fr}.category-row{grid-template-columns:1fr 80px auto}.category-row .save-category{grid-column:1/-1}.product-row{grid-template-columns:1fr}}</style>
</head>
<body data-screen="catalog"><div class="shell">
  <div id="sharedStandaloneTop"></div><script>ShopShell.mountStandalone('sharedStandaloneTop',{active:'catalog',role:'admin'})</script>
  <div id="message" class="message">جاري تحميل كتالوج المنتجات…</div>
  <section class="card"><h2 style="margin-top:0">التصنيفات</h2><div class="muted">«غير مصنف» يعني منتجًا بلا تصنيف، وليس تصنيفًا ثابتًا.</div>
    <form id="newCategoryForm" class="grid" style="margin-top:10px"><div class="field"><label>اسم التصنيف</label><input id="newCategoryName" required placeholder="مثال: شواحن"></div><div class="field"><label>الترتيب</label><input id="newCategoryOrder" type="number" step="1" value="80"></div><div class="field" style="align-self:end"><button class="btn" type="submit">إضافة تصنيف</button></div></form><div id="categoryList" class="categories"></div>
  </section>
  <section class="card"><h2 style="margin-top:0">تصنيف المنتجات والخدمات</h2><div class="muted">السلعة تخضع للمخزون؛ الخدمة لا تدخل الجرد والمشتريات السلعية.</div>
    <div class="grid" style="margin-top:10px"><div class="field"><label>بحث</label><input id="productSearch" type="search" placeholder="الاسم أو Product ID"></div><div class="field"><label>التصنيف</label><select id="productCategoryFilter"></select></div><div class="field"><label>النوع</label><select id="productTypeFilter"><option value="all">كل الأنواع</option><option value="product">سلع</option><option value="service">خدمات</option></select></div></div>
    <div id="catalogSummary" class="muted" style="margin-top:8px"></div><div id="productList" class="products"></div><div class="pager"><button id="prevPage" class="btn secondary" type="button">السابق</button><span id="pageInfo" class="muted"></span><button id="nextPage" class="btn secondary" type="button">التالي</button></div>
  </section>
</div><script type="module" src="catalog-admin.js?v=20260913-1805"></script></body></html>
