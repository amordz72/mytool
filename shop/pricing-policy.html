<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>سياسة الأسعار — MyTool</title><link rel="stylesheet" href="shop-common.css?v=20260913-1501"><script src="shop-routes.js?v=20260913-1735"></script><script src="shop-shell.js?v=20260913-1501"></script><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,Tahoma,sans-serif}.shell{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{margin-top:10px}label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}select,input,button{width:100%;font:inherit;padding:11px;border:1px solid #e5e7eb;border-radius:11px;background:#fff}.btn{background:#0f766e;color:#fff;border:0;font-weight:800}.btn.secondary{background:#fff;color:#0f766e;border:1px solid #0f766e}.message{padding:10px;border-radius:10px;background:#eff6ff;color:#1d4ed8;margin-bottom:10px}.message.error{background:#fff1f2;color:#b91c1c}.message.ok{background:#ecfdf5;color:#047857}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.stat{padding:10px;border-radius:12px;background:#f8fafc;border:1px solid #e5e7eb}.stat small{display:block;color:#6b7280}.stat strong{display:block;margin-top:5px}.warn{padding:10px;border-radius:10px;background:#fff7ed;color:#9a3412;margin-top:10px}.ok{padding:10px;border-radius:10px;background:#ecfdf5;color:#047857;margin-top:10px}.muted{color:#6b7280;font-size:12px}.check{display:flex;gap:8px;align-items:center;margin-top:12px}.check input{width:auto}.hidden{display:none!important}@media(max-width:680px){.grid,.stats{grid-template-columns:1fr}.shell{padding:8px}}</style></head><body data-screen="pricing"><div class="shell"><div id="sharedStandaloneTop"></div><script>ShopShell.mountStandalone('sharedStandaloneTop',{active:'pricing',role:'admin'})</script><div id="message" class="message">جاري تحميل سياسة الأسعار…</div><section class="card"><h2 style="margin-top:0">سياسة الأسعار</h2><div class="muted">تكلفة الشراء الحقيقية والربح الحقيقي خاصان بالإدارة. العامل يرى سعر البيع والحد الأدنى/المرجع التشغيلي فقط حسب الإعداد.</div><div class="grid"><div class="field"><label>الفرع</label><select id="branchSelect"></select></div><div class="field"><label>المنتج</label><input id="productSearch" type="search" placeholder="ابحث بالاسم أو Product ID"><select id="productSelect" style="margin-top:6px"></select></div></div><div id="summary" class="stats"></div><div id="reviewState"></div></section><section class="card"><form id="policyForm"><div class="grid"><div class="field"><label>سعر البيع المقترح (دج)</label><input id="targetSale" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="field"><label>طريقة الحد الأدنى</label><select id="minimumMode"><option value="cost_floor">منع الخسارة فقط — حسب التكلفة الحقيقية</option><option value="manual">حد أدنى يدوي</option><option value="margin_percent">التكلفة + نسبة حماية %</option><option value="margin_amount">التكلفة + مبلغ حماية</option><option value="fixed">سعر ثابت بلا تخفيض</option></select></div><div class="field" id="minimumValueWrap"><label id="minimumValueLabel">قيمة الحد / الهامش</label><input id="minimumValue" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="field"><label>مرجع شراء تشغيلي للعامل — اختياري</label><input id="workerReference" type="number" min="0" step="0.01" inputmode="decimal"><div class="muted">ليس تكلفة المحاسبة الحقيقية ولا يستخدم لحساب الربح.</div></div></div><label class="check"><input id="showMinimum" type="checkbox" checked> إظهار الحد الأدنى للعامل</label><div style="margin-top:12px"><button class="btn" type="submit">حفظ واعتماد السياسة</button></div></form></section></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const supabase=createClient('https://wqyebqzbbpohbnznqdjj.supabase.co','sb_publishable_gO4umNBMJ0AWRk19HtKd7A_9X4DibYj');const $=id=>document.getElementById(id);let branches=[],products=[],policies=[];const mode=localStorage.getItem('mytool_admin_data_mode')==='test'?'test':'real';function notify(t,type='info'){$('message').textContent=t;$('message').className='message '+type}function money(v){return v===null||v===undefined?'—':Number(v).toLocaleString('ar-DZ',{maximumFractionDigits:2})+' دج'}function fillProducts(){const q=$('productSearch').value.trim().toLowerCase();const rows=products.filter(p=>!q||String(p.name).toLowerCase().includes(q)||String(p.id).includes(q));const current=$('productSelect').value;$('productSelect').innerHTML='<option value="">اختر المنتج</option>'+rows.map(p=>'<option value="'+p.id+'">'+p.name+' (#'+p.id+')</option>').join('');if(current&&rows.some(p=>String(p.id)===String(current)))$('productSelect').value=current}function selectedPolicy(){const product=Number($('productSelect').value);return policies.find(x=>Number(x.product_id)===product)||null}function render(){const p=selectedPolicy();if(!p){$('summary').innerHTML='';$('reviewState').innerHTML='';return}$('summary').innerHTML='<div class="stat"><small>التكلفة الحقيقية</small><strong>'+money(p.true_cost)+'</strong></div><div class="stat"><small>سعر البيع</small><strong>'+money(p.target_sale_price)+'</strong></div><div class="stat"><small>الحد الأدنى الفعلي</small><strong>'+money(p.minimum_sale_price)+'</strong></div><div class="stat"><small>الربح الحقيقي عند السعر</small><strong>'+money(p.real_profit_at_target)+'</strong></div>';$('reviewState').innerHTML=p.review_required?'<div class="warn">تكلفة الشراء تغيرت أو لم تُراجع بعد — راجع سعر البيع والحد الأدنى ثم اضغط حفظ.</div>':'<div class="ok">السعر مراجع على التكلفة الحالية.</div>';$('targetSale').value=p.target_sale_price??'';$('minimumMode').value=p.minimum_mode||'cost_floor';$('minimumValue').value=p.minimum_value??'';$('workerReference').value=p.worker_reference_purchase_price??'';$('showMinimum').checked=p.show_minimum_to_worker!==false;syncMode()}function syncMode(){const m=$('minimumMode').value;const wrap=$('minimumValueWrap');wrap.classList.toggle('hidden',m==='cost_floor'||m==='fixed');$('minimumValueLabel').textContent=m==='manual'?'الحد الأدنى اليدوي (دج)':m==='margin_percent'?'نسبة الحماية %':'مبلغ الحماية (دج)'}async function loadPolicies(){const branch=Number($('branchSelect').value);if(!branch){policies=[];render();return}const{data,error}=await supabase.rpc('admin_get_branch_product_sale_policy',{p_branch_id:branch});if(error)return notify('تعذر تحميل سياسة الأسعار: '+error.message,'error');policies=data||[];render()}async function load(){const{data:s}=await supabase.auth.getSession();if(!s?.session){location.replace('../');return}const[b,p]=await Promise.all([supabase.from('branches').select('id,name').eq('active',true).order('id'),supabase.from('products').select('id,name,is_test').eq('is_test',mode==='test').order('id')]);if(b.error||p.error)return notify('تعذر تحميل البيانات: '+(b.error||p.error).message,'error');branches=b.data||[];products=p.data||[];$('branchSelect').innerHTML=branches.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');const saved=Number(localStorage.getItem('mytool_admin_branch_id')||0);if(saved&&branches.some(x=>Number(x.id)===saved))$('branchSelect').value=String(saved);fillProducts();await loadPolicies();notify('سياسة الأسعار جاهزة. وضع البيانات: '+(mode==='test'?'تجريبي':'حقيقي'),'ok')}async function save(e){e.preventDefault();const branch=Number($('branchSelect').value),product=Number($('productSelect').value),target=$('targetSale').value.trim()===''?null:Number($('targetSale').value),minMode=$('minimumMode').value,minValue=$('minimumValue').value.trim()===''?null:Number($('minimumValue').value),workerRef=$('workerReference').value.trim()===''?null:Number($('workerReference').value);if(!branch||!product)return notify('اختر الفرع والمنتج.','error');if(minMode==='manual'&&minValue===null)return notify('أدخل الحد الأدنى اليدوي.','error');if(minMode==='fixed'&&target===null)return notify('أدخل سعر البيع للسعر الثابت.','error');notify('جاري حفظ السياسة…');const{error}=await supabase.rpc('admin_set_branch_product_sale_policy',{p_branch_id:branch,p_product_id:product,p_target_sale_price:target,p_minimum_mode:minMode,p_minimum_value:minValue,p_worker_reference_purchase_price:workerRef,p_show_minimum_to_worker:$('showMinimum').checked});if(error)return notify('تعذر الحفظ: '+error.message,'error');await loadPolicies();notify('تم حفظ واعتماد سياسة السعر.','ok')}$('productSearch').oninput=fillProducts;$('productSelect').onchange=render;$('branchSelect').onchange=async()=>{localStorage.setItem('mytool_admin_branch_id',$('branchSelect').value);await loadPolicies()};$('minimumMode').onchange=syncMode;$('policyForm').onsubmit=save;load().catch(e=>notify(e.message,'error'));</script></body></html>
