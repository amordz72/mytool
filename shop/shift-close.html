<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إغلاق الوردية — MyTool</title>
<link rel="stylesheet" href="shop-common.css?v=20260914-shift1"><script src="shop-routes.js?v=20260914-shift1"></script><script src="shop-shell.js?v=20260914-shift1"></script>
<style>:root{--bg:#f4f7fb;--line:#e5e7eb;--main:#0f766e;--danger:#b91c1c;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:var(--bg)}main{max-width:760px;margin:auto;padding:10px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:9px}.msg{padding:10px;border-radius:10px;background:#eff6ff;color:#1d4ed8;margin-bottom:9px}.error{background:#fff1f2;color:var(--danger)}.ok{background:#ecfdf5;color:#047857}.denoms{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.d,.t,.item{padding:9px;border:1px solid var(--line);border-radius:10px}.d b,.t small{display:block}.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.t small,.muted{color:var(--muted);font-size:12px}.t b{font-size:19px}input,textarea,button{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}button{background:var(--main);color:#fff;font-weight:900;margin-top:8px}.reject{background:var(--danger)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.hidden{display:none!important}@media(max-width:600px){.denoms{grid-template-columns:repeat(2,1fr)}.totals{grid-template-columns:1fr}}</style></head>
<body data-screen="shift-close"><main><div id="top"></div><div id="msg" class="msg">جاري التحميل…</div>
<section id="workerCard" class="card hidden"><h2>إغلاق ورديتي</h2><p class="muted">عدّ المال الموجود فعليًا. الإغلاق يُرسل للإدارة ولا يغيّر رصيد الكيس حتى تعتمد الإدارة.</p><div id="denoms" class="denoms"></div><p><label>مبلغ آخر</label><input id="other" type="number" min="0" step="0.01" value="0"></p><div class="totals"><div class="t"><small>المتوقع</small><b id="expected">0</b></div><div class="t"><small>الموجود</small><b id="actual">0</b></div><div class="t"><small>الفرق</small><b id="diff">0</b></div></div><p><textarea id="notes" placeholder="ملاحظة اختيارية"></textarea></p><button id="submit">إرسال الإغلاق للإدارة</button></section>
<section id="adminCard" class="card hidden"><h2>إغلاقات العمال</h2><p class="muted">اعتماد الإغلاق يطابق رصيد الكيس ويسجل الفرق. الرفض لا يغير أي رصيد.</p><div id="list"></div></section></main>
<script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.ShopApiConfig,s=createClient(c.url,c.key),$=x=>document.getElementById(x),D=[10,20,50,100,200,500,1000,2000],M=n=>new Intl.NumberFormat('ar-DZ',{maximumFractionDigits:2}).format(Number(n||0))+' دج',esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let token='',expected=0;
function notify(t,k=''){$('msg').textContent=t;$('msg').className='msg '+k}function counts(){let o={};D.forEach(d=>o[d]=Math.max(0,Math.trunc(+document.querySelector('[data-d="'+d+'"]').value||0)));return o}function calc(){let o=counts(),a=D.reduce((n,d)=>n+d*o[d],0)+Math.max(0,+$('other').value||0),df=a-expected;$('expected').textContent=M(expected);$('actual').textContent=M(a);$('diff').textContent=(df>0?'+':'')+M(df);return{o,a}}
function draw(){ $('denoms').innerHTML=D.map(d=>'<div class="d"><b>'+d+' دج</b><input data-d="'+d+'" type="number" min="0" step="1" value="0"></div>').join('');document.querySelectorAll('[data-d]').forEach(i=>i.oninput=calc);$('other').oninput=calc}
async function worker(){ShopShell.mountStandalone('top',{role:'worker',permissions:{can_record_money:true}});$('workerCard').classList.remove('hidden');let r=await s.rpc('worker_get_shift_close_context',{p_session_token:token});if(r.error)throw r.error;expected=+r.data.expected_amount||0;calc();if(r.data.pending){$('submit').disabled=true;notify('لديك إغلاق مرسل ينتظر مراجعة الإدارة.','ok')}else notify('جاهز للعد.');$('submit').onclick=async()=>{let v=calc();if(!confirm('إرسال الإغلاق بمبلغ '+M(v.a)+'؟'))return;$('submit').disabled=true;let x=await s.rpc('worker_submit_shift_close',{p_session_token:token,p_counts:v.o,p_other:Math.max(0,+$('other').value||0),p_notes:$('notes').value.trim()||null});if(x.error){$('submit').disabled=false;throw x.error}notify('تم إرسال الإغلاق رقم '+x.data+' للإدارة.','ok')}}
function row(x){let state=x.status==='pending'?'ينتظر':x.status==='approved'?'معتمد':'مرفوض',buttons=x.status==='pending'?'<div class="actions"><button data-ok="'+x.id+'">اعتماد</button><button class="reject" data-no="'+x.id+'">رفض</button></div>':'';return'<div class="item"><b>'+esc(x.worker_name)+' — '+esc(x.branch_name)+'</b><p>المتوقع: '+M(x.expected_amount)+' · الموجود: '+M(x.actual_amount)+' · الفرق: '+(x.difference_amount>0?'+':'')+M(x.difference_amount)+'</p><small>'+new Date(x.submitted_at).toLocaleString('ar-DZ')+' · '+state+'</small>'+buttons+'</div>'}
async function admin(){ShopShell.mountStandalone('top',{role:'admin'});$('adminCard').classList.remove('hidden');let r=await s.rpc('admin_get_shift_closings');if(r.error)throw r.error;$('list').innerHTML=(r.data||[]).length?r.data.map(row).join(''):'<p class="muted">لا توجد إغلاقات بعد.</p>';document.querySelectorAll('[data-ok],[data-no]').forEach(b=>b.onclick=async()=>{let action=b.dataset.ok?'approve':'reject',id=+(b.dataset.ok||b.dataset.no);if(!confirm(action==='approve'?'اعتماد الإغلاق وتحديث رصيد الكيس؟':'رفض الإغلاق دون تغيير الرصيد؟'))return;let note=prompt('ملاحظة المراجعة (اختيارية):','')||null,r=await s.rpc('admin_review_shift_close',{p_closing_id:id,p_action:action,p_notes:note});if(r.error)throw r.error;await admin();notify(action==='approve'?'تم الاعتماد وتسجيل المطابقة.':'تم الرفض دون تغيير الرصيد.','ok')});notify('الإغلاقات جاهزة.')}
async function init(){draw();let exp=+localStorage.getItem('mytool_shop_worker_expires_at')||0;token=exp>Date.now()?(localStorage.getItem('mytool_shop_worker_token')||''):'';if(token)return worker();let a=await s.auth.getSession();if(!a.data?.session)return location.replace('../');return admin()}init().catch(e=>notify('تعذر تشغيل الصفحة: '+e.message,'error'));</script></body></html>
