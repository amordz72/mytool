<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0f766e">
  <title>حساب المحل — MyTool</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--main:#0f766e;--main2:#14b8a6;--danger:#b91c1c}

    textarea{min-height:70px;resize:vertical}.btn{border:0;background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}
    .btn.secondary{background:#fff;color:var(--main);border:1px solid var(--main)}.btn.danger{background:#fff;color:var(--danger);border:1px solid #fecaca}.error{background:#fff1f2;color:var(--danger);padding:10px;border-radius:12px;margin-top:10px;font-size:13px}
    .ok{background:#ecfdf5;color:#047857;padding:10px;border-radius:12px;margin-top:10px;font-size:13px}.stock{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .stock-item{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}.stock-name{font-size:13px}.stock-num{font-size:23px;font-weight:900;margin-top:5px}
    .toolbar{display:flex;gap:8px;align-items:center}.toolbar button{width:auto;padding:9px 13px}.pill{display:inline-block;background:#ecfeff;color:#0f766e;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}

    @media(max-width:860px){.shop-shell{display:block;padding:10px}.shop-main{width:100%}.sidebar{position:fixed;z-index:50;top:0;right:0;height:100vh;width:min(82vw,290px);border-radius:0 0 0 22px;transform:translateX(110%);transition:transform .2s ease}.sidebar.open{transform:translateX(0)}.mobile-overlay{display:block;position:fixed;z-index:40;inset:0;background:rgba(15,23,42,.48)}.menu-toggle{display:inline-flex;align-items:center;justify-content:center}.metrics-pro{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-title{font-size:23px}.desktop-only{display:none!important}.mobile-only{display:inline-flex}.shop-topbar{position:sticky;top:0;z-index:30;margin:0 -2px 10px;padding:8px 4px;background:rgba(244,247,251,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(226,232,240,.9)}.topbar-logo{width:36px;height:36px}.topbar-copy h1{font-size:20px}.topbar-copy .muted{display:none}.menu-toggle{width:42px!important;height:42px;padding:0!important;border-radius:12px!important;font-size:20px}.topbar-actions{gap:6px}}@media(max-width:620px){.dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.stock{grid-template-columns:1fr}.app{padding:0}.top{align-items:flex-start}.toolbar{flex-wrap:wrap}.worker-row{align-items:flex-start;flex-direction:column}.worker-actions{width:100%}.worker-actions button{flex:1}.setting-line{align-items:stretch;flex-direction:column}.setting-line button{width:100%}.count-row{grid-template-columns:1fr 1fr}.count-name{grid-column:1/-1}.product-row{align-items:stretch;flex-direction:column}.product-row button{width:100%}.section-actions button{flex:1;min-width:130px}.shop-shell{padding:8px}.dash-hero{padding:14px;border-radius:18px;box-shadow:0 10px 24px rgba(15,23,42,.14)}.dash-hero:after{width:130px;height:130px;left:-45px;top:-55px}.hero-top{align-items:center}.hero-eyebrow{font-size:10px;margin-bottom:3px}.hero-title{font-size:20px;line-height:1.2}.hero-sub{display:none}.live-badge{font-size:10px;padding:6px 8px}.metrics-pro   #dashboard,#sale,#inventory,#settings{display:none!important}.shop-shell{display:block;max-width:760px;margin:auto;padding:12px}.shop-main{width:100%}.shop-topbar{position:static;margin-bottom:12px;border-radius:0;background:transparent;box-shadow:none;padding:0}.topbar-logo{background:linear-gradient(135deg,#14b8a6,#0f766e)}.unified-nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding:8px 0 12px;margin-bottom:10px;border-bottom:4px solid #d1d5db}.unified-nav a{flex:0 0 auto;padding:11px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--main);font-weight:800;text-decoration:none}.unified-nav a.active{background:var(--main);color:#fff;border-color:var(--main)}@media(max-width:760px){.shop-shell{padding:8px}.shop-topbar{padding:4px 2px}.topbar-title{width:100%}.menu-toggle{margin-right:auto}.topbar-actions{display:none!important}.content-card{border-radius:18px}.unified-nav{margin-inline:-8px;padding-inline:8px}}.data-mode-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 11px;margin-bottom:12px}.data-mode-bar strong{margin-left:auto}.mode-btn{width:auto!important;padding:9px 14px!important;background:#fff!important;color:var(--main)!important;border:1px solid var(--main)!important}.mode-btn.active{background:var(--main)!important;color:#fff!important}.test-warning{color:#b45309;font-weight:800}@media(min-width:761px){.sidebar,.mobile-overlay{display:none!important}}</style>

<body data-screen="users">
<div id="app" class="app" v-cloak>
  <template v-if="loading"><div class="card">جاري التحقق من جلسة MyTool…</div></template>

  <template v-else-if="!isLoggedIn">
    <section class="card login">
      <a class="back" href="../">← MyTool</a>
      <h1>حساب المحل</h1>
      <p class="muted">يتم تسجيل الدخول من الصفحة الرئيسية لـ MyTool.</p>
    </section>
  </template>

  <template v-else>
    <div class="shop-shell">
      <div id="sharedAdminSidebar"></div>
      <main class="shop-main">
    <div id="sharedAdminTop"></div>

    <section id="dashboard" class="dash-hero content-card">
      <div class="hero-top">
        <div>
          <div class="hero-eyebrow">MYTOOL / SHOP CONTROL</div>
          <h2 class="hero-title">لوحة تحكم المحل</h2>
          <div class="hero-sub">صورة مباشرة للمبيعات والمخزون وحالة المنتجات اليوم.</div>
        </div>
        <span class="live-badge"><span class="live-dot"></span> مباشر</span>
      </div>
      <div class="metrics-pro">
        <div class="metric-pro"><div class="mhead"><span>المنتجات</span><span class="mico">▦</span></div><div class="mvalue">{{ products.length }}</div><div class="msub">منتج مسجل</div></div>
        <div v-if="can('view_stock')" class="metric-pro"><div class="mhead"><span>إجمالي المخزون</span><span class="mico">◫</span></div><div class="mvalue">{{ stockUnits }}</div><div class="msub">وحدة متاحة حسب الحركات</div></div>
        <div v-if="can('view_sales')" class="metric-pro"><div class="mhead"><span>عمليات اليوم</span><span class="mico">↗</span></div><div class="mvalue">{{ todaySalesCount }}</div><div class="msub">عملية بيع مسجلة</div></div>
        <div v-if="can('view_sales')" class="metric-pro"><div class="mhead"><span>مبيعات اليوم</span><span class="mico">دج</span></div><div class="mvalue">{{ money(todayRevenue) }}</div><div class="msub">دينار جزائري</div></div>
      </div>
      <div class="quick-actions">
        <a href="daily.html">☀ التشغيل اليومي</a>
        <a v-if="can('sell')" href="sale.html">＋ بيع جديد</a>
        <a v-if="can('view_stock')" class="mobile-hide" href="#inventory" @click="inventoryTab='stock'">▦ عرض المخزون</a>
        <a v-if="can('inventory')" href="inventory-count.html">✓ جرد فعلي</a>
        <a v-if="userMode==='admin'" href="products.html">◇ المنتجات</a><a v-if="userMode==='admin'" href="users.html">♙ المستخدمون</a><a v-if="userMode==='admin'" href="settings.html">⚙ الإعدادات</a><button class="mobile-hide" @click="loadAll" :disabled="busy">↻ تحديث البيانات</button>
      </div>
      <div v-if="userMode==='admin' && lowStockCount>0" class="alert-card"><span><strong>تنبيه مخزون:</strong> {{ lowStockCount }} منتجات كميتها 2 أو أقل.</span><span>منها {{ outOfStockCount }} نافد</span></div>
    </section>

    <section v-if="can('sell')" id="sale" class="card content-card">
      <div class="section-title"><div><div class="section-kicker">المبيعات</div><h2>بيع جديد آمن</h2></div><span class="pill">حسب المخزن</span></div>
      <p class="muted">البيع يعمل من شاشة التشغيل اليومية حتى تُفحص كمية مخزن العامل قبل الحفظ. المنتج غير المجرود يطلب كميته الحالية أول مرة، والمنتج النافد يبقى ظاهرًا بعلامة نافد ولا يُسمح ببيعه.</p>
      <a class="btn" href="sale.html" style="display:inline-block;text-decoration:none">فتح شاشة البيع</a>
    </section>

    <section v-if="can('view_stock') || can('manage_products') || can('inventory')" id="inventory" class="card content-card">
      <div class="top" style="margin:0 0 12px">
        <div><div class="section-kicker">إدارة المخزون</div><h2 style="margin:0">المنتجات والمخزون</h2><div class="muted">المنتجات منفصلة عن حركة المخزون، والجرد الفعلي يسجل الفرق كتعديل مستقل.</div></div>
        <div class="pill">{{ inventory.length }} سلع</div>
      </div>

      <div class="tabs">
        <button v-if="can('manage_products')" class="tab" :class="{active:inventoryTab==='products'}" @click="inventoryTab='products'">المنتجات</button>
        <button v-if="can('view_stock')" class="tab" :class="{active:inventoryTab==='stock'}" @click="inventoryTab='stock'">المخزون</button>
        <button v-if="can('inventory')" class="tab" :class="{active:inventoryTab==='count'}" @click="openPhysicalCount">الجرد الفعلي</button>
      </div>

      <template v-if="can('view_stock') && inventoryTab==='stock'">
        <div class="stock">
          <div class="stock-item" v-for="item in inventory" :key="item.product_id">
            <div class="stock-name">{{ item.name }}</div><div class="stock-num">{{ item.stock_quantity }}</div>
          </div>
        </div>
      </template>

      <template v-if="can('manage_products') && inventoryTab==='products'">
        <form @submit.prevent="addProduct" class="grid" style="margin-bottom:12px">
          <div><label>اسم المنتج الجديد</label><input v-model.trim="newProductName" required placeholder="مثال: كابل Type-C"></div>
          <div v-if="userMode==='admin'">
            <label>صورة المنتج (اختيارية)</label>
            <input :key="newProductImageKey" type="file" accept="image/jpeg,image/png,image/webp" @change="selectNewProductImage">
            <div v-if="newProductImageName" class="muted" style="margin-top:5px">تم اختيار: {{ newProductImageName }}</div>
          </div>
          <div style="align-self:end"><button class="btn" :disabled="busy">{{ busy ? 'جاري الحفظ…' : 'إضافة منتج' }}</button></div>
        </form>
        <div class="product-list">
          <div class="product-row" v-for="p in products" :key="p.id">
            <div class="product-image-wrap">
              <img v-if="p.image_url" :src="p.image_url" :alt="'صورة '+p.name" loading="lazy">
              <span v-else>بدون صورة</span>

      newProductName.value='';newProductImage.value=null;newProductImageName.value='';newProductImageKey.value++

      if(imageError)return notify('تمت إضافة المنتج، لكن تعذر رفع صورته: '+(imageError?.message||'خطأ غير معروف'),'error')
      notify(selectedImage?'تمت إضافة المنتج وصورته.':'تمت إضافة المنتج.')
    }
    async function renameProduct(product){
      if(!can('manage_products'))return
      const name=(productNames.value[product.id]||'').trim()
      if(!name)return notify('اسم المنتج لا يمكن أن يكون فارغًا.','error')
      if(name===product.name)return notify('الاسم لم يتغير.')
      busy.value=true;message.value=''
      const result=userMode.value==='worker'?await supabase.rpc('worker_rename_product',{p_session_token:workerToken.value,p_product_id:Number(product.id),p_name:name}):await supabase.from('products').update({name}).eq('id',product.id)
      const error=result.error
      busy.value=false
      if(error)return notify('تعذر تعديل اسم المنتج: '+error.message,'error')
      notify('تم تحديث اسم المنتج.')
      await loadAll();inventoryTab.value='products'
    }

    function compressProductImage(file){
      return new Promise((resolve,reject)=>{
        if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type))return reject(new Error('اختر صورة JPG أو PNG أو WEBP.'))
        if(file.size>8*1024*1024)return reject(new Error('الصورة الأصلية أكبر من 8MB.'))
        const reader=new FileReader()
        reader.onerror=()=>reject(new Error('تعذر قراءة الصورة.'))
        reader.onload=()=>{
          const image=new Image()
          image.onerror=()=>reject(new Error('ملف الصورة غير صالح.'))
          image.onload=()=>{
            const maxSide=1200,scale=Math.min(1,maxSide/Math.max(image.width,image.height))
            const width=Math.max(1,Math.round(image.width*scale)),height=Math.max(1,Math.round(image.height*scale))
            const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height
            canvas.getContext('2d').drawImage(image,0,0,width,height)
            canvas.toBlob(blob=>{
              if(!blob)return reject(new Error('تعذر ضغط الصورة.'))
              if(blob.size>1500000)return reject(new Error('الصورة ما زالت كبيرة بعد الضغط. جرّب صورة أوضح وأصغر.'))
              const outputReader=new FileReader()
              outputReader.onerror=()=>reject(new Error('تعذر تجهيز الصورة.'))
              outputReader.onload=()=>resolve({mimeType:'image/webp',contentBase64:String(outputReader.result).split(',')[1]||''})
              outputReader.readAsDataURL(blob)
            },'image/webp',.82)
          }
          image.src=String(reader.result)
        }
        reader.readAsDataURL(file)
      })
    }

    async function sendProductImage(file,product){
      const prepared=await compressProductImage(file)
      const {data,error}=await supabase.functions.invoke('upload-product-image',{body:{productId:Number(product.id),...prepared}})
      if(error)throw error
      if(!data?.imageUrl)throw new Error('لم يرجع الخادم رابط الصورة.')
      return data
    }

    async function uploadProductImage(event,product){
      const input=event.target,file=input.files?.[0];input.value=''
      if(userMode.value!=='admin'||!file)return
      imageUploading.value={...imageUploading.value,[product.id]:true};message.value=''
      try{
        const data=await sendProductImage(file,product)
        products.value=products.value.map(p=>p.id===product.id?{...p,image_url:data.imageUrl}:p)
        await loadAll();inventoryTab.value='products'
        notify('تم رفع صورة المنتج وحفظ رابطها.')
      }catch(error){
        notify('تعذر رفع الصورة: '+(error?.message||'خطأ غير معروف'),'error')
      }finally{
        const next={...imageUploading.value};delete next[product.id];imageUploading.value=next
      }
    }
    async function restoreProductImage(image){
      if(userMode.value!=='admin'||image.is_current)return
      busy.value=true;message.value=''
      const {error}=await supabase.rpc('admin_restore_product_image',{p_upload_id:Number(image.id)})
      busy.value=false
      if(error)return notify('تعذر استرجاع الصورة: '+error.message,'error')
      await loadAll();inventoryTab.value='products'
      notify('تم استرجاع الصورة السابقة.')
    }

    async function findAdjustmentColumn(candidates){
      for(const column of candidates){
        const {error}=await supabase.from('stock_adjustments').select(column).limit(1)
        if(!error)return column
      }
      return null
    }

    async function applyPhysicalCount(){
      if(!can('inventory'))return
      physicalResult.value=''
      const rows=countedItems.value
      if(!rows.length)return notify('أدخل عددًا حقيقيًا لسلعة واحدة على الأقل.','error')
      for(const item of rows){
        const actual=Number(physicalCounts.value[item.product_id])
        if(!Number.isInteger(actual)||actual<0)return notify('العدد الحقيقي لـ '+item.name+' غير صحيح.','error')
      }
      const changed=rows.filter(item=>difference(item)!==0)
      if(!changed.length){physicalResult.value='الجرد مطابق للمخزون المسجل، لا توجد فروق للحفظ.';physicalResultType.value='ok';resetPhysicalCount();return}
      const reason=(physicalReason.value||'').trim()
      if(!reason)return notify('اكتب سبب الجرد قبل التأكيد.','error')
      if(!confirm(userMode.value==='worker'?'تأكيد العدد الفعلي؟ الزيادة تطبق مباشرة والنقص يرسل للإدارة.':'سيتم تسجيل '+changed.length+' تعديل مخزون. متابعة؟'))return

      busy.value=true;message.value=''
      let error=null,resultData=null
      if(userMode.value==='worker'){
        const counts=changed.map(item=>({product_id:Number(item.product_id),actual_quantity:Number(physicalCounts.value[item.product_id])}))
        const result=await supabase.rpc('worker_record_branch_inventory_batch',{p_session_token:workerToken.value,p_counts:counts,p_reason:reason,p_branch_id:null})
        error=result.error;resultData=result.data
      }else{
        const qtyColumn=await findAdjustmentColumn(['quantity','quantity_change','quantity_delta','adjustment_quantity','adjustment','delta','change_quantity'])
        const reasonColumn=await findAdjustmentColumn(['reason','notes','note','description'])
        if(!qtyColumn||!reasonColumn){busy.value=false;return notify('تعذر التعرف على بنية جدول stock_adjustments. أرسل الخطأ للمطور قبل تسجيل الجرد.','error')}
        const adjustments=changed.map(item=>{const payload={product_id:Number(item.product_id)};payload[qtyColumn]=difference(item);payload[reasonColumn]=reason;return payload})
        const result=await supabase.from('stock_adjustments').insert(adjustments);error=result.error
      }
      busy.value=false
      if(error){physicalResult.value='لم يتم حفظ الجرد: '+error.message;physicalResultType.value='error';return notify(physicalResult.value,'error')}
      if(userMode.value==='worker'){
        const pending=Number(resultData?.pending_count||0),applied=Number(resultData?.applied_count||0)
        physicalResult.value=pending
          ?'تم إرسال '+pending+' فرق نقص إلى الإدارة دون تغيير المخزون'+(applied?'، وتم تطبيق '+applied+' زيادة أو مطابقة.':'.')
          :'تم تسجيل الجرد وتطبيق الزيادة أو المطابقة بنجاح.'
      }else physicalResult.value='تم تسجيل فروق الجرد بنجاح.'
      physicalResultType.value='ok'
      resetPhysicalCount();await loadAll();inventoryTab.value='count'
      setTimeout(()=>document.getElementById('inventory')?.scrollIntoView({behavior:'smooth',block:'start'}),50)
    }

    async function createWorker(){
      if(userMode.value!=='admin')return
      const payload={username:workerForm.value.username,nickname:workerForm.value.nickname,phone:workerForm.value.phone||null,password:workerForm.value.password,staff_id:Number(workerForm.value.staff_id),is_test:!!workerForm.value.is_test,can_sell:!!workerForm.value.can_sell,can_view_stock:!!workerForm.value.can_view_stock,can_inventory:!!workerForm.value.can_inventory,can_manage_products:!!workerForm.value.can_manage_products,can_view_sales:!!workerForm.value.can_view_sales}
      busy.value=true;message.value=''
      const {error}=await supabase.from('worker_accounts').insert(payload)
      busy.value=false
      if(error)return notify('لم تتم إضافة المستخدم: '+error.message,'error')
      workerForm.value={username:'',nickname:'',phone:'',password:'',staff_id:'',is_test:false,can_sell:true,can_view_stock:true,can_inventory:false,can_manage_products:false,can_view_sales:false}
      notify('تمت إضافة المستخدم بنجاح.')
      await loadAll()
    }

    async function saveWorkerPermissions(w){
      if(userMode.value!=='admin')return
      busy.value=true;message.value=''
      const payload={is_test:!!w.is_test,can_sell:!!w.can_sell,can_view_stock:!!w.can_view_stock,can_inventory:!!w.can_inventory,can_manage_products:!!w.can_manage_products,can_view_sales:!!w.can_view_sales}
      const {error}=await supabase.from('worker_accounts').update(payload).eq('id',w.id)
      busy.value=false
      if(error)return notify('تعذر حفظ الصلاحيات: '+error.message,'error')
      notify('تم حفظ صلاحيات '+(w.nickname||w.username)+'.')
      await loadAll()
    }

    async function toggleWorker(w){
      if(userMode.value!=='admin')return
      busy.value=true;message.value=''
      const {error}=await supabase.from('worker_accounts').update({active:!w.active}).eq('id',w.id)
      busy.value=false
      if(error)return notify('تعذر تحديث الحساب: '+error.message,'error')
      notify(w.active?'تم إيقاف الحساب.':'تم تفعيل الحساب.')
      await loadAll()
    }

    async function deleteWorker(w){
      if(userMode.value!=='admin'||!confirm('حذف حساب '+(w.nickname||w.username)+'؟'))return
      busy.value=true;message.value=''
      const {error}=await supabase.from('worker_accounts').delete().eq('id',w.id)
      busy.value=false
      if(error)return notify('تعذر حذف الحساب: '+error.message,'error')
      notify('تم حذف الحساب.')
      await loadAll()
    }

    function setAdminDataMode(mode){const next=mode==='test'?'test':'real';if(adminDataMode.value===next)return;adminDataMode.value=next;localStorage.setItem(ADMIN_DATA_MODE_KEY,next);window.location.reload()}
    function saveAdminSessionHours(){
      adminSessionHours.value=clampHours(adminSessionHours.value)
      localStorage.setItem(ADMIN_SESSION_HOURS_KEY,String(adminSessionHours.value))
      if(userMode.value==='admin')setAdminExpiry()
      notify('تم حفظ مدة جلسة الإدارة: '+adminSessionHours.value+' ساعة.')
    }

    onMounted(async()=>{
      if(!storedWorkerToken)clearWorkerSession()
      const {data}=await supabase.auth.getSession();session.value=data.session
      if(session.value){
        clearWorkerSession()
        const expires=Number(localStorage.getItem(ADMIN_EXPIRES_KEY)||0)
        if(expires&&Date.now()>=expires){await supabase.auth.signOut();session.value=null;clearAdminExpiry()}
        else if(!expires)setAdminExpiry()
      }
      loading.value=false
      if(!isLoggedIn.value){window.location.replace('../');return}
      if(userMode.value==='worker'){window.location.replace('daily.html');return}
      await loadAll()
      supabase.auth.onAuthStateChange((_event,newSession)=>{session.value=newSession;if(newSession)clearWorkerSession()})
      setInterval(enforceTimeout,30000)
    })

    return{session,loading,busy,loginMode,email,password,workerUsername,workerPassword,workerNickname,workerPermissions,message,messageType,staff,products,inventory,adminWorkers,todaySales,sale,workerForm,adminSessionHours,adminDataMode,inventoryTab,sidebarOpen,newProductName,newProductImage,newProductImageName,newProductImageKey,productNames,imageUploading,imageHistory,physicalCounts,physicalReason,physicalResult,physicalResultType,userMode,isLoggedIn,stockUnits,lowStockCount,outOfStockCount,todaySalesCount,todayRevenue,countedItems,totalCountDifference,money,signed,difference,can,setLoginMode,adminLogin,workerLogin,logout,loadAll,saveSale,openPhysicalCount,resetPhysicalCount,selectNewProductImage,addProduct,renameProduct,uploadProductImage,restoreProductImage,applyPhysicalCount,createWorker,saveWorkerPermissions,toggleWorker,deleteWorker,setAdminDataMode,saveAdminSessionHours}
  }}).mount('#app')
</script>
