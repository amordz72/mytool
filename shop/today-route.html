<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>جولة اليوم — MyTool</title>
<link rel="stylesheet" href="shop-common.css?v=20260917">
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--main:#0f766e;--ok:#047857;--warn:#b45309;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}.wrap{max-width:860px;margin:auto;padding:12px 12px 100px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}.hero{background:linear-gradient(135deg,#0f172a,#134e4a);color:#fff}.hero h1{margin:0 0 5px;font-size:23px}.hero p{margin:0;color:#cbd5e1;font-size:12px}.status{padding:10px 12px;border-radius:12px;margin-bottom:10px;font-size:13px}.status.info{background:#eff6ff;color:#1d4ed8}.status.ok{background:#ecfdf5;color:#047857}.status.err{background:#fff1f2;color:#b91c1c}textarea,select,input,button{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}textarea{min-height:125px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.btn{border:0;background:var(--main);color:#fff;font-weight:900;cursor:pointer}.btn.secondary{background:#fff;color:var(--main);border:1px solid var(--main)}.btn.danger{background:#fff;color:var(--danger);border:1px solid #fecaca}.items{display:grid;gap:8px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.item.done{opacity:.72}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.name{font-weight:900;font-size:16px}.meta{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}.note{margin-top:8px;padding:8px 10px;border-radius:10px;background:#f8fafc;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{width:auto;min-width:95px}.pending{color:var(--warn)}.done-label{color:var(--ok)}.unavailable{color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:28px}.counter{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.pill{background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}.money div{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:9px}.money small{display:block;color:var(--muted);font-size:11px}.money b{font-size:17px}.collect{margin-top:10px;padding:10px;border:1px dashed #cbd5e1;border-radius:12px;background:#fff}.collect-grid{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:end}.collect-grid button{width:auto;min-width:120px}.admin-expected{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:end;margin-top:10px}.admin-expected button{width:auto}.warnbox{margin-top:9px;padding:9px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:12px}.hint{font-size:11px;color:#6b7280;margin-top:5px;line-height:1.5}@media(max-width:620px){.grid,.money,.collect-grid,.admin-expected{grid-template-columns:1fr}.wrap{padding:8px 8px 95px}.actions button,.collect-grid button,.admin-expected button{width:100%}.hero{border-radius:16px}}
</style>
<script src="shop-routes.js?v=20260917"></script><script src="shop-shell.js?v=20260917"></script>
</head>
<body data-screen="today-route"><div class="wrap">
<div id="sharedOperationTop"></div><script>ShopShell.mountOperationTop('sharedOperationTop')</script>
<section class="hero"><h1>جولة اليوم</h1><p id="subtitle">المحلات المطلوبة اليوم مع المتوقع والمستلم والباقي.</p></section>
<div id="status" class="status info">جاري التحميل…</div>
<section id="adminAdd" class="card" hidden>
  <div class="grid"><div class="field"><label>العامل</label><select id="worker"></select></div><div class="field"><label>اليوم</label><input id="day" type="date"></div></div>
  <div class="field" style="margin-top:9px"><label>ألصق قائمة المحلات</label><textarea id="lines" placeholder="محل الأمل | 50000 | بعد العصر&#10;محل السلام | 30000&#10;كشك محمد | اتصل به قبل الذهاب"></textarea><div class="hint">الصيغة الذكية: الاسم | المبلغ المتوقع | ملاحظة. إذا الخانة الثانية ليست رقمًا تُعتبر ملاحظة مثل الطريقة القديمة.</div></div>
  <div style="margin-top:8px"><button id="addBtn" class="btn">إضافة للجولة</button></div>
</section>
<div class="counter"><span class="pill">الكل: <b id="allCount">0</b></span><span class="pill">باقي زيارات: <b id="pendingCount">0</b></span><span class="pill">تمت: <b id="doneCount">0</b></span><span class="pill">متوقع: <b id="expectedSum">0</b></span><span class="pill">مستلم: <b id="receivedSum">0</b></span><span class="pill">باقي مال: <b id="remainingSum">0</b></span></div>
<div id="items" class="items"></div>
</div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const s=createClient('https://wqyebqzbbpohbnznqdjj.supabase.co','sb_publishable_gO4umNBMJ0AWRk19HtKd7A_9X4DibYj');
const TOKEN='mytool_shop_worker_token',$=id=>document.getElementById(id),money=v=>new Intl.NumberFormat('ar-DZ',{maximumFractionDigits:2}).format(Number(v||0))+' دج';let token='',me=null,rows=[];
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);$('day').value=today();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stat(t,k='info'){$('status').textContent=t;$('status').className='status '+k}
function label(v){return v==='done'?'تمت الزيارة':v==='unavailable'?'تعذر':'لم أزر بعد'}function cls(v){return v==='done'?'done-label':v==='unavailable'?'unavailable':'pending'}
async function identify(){token=localStorage.getItem(TOKEN)||'';if(!token)throw new Error('NO_SESSION');const r=await s.rpc('workspace_session_status',{p_session_token:token});if(r.error||!r.data?.length)throw new Error('NO_SESSION');me=r.data[0];if(me.pin_required)throw new Error('PIN_REQUIRED');const isAdmin=me.account_role==='workspace_admin';$('subtitle').textContent=isAdmin?'أنشئ جولة العامل وحدد المتوقع، ثم راقب ما استلمه والباقي.':'المحلات المطلوبة منك اليوم؛ سجل الاستلام من نفس بطاقة المحل عندما يكون الحساب مربوطًا.';ShopShell.mountRoleNavigation({role:isAdmin?'admin':'worker',permissions:{can_record_money:true}},'today-route');document.querySelectorAll('.shell-identity').forEach(el=>el.textContent=(me.nickname||'PRELAUNCH')+' — قبل الانطلاق')}
async function loadWorkers(){if(me.account_role!=='workspace_admin')return;const r=await s.rpc('workspace_visit_workers',{p_session_token:token});if(r.error)throw r.error;$('worker').innerHTML=(r.data||[]).map(x=>`<option value="${x.worker_id}">${esc(x.nickname)}</option>`).join('');$('adminAdd').hidden=false}
async function load(){stat('جاري تحميل الجولة…');const r=await s.rpc('workspace_visit_list_v2',{p_session_token:token,p_visit_date:$('day').value||today()});if(r.error)throw r.error;rows=Array.isArray(r.data)?r.data:[];render();stat(rows.length?'الجولة والمبالغ محدثة.':'لا توجد محلات مضافة لهذا اليوم.','ok')}
function moneyBlock(x){const expected=x.expected_amount==null?'غير محدد':money(x.expected_amount),received=money(x.received_amount),remaining=x.expected_amount==null?'—':money(x.remaining_amount),extra=Number(x.extra_amount||0);return `<div class="money"><div><small>المتوقع</small><b>${expected}</b></div><div><small>المستلم</small><b>${received}</b></div><div><small>${extra>0?'زيادة':'الباقي'}</small><b>${extra>0?money(extra):remaining}</b></div></div>`}
function workerCollect(x){if(me.account_role!=='worker')return'';if(!x.party_id)return'<div class="warnbox">هذا الاسم غير مربوط بحساب مؤكد في دليل العملاء. سجّل من صفحة «استلام أموال» أو صحح الاسم أولًا.</div>';const suggested=x.expected_amount!=null&&Number(x.remaining_amount)>0?Number(x.remaining_amount):'';return `<div class="collect"><b>تسجيل استلام من ${esc(x.party_name||x.shop_name)}</b><div class="collect-grid"><div class="field"><label>المبلغ المستلم</label><input data-collect-amount="${x.id}" type="number" min="0.01" step="0.01" inputmode="decimal" value="${suggested}"></div><button class="btn" data-collect="${x.id}" type="button">سجل الاستلام</button></div></div>`}
function adminExpected(x){if(me.account_role!=='workspace_admin')return'';return `<div class="admin-expected"><div class="field"><label>تعديل المتوقع</label><input data-expected="${x.id}" type="number" min="0" step="0.01" value="${x.expected_amount==null?'':Number(x.expected_amount)}" placeholder="غير محدد"></div><button class="btn secondary" data-save-expected="${x.id}" type="button">حفظ المتوقع</button></div>`}
function render(){const root=$('items');$('allCount').textContent=rows.length;$('pendingCount').textContent=rows.filter(x=>x.status==='pending').length;$('doneCount').textContent=rows.filter(x=>x.status==='done').length;$('expectedSum').textContent=money(rows.reduce((n,x)=>n+Number(x.expected_amount||0),0));$('receivedSum').textContent=money(rows.reduce((n,x)=>n+Number(x.received_amount||0),0));$('remainingSum').textContent=money(rows.reduce((n,x)=>n+Number(x.remaining_amount||0),0));if(!rows.length){root.innerHTML='<div class="card empty">لا توجد محلات في الجولة.</div>';return}root.innerHTML=rows.map((x,i)=>`<section class="item ${x.status==='done'?'done':''}" data-id="${x.id}"><div class="head"><div><div class="name">${i+1}. ${esc(x.shop_name)}</div><div class="meta">${me.account_role==='workspace_admin'&&x.assigned_name?esc(x.assigned_name)+' · ':''}<span class="${cls(x.status)}">${label(x.status)}</span>${x.party_name?' · مربوط: '+esc(x.party_name):''}</div></div></div>${x.notes?`<div class="note">${esc(x.notes)}</div>`:''}${moneyBlock(x)}${adminExpected(x)}${workerCollect(x)}<div class="actions"><button class="btn" data-s="done">تمت الزيارة</button><button class="btn secondary" data-s="unavailable">تعذر</button>${x.status!=='pending'?'<button class="btn secondary" data-s="pending">إرجاع</button>':''}${me.account_role==='workspace_admin'?'<button class="btn danger" data-del>حذف</button>':''}</div></section>`).join('');root.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>setStatus(Number(b.closest('[data-id]').dataset.id),b.dataset.s));root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(Number(b.closest('[data-id]').dataset.id)));root.querySelectorAll('[data-save-expected]').forEach(b=>b.onclick=()=>saveExpected(Number(b.dataset.saveExpected)));root.querySelectorAll('[data-collect]').forEach(b=>b.onclick=()=>collect(Number(b.dataset.collect)))}
async function saveExpected(id){const input=document.querySelector('[data-expected="'+id+'"]'),raw=input?.value.trim()||'',amount=raw===''?null:Number(raw);if(amount!==null&&(!Number.isFinite(amount)||amount<0))return stat('راجع المبلغ المتوقع.','err');stat('جاري حفظ المتوقع…');const r=await s.rpc('workspace_admin_set_visit_expected',{p_session_token:token,p_task_id:id,p_expected_amount:amount});if(r.error)return stat('تعذر حفظ المتوقع: '+r.error.message,'err');await load()}
async function collect(id){const input=document.querySelector('[data-collect-amount="'+id+'"]'),amount=Number(input?.value);if(!Number.isFinite(amount)||amount<=0)return stat('راجع المبلغ المستلم.','err');if(!confirm('تسجيل استلام '+money(amount)+'؟'))return;stat('جاري تسجيل الاستلام…');const r=await s.rpc('worker_create_visit_cash_receipt',{p_session_token:token,p_task_id:id,p_amount:amount,p_notes:'من جولة اليوم'});if(r.error)return stat('تعذر تسجيل الاستلام: '+r.error.message,'err');await load();stat('تم تسجيل الاستلام وأضيف إلى أموال العامل.','ok')}
async function setStatus(id,status){stat('جاري التحديث…');const r=await s.rpc('workspace_visit_set_status',{p_session_token:token,p_task_id:id,p_status:status});if(r.error)return stat('تعذر التحديث: '+r.error.message,'err');await load()}
async function del(id){if(!confirm('حذف المحل من الجولة؟'))return;const r=await s.rpc('workspace_admin_delete_visit_task',{p_session_token:token,p_task_id:id});if(r.error)return stat('تعذر الحذف: '+r.error.message,'err');await load()}
$('addBtn').onclick=async()=>{const lines=$('lines').value.trim();if(!lines)return stat('ألصق أسماء المحلات أولًا.','err');const worker=Number($('worker').value||0);stat('جاري إضافة الجولة…');const r=await s.rpc('workspace_admin_add_visit_tasks_v2',{p_session_token:token,p_lines:lines,p_visit_date:$('day').value||today(),p_assigned_worker_id:worker||null});if(r.error)return stat('تعذر الإضافة: '+r.error.message,'err');$('lines').value='';await load();stat('تمت إضافة '+r.data+' محل/محلات للجولة.','ok')};$('day').onchange=load;
(async()=>{try{await identify();await loadWorkers();await load()}catch(e){if(e.message==='PIN_REQUIRED')stat('افتح MyTool وأدخل PIN اليومي أولًا.','err');else{stat('انتهت الجلسة أو لا توجد صلاحية.','err');setTimeout(()=>location.replace('../'),1200)}}})();
</script>
</body></html>
