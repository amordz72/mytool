<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>جولة اليوم — MyTool</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--main:#0f766e;--ok:#047857;--warn:#b45309;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}.wrap{max-width:820px;margin:auto;padding:12px 12px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.top a{text-decoration:none;color:var(--main);font-weight:800}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}.hero{background:linear-gradient(135deg,#0f172a,#134e4a);color:#fff}.hero h1{margin:0 0 5px;font-size:23px}.hero p{margin:0;color:#cbd5e1;font-size:12px}.status{padding:10px 12px;border-radius:12px;margin-bottom:10px;font-size:13px}.status.info{background:#eff6ff;color:#1d4ed8}.status.ok{background:#ecfdf5;color:#047857}.status.err{background:#fff1f2;color:#b91c1c}textarea,select,input,button{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}textarea{min-height:125px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.btn{border:0;background:var(--main);color:#fff;font-weight:900;cursor:pointer}.btn.secondary{background:#fff;color:var(--main);border:1px solid var(--main)}.btn.danger{background:#fff;color:var(--danger);border:1px solid #fecaca}.items{display:grid;gap:8px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.item.done{opacity:.68}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.name{font-weight:900;font-size:16px}.meta{font-size:11px;color:var(--muted);margin-top:3px}.note{margin-top:8px;padding:8px 10px;border-radius:10px;background:#f8fafc;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{width:auto;min-width:95px}.pending{color:var(--warn)}.done-label{color:var(--ok)}.unavailable{color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:28px}.counter{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.pill{background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}@media(max-width:620px){.grid{grid-template-columns:1fr}.wrap{padding:8px 8px 95px}.actions button{flex:1}.hero{border-radius:16px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><a href="./">← الرئيسية</a><a href="../">MyTool</a></div>
<section class="hero"><h1>جولة اليوم</h1><p id="subtitle">قائمة المحلات بدل واتساب — اسم المحل والملاحظة فقط.</p></section>
<div id="status" class="status info">جاري التحميل…</div>
<section id="adminAdd" class="card" hidden>
  <div class="grid">
    <div class="field"><label>العامل</label><select id="worker"></select></div>
    <div class="field"><label>اليوم</label><input id="day" type="date"></div>
  </div>
  <div class="field" style="margin-top:9px"><label>ألصق قائمة المحلات</label><textarea id="lines" placeholder="محل الأمل&#10;محل السلام | اتصل به قبل الذهاب&#10;كشك محمد | بعد العصر"></textarea></div>
  <div style="margin-top:8px"><button id="addBtn" class="btn">إضافة للجولة</button></div>
</section>
<div class="counter"><span class="pill">الكل: <b id="allCount">0</b></span><span class="pill">باقي: <b id="pendingCount">0</b></span><span class="pill">تم: <b id="doneCount">0</b></span></div>
<div id="items" class="items"></div>
</div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const s=createClient('https://wqyebqzbbpohbnznqdjj.supabase.co','sb_publishable_gO4umNBMJ0AWRk19HtKd7A_9X4DibYj');
const TOKEN='mytool_shop_worker_token';const $=id=>document.getElementById(id);let token='',me=null,rows=[];
const today=()=>new Date().toISOString().slice(0,10);$('day').value=today();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stat(t,k='info'){$('status').textContent=t;$('status').className='status '+k}
function label(s){return s==='done'?'تمت الزيارة':s==='unavailable'?'تعذر':'لم أزر بعد'}
function cls(s){return s==='done'?'done-label':s==='unavailable'?'unavailable':'pending'}
async function identify(){token=localStorage.getItem(TOKEN)||'';if(!token)throw new Error('NO_SESSION');const r=await s.rpc('workspace_session_status',{p_session_token:token});if(r.error||!r.data?.length)throw new Error('NO_SESSION');me=r.data[0];if(me.pin_required)throw new Error('PIN_REQUIRED');$('subtitle').textContent=me.account_role==='workspace_admin'?'أنشئ جولة كمال وعدلها مباشرة من هنا.':'المحلات المطلوبة منك اليوم.';return true}
async function loadWorkers(){if(me.account_role!=='workspace_admin')return;const r=await s.rpc('workspace_visit_workers',{p_session_token:token});if(r.error)throw r.error;const list=r.data||[];$('worker').innerHTML=list.map(x=>`<option value="${x.worker_id}">${esc(x.nickname)}</option>`).join('');$('adminAdd').hidden=false}
async function load(){stat('جاري تحميل الجولة…');const r=await s.rpc('workspace_visit_list',{p_session_token:token,p_visit_date:$('day').value||today()});if(r.error)throw r.error;rows=r.data||[];render();stat(rows.length?'الجولة محدثة.':'لا توجد محلات مضافة لهذا اليوم.','ok')}
function render(){const root=$('items');$('allCount').textContent=rows.length;$('pendingCount').textContent=rows.filter(x=>x.status==='pending').length;$('doneCount').textContent=rows.filter(x=>x.status==='done').length;if(!rows.length){root.innerHTML='<div class="card empty">لا توجد محلات في الجولة.</div>';return}root.innerHTML=rows.map((x,i)=>`<section class="item ${x.status==='done'?'done':''}" data-id="${x.id}"><div class="head"><div><div class="name">${i+1}. ${esc(x.shop_name)}</div><div class="meta">${me.account_role==='workspace_admin'&&x.assigned_name?esc(x.assigned_name)+' · ':''}<span class="${cls(x.status)}">${label(x.status)}</span></div></div></div>${x.notes?`<div class="note">${esc(x.notes)}</div>`:''}<div class="actions"><button class="btn" data-s="done">تمت الزيارة</button><button class="btn secondary" data-s="unavailable">تعذر</button>${x.status!=='pending'?'<button class="btn secondary" data-s="pending">إرجاع</button>':''}${me.account_role==='workspace_admin'?'<button class="btn danger" data-del>حذف</button>':''}</div></section>`).join('');root.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>setStatus(Number(b.closest('[data-id]').dataset.id),b.dataset.s));root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(Number(b.closest('[data-id]').dataset.id)))}
async function setStatus(id,status){stat('جاري التحديث…');const r=await s.rpc('workspace_visit_set_status',{p_session_token:token,p_task_id:id,p_status:status});if(r.error){stat('تعذر التحديث: '+r.error.message,'err');return}await load()}
async function del(id){const r=await s.rpc('workspace_admin_delete_visit_task',{p_session_token:token,p_task_id:id});if(r.error){stat('تعذر الحذف: '+r.error.message,'err');return}await load()}
$('addBtn').onclick=async()=>{const lines=$('lines').value.trim();if(!lines){stat('ألصق أسماء المحلات أولًا.','err');return}const worker=Number($('worker').value||0);stat('جاري إضافة الجولة…');const r=await s.rpc('workspace_admin_add_visit_tasks',{p_session_token:token,p_lines:lines,p_visit_date:$('day').value||today(),p_assigned_worker_id:worker||null});if(r.error){stat('تعذر الإضافة: '+r.error.message,'err');return}$('lines').value='';await load()};
$('day').onchange=load;
(async()=>{try{await identify();await loadWorkers();await load()}catch(e){if(e.message==='PIN_REQUIRED')stat('افتح MyTool وأدخل PIN اليومي أولًا.','err');else{stat('انتهت الجلسة أو لا توجد صلاحية.','err');setTimeout(()=>location.replace('../'),1200)}}})();
</script>
</body></html>
