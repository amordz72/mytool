<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>حسابات وضع الاستمرارية — MyTool</title>
<link rel="stylesheet" href="shop-common.css?v=20260917">
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--main:#0f766e;--danger:#b91c1c;--ok:#047857}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}.wrap{max-width:920px;margin:auto;padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#0f172a,#134e4a);color:#fff}.hero h1{margin:0 0 6px;font-size:22px}.hero p{margin:0;color:#cbd5e1;font-size:13px;line-height:1.6}.status{padding:10px 12px;border-radius:12px;margin-bottom:12px;font-size:13px}.status.info{background:#eff6ff;color:#1d4ed8}.status.ok{background:#ecfdf5;color:#047857}.status.err{background:#fff1f2;color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}input,select,button{width:100%;font:inherit;padding:11px;border-radius:11px;border:1px solid var(--line);background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{width:auto;min-width:130px}.btn{border:0;background:var(--main);color:#fff;font-weight:800}.btn.secondary{background:#fff;color:var(--main);border:1px solid var(--main)}.btn.danger{background:#fff;color:var(--danger);border:1px solid #fecaca}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#ecfeff;color:#0f766e;font-size:11px;font-weight:800}.muted{color:var(--muted);font-size:12px}.empty{text-align:center;color:var(--muted);padding:24px}.check{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:13px;font-weight:800}.check input{width:auto}.pin-note{margin-top:8px;padding:9px;border-radius:10px;background:#fffbeb;color:#92400e;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.actions button{flex:1}.wrap{padding:9px}}
</style>
<script src="shop-routes.js?v=20260917"></script><script src="shop-shell.js?v=20260917"></script>
</head>
<body data-screen="prelaunch-accounts"><div class="wrap">
<div id="sharedOperationTop"></div><script>ShopShell.mountOperationTop('sharedOperationTop')</script>
<section class="hero"><h1>حسابات وضع الاستمرارية</h1><p>إدارة حسابات وضع الاستمرارية فقط. حساب المالك وبيانات النظام الرئيسي لا تتغير من هذه الصفحة.</p></section>
<div id="status" class="status info">جاري التحقق من الجلسة…</div>
<div id="list"></div>
</div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const s=createClient('https://wqyebqzbbpohbnznqdjj.supabase.co','sb_publishable_gO4umNBMJ0AWRk19HtKd7A_9X4DibYj');
const TOKEN='mytool_shop_worker_token', ADMIN_EXP='mytool_admin_expires_at';
const $=id=>document.getElementById(id);let mode='none',token='',rows=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stat(t,k='info'){$('status').textContent=t;$('status').className='status '+k}
function roleLabel(r){return r==='workspace_admin'?'مدير · وضع الاستمرارية':'عامل · وضع الاستمرارية'}
async function identify(){
  const {data}=await s.auth.getSession();const exp=Number(localStorage.getItem(ADMIN_EXP)||0);
  if(data.session&&exp>Date.now()){mode='developer';ShopShell.mountRoleNavigation({role:'admin',permissions:{}},'prelaunch-accounts');return true}
  token=localStorage.getItem(TOKEN)||'';if(!token)return false;
  const r=await s.rpc('workspace_session_status',{p_session_token:token});
  if(r.error||!r.data?.length)return false;
  const x=r.data[0];if(x.account_role!=='workspace_admin')throw new Error('PERMISSION_DENIED');if(x.pin_required)throw new Error('PIN_REQUIRED');mode='workspace';ShopShell.mountRoleNavigation({role:'admin',permissions:{}},'prelaunch-accounts');return true
}
async function load(){
  stat('جاري تحميل الحسابات…');
  if(mode==='developer'){
    const r=await s.rpc('admin_prelaunch_list_accounts');if(r.error)throw r.error;rows=r.data||[];
  }else{
    const r=await s.rpc('workspace_admin_list_accounts',{p_session_token:token});if(r.error)throw r.error;rows=r.data||[];
  }
  render();stat('وضع الاستمرارية مستقل عن بيانات النظام الرئيسي.','ok');
}
function render(){const root=$('list');if(!rows.length){root.innerHTML='<div class="card empty">لا توجد حسابات في وضع الاستمرارية.</div>';return}
root.innerHTML=rows.map(x=>`<section class="card" data-id="${x.id}"><div class="head"><div><strong>${esc(x.nickname||x.username)}</strong><div class="muted">${esc(x.username)}</div></div><span class="badge">${roleLabel(x.account_role)}</span></div>
<div class="grid" style="margin-top:12px"><div class="field"><label>اسم المستخدم</label><input data-f="username" value="${esc(x.username)}"></div><div class="field"><label>الاسم الظاهر</label><input data-f="nickname" value="${esc(x.nickname||'')}"></div><div class="field"><label>نوع الحساب</label><select data-f="account_role"><option value="workspace_admin" ${x.account_role==='workspace_admin'?'selected':''}>مدير · وضع الاستمرارية</option><option value="worker" ${x.account_role==='worker'?'selected':''}>عامل · وضع الاستمرارية</option></select></div><div class="field"><label>كلمة مرور جديدة</label><input data-f="password" type="password" autocomplete="new-password" placeholder="اتركها فارغة بدون تغيير"></div><div class="field"><label>PIN يومي جديد</label><input data-f="pin" type="password" inputmode="numeric" maxlength="8" placeholder="4 إلى 8 أرقام"></div></div>
<label class="check"><input data-f="active" type="checkbox" ${x.active?'checked':''}> الحساب مفعّل</label><div class="pin-note">PIN الحالي: ${x.pin_set?'مضبوط':'غير مضبوط'}. لا يتم عرض كلمة المرور أو PIN القديم.</div>
<div class="actions"><button class="btn" data-save>حفظ التعديلات</button><button class="btn secondary" data-clear-pin>إزالة PIN</button></div></section>`).join('');
root.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.closest('[data-id]'),false));root.querySelectorAll('[data-clear-pin]').forEach(b=>b.onclick=()=>save(b.closest('[data-id]'),true));}
async function save(card,clearPin){const id=Number(card.dataset.id),patch={};for(const f of ['username','nickname','account_role'])patch[f]=card.querySelector(`[data-f="${f}"]`).value.trim();patch.active=card.querySelector('[data-f="active"]').checked;const pw=card.querySelector('[data-f="password"]').value,pin=card.querySelector('[data-f="pin"]').value;if(pw)patch.password=pw;if(clearPin)patch.pin='';else if(pin)patch.pin=pin;
  stat('جاري الحفظ…');let r;if(mode==='developer')r=await s.rpc('admin_prelaunch_update_account',{p_account_id:id,p_patch:patch});else r=await s.rpc('workspace_admin_update_account',{p_session_token:token,p_account_id:id,p_patch:patch});if(r.error){stat('تعذر الحفظ: '+r.error.message,'err');return}stat('تم الحفظ.','ok');await load();}
(async()=>{try{if(!await identify()){stat('يلزم دخول المالك أو حساب مدير وضع الاستمرارية.','err');return}await load()}catch(e){stat(e.message==='PIN_REQUIRED'?'افتح MyTool وأدخل PIN اليومي أولًا.':'لا توجد صلاحية لفتح هذه الصفحة.','err')}})();
</script></body></html>
