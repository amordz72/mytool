<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>الفيرسمون المتوقع — MyTool</title>
<link rel="stylesheet" href="shop-common.css?v=20260914-001"><link rel="stylesheet" href="money-party-picker.css?v=20260914-001">
<style>
.page{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:17px;padding:15px;margin-bottom:12px}.summary,.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric,.item{background:#fafafa;border:1px solid #e5e7eb;border-radius:13px;padding:12px}.metric small{display:block;color:#6b7280}.metric strong{font-size:22px}.field{margin-top:10px}label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}input,select,textarea,button{width:100%;font:inherit;border-radius:11px;border:1px solid #e5e7eb;padding:11px;background:#fff}textarea{min-height:60px}.btn{border:0;background:#0f766e;color:#fff;font-weight:900}.secondary{background:#f8fafc!important;color:#172033!important;border:1px solid #dbe3ea!important}.actions{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}.actions button{width:auto}.row{display:flex;justify-content:space-between;gap:10px}.amount{font-size:18px;font-weight:900}.meta,.muted{font-size:12px;color:#6b7280;line-height:1.6}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.expected{background:#fff7ed;color:#9a3412}.confirmed{background:#ecfdf5;color:#047857}.cancelled{background:#f3f4f6;color:#6b7280}.message{padding:10px 12px;border-radius:12px;margin-bottom:12px;font-size:13px;font-weight:800}.info{background:#eff6ff;color:#1d4ed8}.ok{background:#ecfdf5;color:#047857}.error{background:#fff1f2;color:#b91c1c}@media(max-width:700px){.page{padding:8px}.summary,.grid{grid-template-columns:1fr}}
</style>
<script src="shop-routes.js?v=20260914-001"></script><script src="shop-shell.js?v=20260914-001"></script><script src="money-party-picker.js?v=20260914-002"></script>
</head>
<body data-screen="expected-money"><div class="page">
<div id="sharedOperationTop"></div><script>ShopShell.mountOperationTop('sharedOperationTop')</script>
<div id="message" class="message info">جاري التحميل…</div>
<section class="card"><h2>الفيرسمون المتوقع والمؤكد</h2><div class="muted">سجل يومي للمبالغ المنتظرة وما وصل فعليًا. هذه المتابعة لا تغيّر رصيد المحاسبة.</div><div class="field"><label>اليوم</label><input id="filterDate" type="date"></div><div class="summary" style="margin-top:10px"><div class="metric"><small>متوقع</small><strong id="expectedTotal">0 دج</strong></div><div class="metric"><small>مؤكد</small><strong id="confirmedTotal">0 دج</strong></div><div class="metric"><small>الإجمالي</small><strong id="dayTotal">0 دج</strong></div></div></section>
<section class="card"><h2>إضافة فيرسمون</h2><div class="muted">ابحث في الدليل أولًا. إذا لم يظهر الاسم، يظهر لك زر «إضافة الاسم» بعد كتابة اسمه.</div><form id="entryForm"><div class="grid"><div class="field"><label>العميل / المحل</label><input id="partySearch" autocomplete="off" placeholder="ابحث بالاسم…" required><div id="partyResults" class="mpp-results"></div></div><div class="field"><label>المبلغ</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required></div><div class="field"><label>الحالة</label><select id="status"><option value="expected">متوقع</option><option value="confirmed">مؤكد</option></select></div></div><div class="field"><label>الحساب / الوجهة</label><input id="destination" placeholder="اختياري"></div><div class="field"><label>ملاحظة</label><textarea id="notes" placeholder="اختياري"></textarea></div><button class="btn" type="submit" style="margin-top:10px">حفظ</button></form></section>
<section class="card"><h2>عمليات اليوم</h2><div id="items"></div></section>
</div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient(window.ShopApiConfig.url,window.ShopApiConfig.key),$=id=>document.getElementById(id),today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),money=v=>new Intl.NumberFormat('ar-DZ',{maximumFractionDigits:2}).format(Number(v||0))+' دج',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[],picker=null;
function msg(t,c='info'){$('message').textContent=t;$('message').className='message '+c}
function render(){const active=rows.filter(r=>r.status!=='cancelled'),e=active.filter(r=>r.status==='expected').reduce((s,r)=>s+Number(r.amount),0),c=active.filter(r=>r.status==='confirmed').reduce((s,r)=>s+Number(r.amount),0);$('expectedTotal').textContent=money(e);$('confirmedTotal').textContent=money(c);$('dayTotal').textContent=money(e+c);$('items').innerHTML=rows.length?rows.map(r=>'<div class="item"><div class="row"><div><strong>'+esc(r.party_name)+'</strong><div class="meta">'+esc(r.destination||'بدون وجهة')+(r.notes?'<br>'+esc(r.notes):'')+'</div></div><div><div class="amount">'+money(r.amount)+'</div><span class="badge '+r.status+'">'+(r.status==='expected'?'متوقع':r.status==='confirmed'?'مؤكد':'ملغي')+'</span></div></div><div class="actions">'+(r.status==='expected'?'<button class="btn" data-id="'+r.id+'" data-status="confirmed" type="button">تأكيد الوصول</button><button class="secondary" data-id="'+r.id+'" data-status="cancelled" type="button">إلغاء</button>':'<button class="secondary" data-id="'+r.id+'" data-status="expected" type="button">إرجاع إلى متوقع</button>')+'</div></div>').join(''):'<div class="muted">لا توجد مبالغ مسجلة لهذا اليوم.</div>';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>setStatus(Number(b.dataset.id),b.dataset.status))}
async function load(){const {data,error}=await supabase.rpc('admin_list_expected_money_transfers',{p_date:$('filterDate').value});if(error)return msg('تعذر التحميل: '+error.message,'error');rows=data||[];render();msg('تم تحميل سجل اليوم.','ok')}
async function setStatus(id,status){const {error}=await supabase.rpc('admin_set_expected_money_status',{p_id:id,p_status:status});if(error)return msg('تعذر التحديث: '+error.message,'error');await load()}
$('entryForm').onsubmit=async e=>{e.preventDefault();const p=picker?.getSelected(),amount=Number($('amount').value);if(!p)return msg('اختر العميل أو المحل من نتائج البحث، أو أضف الاسم إذا لم يكن موجودًا.','error');if(!Number.isFinite(amount)||amount<=0)return msg('راجع المبلغ.','error');const {error}=await supabase.rpc('admin_create_expected_money_transfer',{p_party_id:p.id,p_amount:amount,p_destination:$('destination').value.trim()||null,p_status:$('status').value,p_notes:$('notes').value.trim()||null,p_transfer_date:$('filterDate').value});if(error)return msg('تعذر الحفظ: '+error.message,'error');$('amount').value='';$('destination').value='';$('notes').value='';$('status').value='expected';picker.clear();await load();msg('تم حفظ الفيرسمون.','ok')};
$('filterDate').onchange=load;$('filterDate').value=today();const {data}=await supabase.auth.getSession();if(!data?.session){location.replace('../')}else{ShopShell.mountRoleNavigation({role:'admin',permissions:{}},'expected-money');picker=MoneyPartyPicker.create({supabase,role:'admin',input:'partySearch',results:'partyResults',limit:60,allowCreate:true,onCreate:p=>msg('تمت إضافة «'+p.name+'» إلى دليل العملاء.','ok'),onError:e=>msg('تعذر تحميل أو إضافة اسم العميل: '+(e.message||e),'error')});await load()}
</script></body></html>
