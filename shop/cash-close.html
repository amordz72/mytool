<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إغلاق الكيس — MyTool</title><link rel="stylesheet" href="shop-common.css?v=20260913-1501"><script src="shop-routes.js?v=20260913-1501"></script><script src="shop-shell.js?v=20260913-1501"></script><style>:root{--bg:#f4f7fb;--line:#e5e7eb;--main:#0f766e;--danger:#b91c1c;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:var(--bg)}main{max-width:760px;margin:auto;padding:10px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:9px}.msg{padding:10px;border-radius:10px;background:#eff6ff;color:#1d4ed8;margin-bottom:9px}.msg.error{background:#fff1f2;color:var(--danger)}select,input,textarea,button{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.denoms{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.d{padding:8px;border:1px solid var(--line);border-radius:10px}.d b{display:block;margin-bottom:4px}.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.t{padding:9px;border:1px solid var(--line);border-radius:10px}.t small{display:block;color:var(--muted)}.t b{font-size:20px}button{background:var(--main);color:#fff;font-weight:900;margin-top:8px}.muted{color:var(--muted);font-size:12px;line-height:1.6}@media(max-width:600px){.denoms{grid-template-columns:repeat(2,1fr)}.totals{grid-template-columns:1fr}}</style></head><body data-screen="cash-close"><main><div id="top"></div><script>ShopShell.mountStandalone('top',{role:'admin'})</script><div id="msg" class="msg">جاري التحميل…</div><section class="card"><h2>إغلاق الكيس</h2><div class="muted">اكتب عدد كل فئة. يمكنك معاينة الحساب بدون حفظ. التسجيل يحدث الرصيد الفعلي للكيس عبر المطابقة الموثقة الموجودة أصلًا.</div><p><select id="place"></select></p><div id="denoms" class="denoms"></div><p><label>مبلغ آخر</label><input id="other" type="number" min="0" step="0.01" value="0"></p><div class="totals"><div class="t"><small>المتوقع</small><b id="expected">0</b></div><div class="t"><small>الفعلي</small><b id="actual">0</b></div><div class="t"><small>الفرق</small><b id="diff">0</b></div></div><p><textarea id="notes" placeholder="ملاحظة اختيارية"></textarea></p><button id="save">تسجيل الإغلاق وتحديث الرصيد</button><button id="print" type="button">طباعة المعاينة</button></section><section class="card"><h2>آخر الإغلاقات</h2><div id="history"></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const c=window.ShopApiConfig,s=createClient(c.url,c.key),$=x=>document.getElementById(x),D=[10,20,50,100,200,500,1000,2000],M=n=>new Intl.NumberFormat('ar-DZ').format(Number(n||0))+' دج';let places=[],ops=[];function p(){return places.find(x=>+x.id===+$('place').value)}function counts(){let o={};D.forEach(d=>o[d]=Math.max(0,Math.trunc(+document.querySelector('[data-d="'+d+'"]').value||0)));return o}function calc(){let o=counts(),a=D.reduce((n,d)=>n+d*o[d],0)+Math.max(0,+$('other').value||0),e=+p()?.balance||0;$('expected').textContent=M(e);$('actual').textContent=M(a);$('diff').textContent=(a-e>0?'+':'')+M(a-e);return{a,e,d:a-e,o}}function draw(){ $('denoms').innerHTML=D.map(d=>'<div class="d"><b>'+d+' دج</b><input data-d="'+d+'" type="number" min="0" step="1" value="0"></div>').join('');document.querySelectorAll('[data-d]').forEach(i=>i.oninput=calc);$('other').oninput=calc }function hist(){let r=ops.filter(x=>x.operation_type==='reconcile'&&String(x.notes||'').includes('إغلاق الكيس')).slice(0,12);$('history').innerHTML=r.length?r.map(x=>'<p><b>'+x.to_place_name+'</b><br><small>'+new Date(x.operation_at).toLocaleString('ar-DZ')+' · الفرق '+M(x.difference_amount)+'</small></p>').join(''):'<div class="muted">لا يوجد إغلاق محفوظ بعد.</div>'}async function load(){let r=await s.rpc('admin_get_cash_places_context');if(r.error)throw r.error;places=(r.data?.places||[]).filter(x=>x.place_type==='shop_bag');ops=r.data?.operations||[];$('place').innerHTML=places.map(x=>'<option value="'+x.id+'">'+x.name+' — '+M(x.balance)+'</option>').join('');$('place').onchange=calc;calc();hist();$('msg').textContent='جاهز للعد.'}function note(v){let o=v.o,b=D.filter(d=>o[d]).map(d=>d+'×'+o[d]).join('، ');return'إغلاق الكيس | الفئات: '+(b||'بدون')+($('notes').value.trim()?' | '+$('notes').value.trim():'')}async function save(){let x=p(),v=calc();if(!x)return;if(!confirm('تأكيد إغلاق '+x.name+' على '+M(v.a)+'؟'))return;let r=await s.rpc('admin_reconcile_cash_place',{p_place_id:+x.id,p_actual_balance:v.a,p_notes:note(v)});if(r.error)throw r.error;localStorage.setItem('mytool_last_cash_close_v1',JSON.stringify({day:new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Algiers'}).format(new Date()),place:x.name,expected:v.e,actual:v.a,diff:v.d,when:new Date().toISOString(),notes:$('notes').value.trim()}));await load();$('msg').textContent=+r.data===0?'تم الإغلاق والرصيد مطابق.':'تم الإغلاق وحفظ فرق المطابقة.'}function print(){let x=p(),v=calc(),w=open('','_blank');if(!w)return;w.document.write('<html dir="rtl"><meta charset="utf-8"><body style="font-family:Arial;padding:25px"><h1>MyTool — إغلاق الكيس</h1><p>الكيس: '+x.name+'</p><p>المتوقع: '+M(v.e)+'</p><p>الفعلي: '+M(v.a)+'</p><h2>الفرق: '+M(v.d)+'</h2><p>'+note(v)+'</p><button onclick="print()">طباعة / PDF</button></body></html>');w.document.close()}async function init(){let a=await s.auth.getSession();if(!a.data?.session){location.replace('../');return}draw();if(localStorage.getItem('mytool_admin_data_mode')==='test'){$('save').disabled=true;$('msg').textContent='الوضع التجريبي: التسجيل متوقف لأنه سيغير رصيد النقد الحقيقي.';$('msg').className='msg error'}await load();if(localStorage.getItem('mytool_admin_data_mode')==='test')$('save').disabled=true}$('save').onclick=()=>save().catch(e=>$('msg').textContent='خطأ: '+e.message);$('print').onclick=print;init().catch(e=>$('msg').textContent='خطأ: '+e.message);</script></body></html>
