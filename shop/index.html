<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0f766e">
  <title>حساب المحل — MyTool</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--main:#0f766e;--main2:#14b8a6;--danger:#b91c1c}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--text)}
    [v-cloak]{display:none}.app{max-width:900px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .back{color:var(--main);text-decoration:none;font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 5px 18px rgba(15,23,42,.05)}
    h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 14px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}input,select,textarea,button{width:100%;font:inherit;border-radius:12px;border:1px solid var(--line);padding:12px;background:#fff}
    textarea{min-height:70px;resize:vertical}.btn{border:0;background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}
    .btn.secondary{background:#fff;color:var(--main);border:1px solid var(--main)}.error{background:#fff1f2;color:var(--danger);padding:10px;border-radius:12px;margin-top:10px;font-size:13px}
    .ok{background:#ecfdf5;color:#047857;padding:10px;border-radius:12px;margin-top:10px;font-size:13px}.stock{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .stock-item{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}.stock-name{font-size:13px}.stock-num{font-size:23px;font-weight:900;margin-top:5px}
    .toolbar{display:flex;gap:8px;align-items:center}.toolbar button{width:auto;padding:9px 13px}.pill{display:inline-block;background:#ecfeff;color:#0f766e;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}
    .login{max-width:460px;margin:7vh auto}.login h1{margin-bottom:8px}.login .field{margin-bottom:11px}.soon{opacity:.65}.footer{text-align:center;color:var(--muted);font-size:11px;padding:10px}
    @media(max-width:620px){.grid,.stock{grid-template-columns:1fr}.app{padding:10px}.top{align-items:flex-start}.toolbar{flex-wrap:wrap}}
  </style>
</head>
<body>
<div id="app" class="app" v-cloak>
  <template v-if="loading"><div class="card">جاري الاتصال بقاعدة البيانات…</div></template>
  <template v-else-if="!session">
    <section class="card login">
      <a class="back" href="../">← MyTool</a><h1>حساب المحل</h1><p class="muted">الدخول للحسابات المصرح بها فقط.</p>
      <form @submit.prevent="login">
        <div class="field"><label>البريد الإلكتروني</label><input v-model.trim="email" type="email" autocomplete="username" required></div>
        <div class="field"><label>كلمة المرور</label><input v-model="password" type="password" autocomplete="current-password" required></div>
        <button class="btn" :disabled="busy">{{ busy ? 'جاري الدخول…' : 'دخول' }}</button>
      </form>
      <div v-if="message" :class="messageType">{{ message }}</div>
    </section>
  </template>
  <template v-else>
    <header class="top"><div><a class="back" href="../">← MyTool</a><h1>حساب المحل</h1><span class="pill">Supabase + Vue</span></div><div class="toolbar"><button class="btn secondary" @click="loadAll" :disabled="busy">تحديث</button><button class="btn secondary" @click="logout">خروج</button></div></header>
    <section class="card">
      <h2>تسجيل بيع</h2>
      <form @submit.prevent="saveSale">
        <div class="grid">
          <div><label>الخدام / المسجل</label><select v-model.number="sale.sold_by" required><option disabled value="">اختر</option><option v-for="s in staff" :key="s.id" :value="s.id">{{ s.name }}</option></select></div>
          <div><label>السلعة</label><select v-model.number="sale.product_id" required><option disabled value="">اختر</option><option v-for="p in products" :key="p.id" :value="p.id">{{ p.name }}</option></select></div>
          <div><label>الكمية</label><input v-model.number="sale.quantity" type="number" min="1" step="1" required></div>
          <div><label>سعر الوحدة بالدينار</label><input v-model.number="sale.unit_price" type="number" min="0" step="0.01" inputmode="decimal" required></div>
        </div>
        <div style="margin-top:10px"><label>ملاحظة (اختياري)</label><textarea v-model.trim="sale.notes"></textarea></div>
        <button class="btn" style="margin-top:10px" :disabled="busy">{{ busy ? 'جاري الحفظ…' : 'حفظ البيع' }}</button>
      </form>
      <div v-if="message" :class="messageType">{{ message }}</div>
    </section>
    <section class="card"><div class="top" style="margin:0 0 12px"><div><h2 style="margin:0">المخزون الحالي</h2><div class="muted">محسوب من الحركات المسجلة.</div></div><div class="pill">{{ inventory.length }} سلع</div></div><div class="stock"><div class="stock-item" v-for="item in inventory" :key="item.product_id"><div class="stock-name">{{ item.name }}</div><div class="stock-num">{{ item.stock_quantity }}</div></div></div></section>
    <section class="card soon"><h2>الجرد الحقيقي</h2><p class="muted">المرحلة التالية: تدخل العدد الحقيقي لكل سلعة، ويحسب البرنامج الفرق ثم يسجله كتعديل جرد بدون حذف سجل المبيعات.</p><button disabled>قريباً</button></section>
    <div class="footer">البيانات التشغيلية محفوظة في Supabase وليست داخل GitHub.</div>
  </template>
</div>
<script type="module">
  import { createApp, ref, onMounted } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js'
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
  const SUPABASE_URL = 'https://wqyebqzbbpohbnznqdjj.supabase.co'
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_gO4umNBMJ0AWRk19HtKd7A_9X4DibYj'
  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
  createApp({setup(){
    const session=ref(null),loading=ref(true),busy=ref(false),email=ref(''),password=ref(''),message=ref(''),messageType=ref('ok'),staff=ref([]),products=ref([]),inventory=ref([]),sale=ref({sold_by:'',product_id:'',quantity:1,unit_price:'',notes:''})
    function notify(text,type='ok'){message.value=text;messageType.value=type==='error'?'error':'ok'}
    async function login(){busy.value=true;message.value='';const {data,error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});busy.value=false;if(error)return notify('تعذر تسجيل الدخول: '+error.message,'error');session.value=data.session;password.value='';await loadAll()}
    async function logout(){await supabase.auth.signOut();session.value=null;staff.value=[];products.value=[];inventory.value=[]}
    async function loadAll(){busy.value=true;message.value='';const [s,p,i]=await Promise.all([supabase.from('staff').select('id,name').eq('active',true).order('id'),supabase.from('products').select('id,name').order('id'),supabase.from('inventory_summary').select('product_id,name,stock_quantity').order('product_id')]);busy.value=false;const error=s.error||p.error||i.error;if(error)return notify('خطأ في قراءة البيانات: '+error.message,'error');staff.value=s.data||[];products.value=p.data||[];inventory.value=i.data||[]}
    async function saveSale(){if(!sale.value.sold_by||!sale.value.product_id)return notify('اختر الخدام والسلعة.','error');if(!Number.isInteger(Number(sale.value.quantity))||Number(sale.value.quantity)<1)return notify('الكمية غير صحيحة.','error');if(Number(sale.value.unit_price)<0||sale.value.unit_price==='')return notify('السعر غير صحيح.','error');busy.value=true;message.value='';const payload={sold_by:Number(sale.value.sold_by),product_id:Number(sale.value.product_id),quantity:Number(sale.value.quantity),unit_price:Number(sale.value.unit_price),notes:sale.value.notes||null};const {error}=await supabase.from('sales').insert(payload);busy.value=false;if(error)return notify('لم يتم حفظ البيع: '+error.message,'error');notify('تم تسجيل البيع بنجاح.');sale.value.product_id='';sale.value.quantity=1;sale.value.unit_price='';sale.value.notes='';await loadAll()}
    onMounted(async()=>{const {data}=await supabase.auth.getSession();session.value=data.session;loading.value=false;if(session.value)await loadAll();supabase.auth.onAuthStateChange((_event,newSession)=>{session.value=newSession})})
    return{session,loading,busy,email,password,message,messageType,staff,products,inventory,sale,login,logout,loadAll,saveSale}
  }}).mount('#app')
</script>
</body>
</html>
